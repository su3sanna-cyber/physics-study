function caseKey(u,i){if(u.id===1&&i===2)return 'reference';if(u.id===2)return [0,2].includes(i)?'sound':null;if(u.id===3)return ['pinhole','reflection','mirror','refraction',null,null][i];if(u.id===4&&(i===1||i===4))return 'cycle';if(u.id===5&&[1,3,4].includes(i))return 'density';if(u.id===6)return [null,'spring','inertia','force','friction','friction'][i];if(u.id===7)return ['pressure','liquid',null,'buoyancy','floating','buoyancy'][i];if(u.id===8)return ['lever','pulley','work','efficiency','energy','energy'][i];if(u.id===9)return ['particles',null,'particles','heat',null,'heat'][i];if(u.id===11&&i===0)return 'power';if(u.id===12)return ['magnet','magnet','motor','motor',null,null][i];return null}
function physicalCase(kind){const c=physicalCases[kind];if(!c)return '';const range=(f,id)=>f?`<label for="${id}">${e(f[0])} <span id="${id}Value"></span> ${e(f[5])}</label><input id="${id}" type="range" min="${f[1]}" max="${f[2]}" value="${f[3]}" step="${f[4]}">`:'';return `<section class="physical-case" data-case="${kind}"><div class="label">先看图，再动手</div><h3>${e(c.title)}</h3><div id="caseCanvas"></div><p>${e(c.intro)}</p>${c.mode?`<label for="caseMode">${e(c.mode[0])}</label><select id="caseMode">${c.mode[1].map(([id,t])=>`<option value="${id}">${e(t)}</option>`).join('')}</select>`:''}${range(c.a,'caseA')}${range(c.b,'caseB')}<div class="row"><button id="casePlay">播放现象</button><button id="caseReset" class="quiet">重置</button>${kind==='sound'?'<button id="caseListen" class="quiet">低音量试听2秒</button>':''}</div><p id="caseExplain" class="worked-example" aria-live="polite"></p><p class="small">${e(c.note)}</p></section>`}
const fluidRho={water:1000,oil:900,salt:1100};
function physicalModel(kind,a,b,mode,t){const p=Math.min(1,t/3);switch(kind){case'reference':return {shift:(t*38)%190};case'pinhole':return {objectX:190-a,screenX:190+b,imageH:45*b/a};case'mirror':return {objectX:190-a,imageX:190+a,distance:2*a};case'refraction':return {depth:a,apparent:mode==='water'?a/(4/3):a};case'density':{const material=mode.split('-')[0],sameMass=mode.endsWith('-mass'),rho={oil:.9,alcohol:.79,salt:1.1}[material];return {rho,material,sameMass,leftVolume:a,rightVolume:sameMass?a/rho:a,mass:sameMass?a:a*rho,waterMass:a}}case'force':return {g:20,n:20,pull:mode==='rest'?0:mode==='uniform'?30:40,friction:mode==='rest'?0:30,net:mode==='accelerate'?10:0};case'spring':return {force:a,extension:12*a};case'friction':{const max=mode==='rough'?12:6,slide=mode==='rough'?8:4,sliding=a>max;return {sliding,friction:sliding?slide:a,net:sliding?a-slide:0,max}}case'liquid':return {rho:fluidRho[mode],pressure:fluidRho[mode]*10*a/100};case'buoyancy':{const v=.0002*a/100,f=fluidRho[mode]*10*v;return {displaced:v,buoyancy:f,tension:5-f,gravity:5}}case'floating':{const rho=fluidRho[mode],g=a*10*.0001,full=rho*10*.0001;return {fraction:Math.min(1,a/rho),gravity:g,buoyancy:Math.min(g,full),state:a<rho?'漂浮':a===rho?'悬浮':'沉底',support:Math.max(0,g-full)}}case'lever':return {force:8/a};case'heat':return {q:42000*a,progress:p};case'power':{const time=Math.min(3600,t*600),rightTime=Math.min(time,(b||60)*60);return {time,rightTime,left:100*time,right:a*rightTime}}case'energy':return {potential:1-p,kinetic:p*(mode==='loss'?.7:1),internal:mode==='loss'?p*.3:0,p};default:return {p,t}}
}
function setupPhysicalCase(kind){if(!physicalCases[kind]||!document.getElementById('caseCanvas'))return;const c=physicalCases[kind],canvas=document.getElementById('caseCanvas'),play=document.getElementById('casePlay');let t=0,running=false,last=null,frame=null,audio=null;const values=()=>({a:Number(document.getElementById('caseA')?.value||0),b:Number(document.getElementById('caseB')?.value||0),mode:document.getElementById('caseMode')?.value||''});function draw(){const {a,b,mode}=values();['caseA','caseB'].forEach(id=>{const el=document.getElementById(id);if(el)document.getElementById(id+'Value').textContent=el.value});if(kind==='density'){document.querySelector('label[for="caseA"]').innerHTML=(mode.endsWith('-mass')?'每杯液体质量':'每杯液体体积')+' <span id="caseAValue">'+a+'</span> '+(mode.endsWith('-mass')?'g':'mL')}if(kind==='friction'){const hide=mode==='walk'||mode.startsWith('test'),input=document.getElementById('caseA');input.hidden=hide;document.querySelector('label[for="caseA"]').hidden=hide}const m=physicalModel(kind,a,b,mode,t),out=physicalDrawing(kind,m,a,b,mode,t);canvas.innerHTML=out.svg;document.getElementById('caseExplain').innerHTML=rich(out.explain);play.textContent=running?'暂停':'播放现象';const noPlay=['density','mirror','spring','liquid','buoyancy','floating','lever','magnet'].includes(kind);play.hidden=noPlay}function stopSound(){if(audio){try{audio.close().catch(()=>{})}catch{}audio=null}}function tick(now){if(!running||!canvas.isConnected){stopSound();return}if(last!==null)t+=Math.min(.08,(now-last)/1000);last=now;if(['reference','inertia','pinhole','refraction','heat','energy','cycle','friction'].includes(kind)&&t>=3){t=3;running=false}if(kind==='power'&&t>=6){t=6;running=false}draw();if(running)frame=requestAnimationFrame(tick)}play.onclick=()=>{if((t>=3&&['inertia','pinhole','refraction','heat','energy'].includes(kind))||(kind==='power'&&t>=6))t=0;running=!running;last=null;if(running)frame=requestAnimationFrame(tick);else cancelAnimationFrame(frame);draw()};document.getElementById('caseReset').onclick=()=>{running=false;cancelAnimationFrame(frame);stopSound();t=0;draw()};['caseA','caseB','caseMode'].forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=()=>{t=0;stopSound();draw()}});if(kind==='sound')document.getElementById('caseListen').onclick=async()=>{stopSound();const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio){document.getElementById('caseExplain').textContent='这个浏览器暂不支持试听，可以先看振动和波形。';return}try{audio=new Audio();await audio.resume();const {a,b,mode}=values();if(mode==='stopped'){stopSound();document.getElementById('caseExplain').textContent='发声振动停止，这次发声停止。已经传出去的声音仍继续传播。';return}const osc=audio.createOscillator(),gain=audio.createGain();osc.type=mode;osc.frequency.value=a;gain.gain.setValueAtTime(0,audio.currentTime);gain.gain.linearRampToValueAtTime(.012*b,audio.currentTime+.04);gain.gain.setValueAtTime(.012*b,audio.currentTime+1.85);gain.gain.linearRampToValueAtTime(0,audio.currentTime+2);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+2.02);const owned=audio;osc.onended=()=>{owned.close().catch(()=>{});if(audio===owned){audio=null;if(canvas.isConnected)draw()}};document.getElementById('caseExplain').textContent='试听中：'+a+' Hz，'+(mode==='sine'?'正弦波':'三角波')+'。下次只改一个条件，再比较听到的变化。';}catch{document.getElementById('caseExplain').textContent='试听没有启动，可以先用图观察，或在手机浏览器中再试。'}};draw()}

if(kind==='mirror'){d=line('M190 25V225','#7b9c8a',4)+person(m.objectX,130)+person(m.imageX,130,0,true)+line(`M${m.objectX} 200H${m.imageX}`,'#a4b5a8')+T((m.objectX+190)/2,211,'物距',11)+T((m.objectX+190)/2,231,a,11)+T((m.imageX+190)/2,211,'像距',11)+T((m.imageX+190)/2,231,a,11)+T(m.objectX,44,'镜前的人')+T(m.imageX,44,'镜后的虚像');if(mode==='rays'){const sourceY=95,eyeX=m.objectX-12,eye1=110,eye2=118,p1=sourceY+(eye1-sourceY)*a/(2*a+12),p2=sourceY+(eye2-sourceY)*a/(2*a+12);d+=arrow(m.objectX,sourceY,190,p1)+arrow(190,p1,eyeX,eye1)+arrow(m.objectX,sourceY,190,p2)+arrow(190,p2,eyeX,eye2)+`<path d="M190 ${p1}L${m.imageX} ${sourceY}M190 ${p2}L${m.imageX} ${sourceY}" stroke="#b49167" fill="none" stroke-dasharray="5 4"/>`}explain='像与人等大、关于镜面对称；你离镜'+a+'，像也离镜'+a+'，人像相距'+m.distance+'。虚线只表示反射光的反向延长线，镜后没有实际光线会聚，因此光屏不能直接承接这个虚像。'}
