or:#4e5e68;border:1px solid #dce3e7}.choices button[data-selected=correct]{background:#edf5ef;border-color:#8cab98}.choices button[data-selected=retry]{background:#faf7f0;border-color:#d3c5a9}.feedback{display:none;background:#f3f7f4;border-left:2px solid #8aaa97;padding:12px;font-size:14px;margin:12px 0}.feedback.show{display:block}.step-row{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid #edf0f2}.step-row>span{color:#92a19a;font-size:12px;padding-top:3px}.step-row p{margin:0;font-size:15px}.foot{font-size:12px;color:#8a959b;text-align:center;margin-top:26px}li{margin:10px 0}ul,ol{padding-left:22px}.section-end{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.recall button{display:block;width:100%;text-align:left;background:#f7faf8;margin:8px 0;font-size:15px}.recall .small{display:block;font-size:12px}.overview-start{margin-top:17px}.checks{font-size:13px;color:#6b7a72}.nav-result{color:#78877c;font-size:13px}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.opening-visual svg,#torchDrawing svg{display:block;width:100%;max-width:400px;margin:12px auto}.opening-visual{background:#f7f9f7;border-radius:10px}.card>summary{cursor:pointer;font-weight:600;color:#486151}</style></head><body><header><div><div class="top"><span>初中物理 / 一轮复习</span><span class="badge" id="badge"></span></div><h1 id="title"></h1><p id="subtitle"></p></div></header><main id="app"></main><script>const units=[{"id":1,"title":"测量与机械运动","lead":"怎样公平地比较快慢？","lab":"motion","goal":"读数和单位 → 参照物 → 速度与图像","concepts":[["测量先看分度值","刻度尺先看单位、量程和分度值。视线正对刻度，能估读时估读到分度值下一位。零刻度损坏时可从其他刻度开始，长度用两端读数相减。多次测同一长度取平均值能减小随机误差；误差与读错、操作错误不同。"],["换单位，量本身没有变","1 m＝100 cm＝1000 mm；1 min＝60 s；1 h＝3600 s。1 m/s＝3.6 km/h。把72 km/h变为m/s，用72÷3.6＝20。别把分钟直接代入要求秒的公式。"],["参照物：你在和谁比较","判断运动、静止前，先选参照物。同向同速的两辆车相对静止，相对路边树木则运动。位置相对参照物发生变化，就说它在运动。"],["速度：每单位时间走多远","v＝s/t，s＝vt，t＝s/v。v是速度、s是路程、t是时间。平均速度用总路程÷总时间，包括该过程中的停留时间；通常不能直接平均两段速度。"],["图像与实验","路程—时间图像：横轴时间、纵轴路程，匀速运动对应直线，斜率越大速度越大。测平均速度需测对应过程的路程与时间，重复实验应明确测的是哪个过程。"]],"example":["全程平均速度","先走120 m用60 s，再走60 m用60 s，求全程平均速度。","① 研究整个过程，不单取一段。② 总路程180 m，总时间120 s。③ v＝180÷120＝1.5 m/s。④ 检查单位：m÷s＝m/s。"],"quiz":[["两段用时各60 s，速度分别2 m/s和1 m/s。全程平均速度？",["1.5 m/s","3 m/s","不能求"],0,"两段时间相等，总路程180 m、总时间120 s，得1.5 m/s。这里可以恰好等于算术平均，换成不等时间就不能直接这样算。"],["匀速车速72 km/h，10 s走多远？",["720 m","200 m","20 m"],1,"先换单位：72 km/h＝20 m/s。s＝vt＝20×10＝200 m。"]],"recap":["读数先看分度值。","判断运动要说明参照物。","全程平均速度先加路程、加时间，再相除。"],"mission":{"name":"撤离路线","question":"120米的走廊，两次走完全程：这次用时减半，平均速度会怎样？","options":["变成一半","变成两倍","不变"],"correct":1,"reason":"同路程，v＝s/t；用时减半，速度加倍。","anchor":"速度是“每秒走多远”。"},"focus":["先看一小格代表多少","同一个量，可以换单位表达","运动还是静止，要先选参照物","平均速度＝总路程÷总时间","图线越陡，速度通常越大"],"teacher":{"contrast":[["平均速度","整个过程：总路程÷总时间。"],["算术平均","只有相应特殊条件成立，才与平均速度相等。"]],"reason":"先画两段过程，分别列路程和用时。圈出题目问“哪一段”；先换单位，再计算。","experiment":"测平均速度：路程与时间必须对应同一过程；坡度过大、过程过快可能增大计时困难。"},"variant":["相同的两段路程分别以2 m/s、1 m/s走完，全程平均速度？",["1.5 m/s","约1.33 m/s","3 m/s"],1,"取每段2 m：总路程4 m，用时1＋2＝3 s，所以4/3≈1.33 m/s。等路程不等时间，不能直接平均速度。"]},{"id":2,"title":"声现象","lead":"声音的高、响和特色，区别在哪？","lab":"sound","goal":"振动与传播 → 三个特性 → 声音应用与降噪","concepts":[["声音从振动来","声音由物体振动产生。敲鼓时鼓面振动，音叉发声时也振动。振动停止，相应声源的发声停止；已经传播出去的声音还可能继续传播。"],["传播需要介质","固体、液体、气体都可以传声，真空不能传声。空气中声速在15℃时约340 m/s，随温度、介质等条件变化，不是所有题都用340。"],["音调、响度、音色","音调看频率：振动越快，通常音调越高。响度与振幅、距离等有关：振幅越大通常越响。音色由发声体特点等决定，帮助辨认声音来自谁。不能用“更响”代替“音调更高”。"],["超声、次声与应用","通常人耳听觉频率约20—20000 Hz。高于上限为超声，低于下限为次声，按频率区分，不是按响度。声音能传信息，也能传能量，如超声检测和清洗。"],["控制噪声","声源处：减少或停止振动；传播过程：隔音屏、关窗；人耳处：耳塞。研究音调时要主要改变频率，研究响度时要主要改变振幅。"]],"example":["回声测距","声音发出后0.4 s听到回声，声速340 m/s，障碍物距声源多远？","① 0.4 s对应去、回两段。② 声音总路程＝340×0.4＝136 m。③ 单程距离＝136÷2＝68 m。④ 不把往返路程当距离。"],"quiz":[["敲同一面鼓更用力，主要改变什么？",["音色","响度","一定改变音调"],1,"更用力通常使振幅更大、响度更大。不能由用力大小直接推断频率。"],["月面近乎真空，两人能靠空气直接交谈吗？",["能","不能","大声就能"],1,"声音需要介质，近乎真空不能靠空气直接传声，可以用无线电传信息。"]],"recap":["音调看频率，响度看振幅等，辨人靠音色。","真空不能传声。","回声测距离要考虑往返。"],"mission":{"name":"辨认声源","question":"同一琴弦振动得更快，先变化的是？","options":["音调","响度","一定改变音色"],"correct":0,"reason":"频率变高，音调升高；不能由频率直接判断响度。","anchor":"音调看快慢，响度看幅度。"},"focus":["声音来自振动","声音传播要有介质","高、响、特色：分开判断","超声按频率分，不按响度分","降噪可从三个位置入手"],"teacher":{"contrast":[["音调","由频率高低判断，回答“高或低”。"],["响度","与振幅、距离等有关，回答“响或轻”。"]],"reason":"遇到声音题，先判断考产生、传播、特性还是应用。分别找振动、介质、频率、振幅等证据。","experiment":"研究频率与音调：改变振动快慢。用小球弹起等现象显示振动，属于转换思路。"},"variant":["同一声源频率不变、振幅变大，通常怎样？",["音调更高","响度更大","音色一定改变"],1,"频率不变不意味着音调升高；相同距离等条件下，振幅更大通常响度更大。"]},{"id":3,"title":"光现象与透镜","lead":"先追踪光怎么走，再判断像在哪里。","lab":"light","goal":"直线传播 → 反射与折射 → 成像与作图","concepts":[["看见物体，是光进入眼睛","光源能自行发光；月亮和普通镜子主要反射别处光，通常不是光源。光在同种均匀介质中沿直线传播，影子、小孔成像、日月食与此有关。小孔成像是倒立实像。"],["反射先画法线","法线过入射点且垂直镜面。入射角、反射角都从法线量起，反射角＝入射角。漫反射也遵守反射定律，光路可逆。作图先画法线，再画光线箭头。"],["平面镜成虚像","像与物等大，像距与物距相等，连线垂直镜面，关于镜面对称。虚像不能用光屏承接；人靠近镜子，像的实际大小不变。实验用玻璃板及相同蜡烛定位与比较大小，玻璃板需竖直。"],["折射与色光","空气斜入水或玻璃，折射光通常靠近法线；反向进入空气时远离法线。垂直入射方向不变。水底看起来变浅与折射有关。白光可色散，光的三原色红、绿、蓝；不透明物体颜色取决于主要反射的色光。"],["凸透镜成像要看物距","凸透镜会聚，凹透镜发散。物距u＞2f：倒立缩小实像；u＝2f：倒立等大实像；f＜u＜2f：倒立放大实像；u＜f：正立放大虚像；u＝f时不在有限距离成清晰像。相机、投影仪、放大镜分别对应相应区间。"],["作图、实验与眼镜","平行主轴的光经凸透镜后过焦点，过光心光方向近似不变。实验使烛焰、透镜、光屏中心大致同高。近视通常用凹透镜矫正，远视通常用凸透镜矫正。红外线常涉及热效应，紫外线可引起荧光等。"]],"example":["镜面角不等于入射角","光线与镜面夹角30°，求反射角。","① 法线与镜面垂直。② 入射角＝90°−30°＝60°。③ 反射角＝入射角＝60°。④ 两个角都以法线为基准。"],"quiz":[["人离平面镜2 m，像离人多远？",["2 m","4 m","1 m"],1,"像在镜后2 m，人在镜前2 m，人像距离为4 m。"],["凸透镜f＝10 cm，u＝15 cm，成什么像？",["倒立放大实像","正立缩小实像","正立放大虚像"],0,"10＜15＜20，即f＜u＜2f，成倒立放大实像；像距大于2f。"]],"recap":["先画法线，角从法线量。","平面镜物像对称。","凸透镜先比较u、f、2f，再说大小、正倒、虚实。"],"mission":{"name":"镜面探路","question":"光线与镜面夹角20°，反射角是多少？","options":["20°","70°","90°"],"correct":1,"reason":"角要从法线量：入射角90°−20°＝70°，反射角相同。","anchor":"先画法线，再量角。"},"focus":["光进入眼睛，我们才看得见","反射角＝入射角","像与物关于镜面对称","跨介质时，光路可能转弯","凸透镜先比较u、f和2f","实像可以用光屏承接"],"teacher":{"contrast":[["实像","实际光线会聚形成，可用光屏承接。"],["虚像","光线反向延长线等形成，不能用光屏承接。"]],"reason":"反射先画法线；成像先识别平面镜还是透镜；透镜先比较u、f、2f，再判断正倒、大小、虚实。","experiment":"平面镜实验用相同物体比较大小、定位像；凸透镜实验中心同高。换位置多测为检验普遍规律。"},"variant":["入射角40°，入射光线与反射光线间夹角是多少？",["40°","80°","140°"],1,"两条光线位于法线两侧，夹角＝入射角＋反射角＝80°。"]},{"id":4,"title":"温度与物态变化","lead":"先认状态变化，再判断吸热放热。","lab":"phase","goal":"温度读数 → 六种变化 → 温度图像与实验","concepts":[["温度与测量","温度表示冷热程度。液体温度计通常利用热胀冷缩。先看量程、分度值，感温部分充分浸入且不碰底壁，示数稳定后视线与液面相平读数，通常仍留在被测液体中。体温计等器材按其说明操作。"],["六种变化","固→液熔化，液→固凝固；液→气汽化，气→液液化；固→气升华，气→固凝华。熔化、汽化、升华吸热，逆过程放热。"],["蒸发与沸腾","蒸发在液体表面发生，任何温度下可发生；沸腾在液体内部和表面同时剧烈发生，需达到相应沸点并持续吸热。蒸发快慢与温度、表面积、表面空气流动等有关。"],["温度不变也可能吸热","晶体熔化时持续吸热，温度保持熔点；一定气压下液体沸腾时继续吸热，温度保持沸点。非晶体熔化没有固定熔点。沸点会随液面上方气压变化。"],["辨认生活现象","露、雾和常见“白气”主要是水蒸气液化形成的小液滴，不是看得见的气态水。霜是凝华形成冰晶。干冰直接变成气体是升华。实验图像先看坐标和条件，再找平台及前后状态。"]],"example":["温度平台怎么读","给冰持续加热，一段时间温度保持0℃，冰逐渐减少。这一段吸热吗？","① 研究冰的熔化过程。② 冰是晶体，熔化期间温度可不变。③ 仍持续吸热，用于物态改变。④ 温度不变不等于没有吸热。"],"quiz":[["湿衣服晾干是什么变化？",["液化放热","汽化吸热","升华吸热"],1,"液态水变成气态水，是汽化中的蒸发，吸热。"],["冬天窗玻璃出现霜，是什么变化？",["凝华","凝固","液化"],0,"水蒸气直接变成冰晶，是气态到固态的凝华，放热。"]],"recap":["先写变化前后状态，再选名称。","晶体熔化、液体沸腾平台仍吸热。","“白气”通常是小液滴，不是水蒸气。"],"mission":{"name":"冰块解冻","question":"冰正在0℃熔化。继续加热，温度会怎样？","options":["马上升高","保持不变直到熔化完成","立即降低"],"correct":1,"reason":"冰是晶体，熔化期间仍吸热，但温度保持熔点。","anchor":"温度不变，也能吸热。"},"focus":["读数前，等温度计稳定","先认变化前后的状态","蒸发和沸腾不是同一种过程","熔化平台，吸热不停","白气通常是小液滴"],"teacher":{"contrast":[["温度变化","看图像纵坐标是否改变。"],["吸热放热","看能量传递；不能只看温度是否变化。"]],"reason":"先确定物态前后，再说变化名称；温度图先看晶体或非晶体、气压等条件，再分析平台。","experiment":"沸腾时继续加热，温度在相应沸点保持不变；撤去热源后沸腾通常不能持续，注意器材余热。"},"variant":["“任何固体熔化时温度都不变”是否正确？",["正确","不正确","只要加热就正确"],1,"晶体在相应熔化过程温度不变，非晶体没有固定熔点，不能把晶体规律推广给所有固体。"]},{"id":5,"title":"质量与密度","lead":"先懂质量，再理解每一份物质的质量。","lab":"density","goal":"质量 → 单位体积的质量 → 计算与测量","concepts":[["质量：所含物质的多少","一块20 g橡皮放进书包或捏变形，只要没有增减物质，质量仍是20 g。质量表示物体所含物质的多少，用m表示，单位kg或g，1 kg＝1000 g。切成两块，两块都留下时总质量不变；每一块的质量则比原来小。重力是地球吸引产生的力，单位N，不能把质量和重力混为一谈。"],["密度是每一份的质量","大木块可能比小铁钉质量大，所以不能只凭质量判断密度。统一体积后比较：10 cm³铝质量27 g，每1 cm³就是2.7 g。密度ρ＝m/V，表示单位体积某种物质的质量。"],["切一半，密度不变","同种均匀材料、相同温度状态等条件下，切一半时质量与体积都减半，比值不变。密度也会受温度、状态等影响，不能认为任何情况下不变。"],["三个公式是一件事","求密度ρ＝m/V，求质量m＝ρV，求体积V＝m/ρ。三量要对应同一对象。g与cm³配套得g/cm³；kg与m³配套得kg/m³；1 g/cm³＝1000 kg/m³。"],["比较先找相同条件","同体积，密度大的质量大；同质量，密度大的体积小。空心物体可先用m/ρ材料求材料体积，再与外部总体积比较，不把空腔当成材料。"],["测量看增加了多少","通常先测干燥物体质量，再用排水法测体积：完全浸没后的读数减原水读数。适用于不溶、不明显吸水等合适物体，避免气泡洒水。测液体可用杯与液体倒出前后质量差，配量筒中倒出体积。天平调平在测量前进行，测量中不调平衡螺母。"]],"example":["石块体积从哪里来？","石块质量52 g，量筒原水30 mL，完全浸没后50 mL，求密度。","① 质量与体积对应同一石块。② V＝50−30＝20 mL＝20 cm³。③ ρ＝52÷20＝2.6 g/cm³。④ 50 mL是总读数，不能直接当石块体积。"],"quiz":[["均匀铝块切成相等两半，相同条件下密度？",["减半","不变","加倍"],1,"质量、体积同比例减半，m/V不变。"],["体积30 cm³，铝密度2.7 g/cm³，质量？",["81 g","11.1 g","0.09 g"],0,"m＝ρV＝2.7×30＝81 g，每份质量乘份数。"]],"recap":["密度比较单位体积质量，不只看整块谁重。","公式三量对应同一物体，单位配套。","排水法用增加的体积。"],"mission":{"name":"辨认物资","question":"铝块体积加倍，其他条件相同，质量与密度怎么变？","options":["质量加倍，密度不变","质量不变，密度加倍","都加倍"],"correct":0,"reason":"同种均匀材料相同条件下，m＝ρV；体积加倍，质量加倍，ρ不变。","anchor":"密度是“每一份”的质量。"},"focus":["不增减物质，改变位置或形状，不改变质量。","先把体积统一，再比质量","取多取少，比值通常不变","每份质量×份数＝总质量","先找哪个条件相同","排水法看水位增加量"],"teacher":{"contrast":[["质量","物体所含物质多少，取大块通常更多。"],["密度","单位体积质量；同种均匀材料相同条件下，取多取少通常不变。"]],"reason":"先确认质量、体积是哪一个物体的，再判断求ρ、m还是V。实验题先求差值，计算题先配单位。","experiment":"测固体通常先称干质量再排水；测液体用倒出前后质量差，对应量筒中的倒出体积。"},"variant":["铁比铝密度大，实心铁和铝质量相同，谁体积大？",["铁","铝","一样"],1,"质量固定，用V＝m/ρ。密度小的铝需要更大体积才能达到相同质量。"]},{"id":6,"title":"力与运动","lead":"匀速前进，也可能一直受力。","lab":"force","goal":"力与受力图 → 惯性 → 平衡与摩擦","concepts":[["力是物体间的作用","力能改变形状或运动状态，大小、方向、作用点影响作用效果，单位N。物体间作用相互。画受力图先确定研究物体，只画它受到的力，不把它对别人的力画进去。"],["重力与测力","G＝mg，质量m用kg，g按题取值，重力方向竖直向下，不等于垂直所有斜面。弹簧测力计看量程分度值、调零，拉力沿弹簧轴线。"],["惯性不是一种力","惯性是保持原运动状态的性质，大小与质量有关。刹车时人向前倾，是身体原有运动状态保持的趋势，不说“受到惯性力”。力是改变运动状态的原因，不是维持运动的原因。"],["二力平衡","静止或匀速直线运动属于平衡状态。二力平衡：同一物体、大小相等、方向相反、同一直线。相互作用力作用在两个物体上；平衡力作用在同一个物体上。"],["摩擦力","滑动摩擦大小与压力及粗糙程度有关。静摩擦按实际需求变化，不直接套滑动摩擦规律。摩擦阻碍接触面相对滑动或趋势，不一定与物体运动方向相反。鞋底花纹增摩擦，润滑、滚动代替滑动可减摩擦。"],["实验与控制变量","匀速水平拉木块时，拉力与摩擦平衡，测力计示数等于摩擦力。研究压力影响，要保持粗糙程度相同；研究粗糙程度影响，要保持压力相同。匀速转弯方向仍变化，不是匀速直线平衡。"]],"example":["匀速拉箱子","水平地面上拉箱子匀速直线运动，水平拉力30 N，摩擦力多少？","① 研究箱子。② 匀速直线，水平方向受力平衡。③ 拉力与摩擦等大反向，摩擦30 N。④ 不能说“匀速所以不受力”。"],"quiz":[["2 kg物体重力多少（g＝10 N/kg）？",["2 N","20 N","200 N"],1,"G＝mg＝2×10＝20 N。"],["书静止桌上，书的重力与桌面对书的支持力是什么关系？",["平衡力","相互作用力","没有关系"],0,"都作用在书上，等大反向共线，是平衡力。书对桌面压力与桌面对书支持力才是一对相互作用力。"]],"recap":["先定受力对象。","静止或匀速直线用平衡。","惯性是性质，不是力；摩擦需看相对运动。"],"mission":{"name":"运输箱受力","question":"箱子正被水平拉着匀速直线运动，拉力30 N。摩擦力？","options":["0 N","30 N","大于30 N"],"correct":1,"reason":"匀速直线运动时水平方向平衡，摩擦与拉力等大反向。","anchor":"匀速不是没受力，是力平衡。"},"focus":["先问谁对谁施力","重力方向竖直向下","惯性是性质，不是一种力","平衡力必须作用在同一物体上","摩擦阻碍相对滑动或趋势","比较一个因素，其余条件保持相同"],"teacher":{"contrast":[["平衡力","作用在同一物体上；平衡时等大、反向、共线。"],["相互作用力","分别作用在两个物体上，例如手推墙与墙推手。"]],"reason":"先圈研究物体，再列受力，最后看静止、匀速直线或运动状态改变。不要凭“正在运动”猜合力。","experiment":"测滑动摩擦须匀速水平拉动，才可由二力平衡把测力计拉力当摩擦力。"},"variant":["箱子在水平地面前进，撤去拉力后仍有摩擦，它通常怎样？",["立刻停止","继续前进并减速","一直匀速"],1,"惯性使物体不能立刻停下；摩擦导致运动状态改变，通常逐渐减速。"]},{"id":7,"title":"压强与浮力","lead":"同样用力，效果为什么不一样？","lab":"pressure","goal":"压力与压强 → 液体与大气 → 浮力和浮沉","concepts":[["压力与压强","压力垂直作用于表面；压强是单位面积受到的压力。p＝F/S，F单位N、S单位m²，p单位Pa。面积是实际受力面积。水平放置且无其他竖直作用力时压力常等于重力，不能在所有情境套用。"],["液体压强","静止同种液体越深压强越大，同深度各方向压强相等。p＝ρgh，h是从自由液面竖直向下的深度，不是沿容器壁距离。液体压强还与密度有关。该式水压不自动包含大气压。"],["大气、连通器与流体","吸管饮水是内外压强差：管内压强降低，外界大气压把饮料压上。上端开口、底部连通、同种静止液体液面相平。常见适用流动情境中流速大处压强小，须按题设条件判断。"],["阿基米德原理","F浮＝ρ液gV排。浮力等于排开流体的重力。完全浸没时V排等于物体总体积，部分浸入时只算浸入部分。称重法F浮＝G−F示。完全浸没、体积不变时，在密度均匀水中继续下沉浮力通常不变。"],["浮沉条件","无其他竖直外力时，静止漂浮或悬浮有F浮＝G。漂浮部分浸入，悬浮完全浸没。比较浮力和重力可判断释放后的运动趋势。均匀实心物体密度与液体密度比较可判断浮沉；空心物体需考虑平均密度。"],["实验与应用","海绵凹陷反映压力效果，控制压力或面积。研究液体压强深度影响需保持液体密度不变。浮力实验可比较G−F示与排液重力。船重不变驶入更密的液体，排开体积变小。"]],"example":["先认压力和面积","箱子对水平面压力200 N，受力面积0.04 m²，压强多少？","① 求单位面积压力。② p＝F/S＝200÷0.04＝5000 Pa。③ 若面积减半、压力不变，压强加倍。④ 别把面积单位cm²直接当m²。"],"quiz":[["排开水200 cm³，浮力多少（g＝10）？",["2 N","20 N","200 N"],0,"V排＝2×10⁻⁴ m³；F浮＝1000×10×2×10⁻⁴＝2 N。"],["重8 N物体静止漂浮，浮力多少？",["大于8 N","等于8 N","小于8 N"],1,"漂浮静止且无其他竖直外力，受力平衡，浮力＝重力＝8 N。"]],"recap":["压强先找压力和真实面积。","浮力用液体密度、排开体积。","漂浮先用平衡，不猜浸入多少。"],"mission":{"name":"安全过泥地","question":"同样压力下，把接触面积加倍，压强？","options":["加倍","减半","不变"],"correct":1,"reason":"p＝F/S，压力固定，面积加倍则压强减半。","anchor":"同样力，分散到更大面积。"},"focus":["压强＝压力÷受力面积","深度从液面竖直往下量","吸管靠内外压强差","浮力等于排开液体的重力","漂浮静止：浮力＝重力","实验先控制压力、面积或深度"],"teacher":{"contrast":[["压力","垂直作用在表面的力，单位N。"],["压强","压力作用效果，p＝F/S，单位Pa。"]],"reason":"压强先找F、S；液体先找ρ、h；浮力先找ρ液、V排；漂浮静止可先由平衡求F浮。","experiment":"海绵凹陷反映压力效果；同种液体改深度研究压强；浮力可用称重法与排液重力比较。"},"variant":["物体重10 N、向上绳拉力2 N，在水中静止，浮力多少？",["10 N","8 N","12 N"],1,"物体受重力向下、浮力与绳拉力向上。平衡：F浮＋2＝10，所以F浮＝8 N。不能有绳拉力还直接套F浮＝G。"]},{"id":8,"title":"简单机械、功与机械能","lead":"省力、做功快、效率高，是三件事。","lab":"lever","goal":"杠杆滑轮 → 功与功率 → 效率与能量","concepts":[["杠杆与力臂","力臂是支点到力作用线的垂直距离，不一定是杆长。平衡F₁l₁＝F₂l₂。动力臂长通常可省力，但费距离。作图延长力作用线，从支点作垂线。实验先调水平便于测力臂。"],["滑轮","定滑轮主要改变力方向；理想动滑轮省一半力。滑轮组看承担动滑轮及重物的绳段数n，理想F＝G/n，s＝nh；考虑动滑轮自重、忽略摩擦时F＝(G物＋G动)/n。"],["功与功率","力做功需有力及沿力方向的位移。同向时W＝Fs，P＝W/t；匀速同向P＝Fv。W单位J，P单位W。推墙没推动，推力对墙不做功；竖直提物水平走，竖直提力不做功。"],["机械效率","η＝W有/W总×100%。提升重物W有＝Gh，绳端输入W总＝Fs。实际有额外功，效率通常小于100%。功率比较快慢，效率比较有用功占比，二者不等同。"],["动能与势能","动能与质量、速度有关；重力势能与质量、高度有关；弹性势能与弹性形变等有关。机械能是动能与势能总和。无耗散理想条件机械能可守恒，有摩擦时部分机械能转成内能。"],["实验图像","研究动能影响，可用物体推动木块距离反映动能，比较速度时保持质量相同。杠杆多组数据用来寻找普遍关系。效率测量需区分重物上升高度h和绳端距离s。"]],"example":["功与功率一起求","沿运动方向用50 N拉物体4 m，用时10 s，求功与功率。","① 力与位移同向，W＝Fs＝50×4＝200 J。② P＝W/t＝200÷10＝20 W。③ 同样功用时更短，功率更大。"],"quiz":[["动力臂0.4 m、阻力臂0.2 m、阻力40 N，平衡动力多少？",["20 N","40 N","80 N"],0,"F＝40×0.2÷0.4＝20 N。力臂越长，产生同样力矩所需力可更小。"],["有用功80 J，总功100 J，效率？",["80%","125%","20%"],0,"η＝80/100×100%＝80%。"]],"recap":["力臂是垂直距离。","功看能量多少，功率看快慢，效率看占比。","滑轮先数承担动滑轮的绳段。"],"mission":{"name":"省力起重机","question":"阻力与阻力臂固定，把动力臂加倍，平衡动力？","options":["加倍","减半","不变"],"correct":1,"reason":"F₁l₁＝F₂l₂，动力臂加倍，所需动力减半。","anchor":"推门离门轴远，通常更省力。"},"focus":["力臂是垂直距离，不一定是杆长","滑轮先数承担重物的绳段","功是做多少，功率是做多快","效率看有用功占总功多少","有摩擦时，机械能可转为内能","实验用可观察量反映能量"],"teacher":{"contrast":[["功率","做功快慢，P＝W/t。"],["机械效率","有用功占总功比例，η＝W有/W总。"]],"reason":"杠杆先找支点和垂直力臂；滑轮先数绳段；功效率先区分重物高度h和绳端距离s。","experiment":"杠杆多组数据找普遍关系；效率实验分别测重物重力、上升高度、拉力与绳端距离。"},"variant":["理想滑轮组由2段绳承担重物，重物上升0.5 m，绳端移动多远？",["0.25 m","0.5 m","1 m"],2,"s＝nh＝2×0.5＝1 m。省力通常费距离，不能把h直接当s。"]},{"id":9,"title":"内能与热量","lead":"温度、内能、热量，怎样区分？","lab":"heat","goal":"分子运动 → 内能变化 → 热量与热机","concepts":[["分子在运动","扩散说明分子不停做无规则运动；温度越高通常越剧烈。分子间存在引力和斥力。灰尘的运动不直接等于分子运动，不能把看得见的小颗粒当分子。"],["三个概念","温度表示冷热程度；内能是分子动能与分子势能总和；热量是热传递过程转移的能量。物体有内能，不说“含有热量”。同温不等于同内能，还要考虑质量、种类、状态等。"],["做功与热传递","搓手、压缩气体可通过做功改变内能；热水使冷物变暖是热传递，需要温差。晶体熔化时温度不变，也能吸热、内能改变。"],["比热容","c表示单位质量物质温度升高单位温度所需热量。无物态变化的相应过程Q＝cmΔt，Δt是温差。相同质量、相同吸热，c大的升温较小；相同质量升温相同，c大的吸热更多。"],["燃料与热机","完全燃烧Q放＝mq，q是热值。实际利用热量常小于放热，η＝Q有用/Q放。四冲程热机中压缩冲程机械能转内能，做功冲程内能转机械能；其余冲程按结构与过程辨认。"],["实验与能量","比较比热容可取等质量不同物质，用相同加热条件比较温升或达到相同温升的加热时间；需明确加热时间作为吸热多少的近似依据。能量守恒不等于所有能量可方便重新利用。"]],"example":["先求温差","1 kg水由20℃升到30℃，c＝4200 J/(kg·℃)，求吸热。","① 无物态变化，Δt＝30−20＝10℃。② Q＝cmΔt＝4200×1×10＝42000 J。③ 不能直接拿终温30℃代温差。"],"quiz":[["搓手变热主要是哪种方式？",["做功","热传递","无法改变内能"],0,"克服摩擦做功，将机械能等转为内能。"],["同质量、吸相同热量，比热容大的物质温升怎样？",["更大","更小","必然相等"],1,"Δt＝Q/(cm)，Q与m相同，c越大，温升越小。"]],"recap":["物体有内能，热量描述传递过程。","先求温差，再用Q＝cmΔt。","完全燃烧用mq，实际利用还看效率。"],"mission":{"name":"保温补给站","question":"同种水、升温都10℃，水的质量加倍，所需热量？","options":["不变","减半","加倍"],"correct":2,"reason":"Q＝cmΔt，c和温升不变，质量加倍，所需热量加倍。","anchor":"水多一倍，同样升温要更多热。"},"focus":["分子一直在无规则运动","温度、内能、热量要分开","做功和热传递都可改变内能","先求温差，再算热量","燃料完全燃烧用Q＝mq","比较比热容要控制质量等条件"],"teacher":{"contrast":[["内能","物体分子动能与分子势能的总和。"],["热量","热传递过程中转移的能量，不说物体“含有热量”。"]],"reason":"先区分升降温、燃料燃烧还是能量转化；升温先求温差，再用cmΔt；燃烧用mq并检查效率。","experiment":"比较比热容：质量相同、加热条件相同，以温升或相同温升的加热时间比较。"},"variant":["水从20℃升到30℃与30℃升到40℃，同质量、无物态变化时吸热？",["前者更多","后者更多","相同"],2,"两次温差都10℃，c和m相同，Q＝cmΔt相同；不是终温越高这次吸热就更多。"]},{"id":10,"title":"电路与欧姆定律","lead":"先看电流路径，再决定用哪条规律。","lab":"circuit","goal":"电路与电表 → 电阻 → 欧姆定律与实验","concepts":[["电荷与电路","同种电荷相斥、异种相吸；摩擦起电是电荷转移。电源外部规定电流方向正极到负极，与金属中电子定向移动相反。完整闭合通路才可能有持续电流。电源两极被导线直接连接是危险的电源短路。"],["串联与并联","串联一条路径：I相同，U总＝U₁＋U₂，R总＝R₁＋R₂。并联有分支：U相同，I总＝I₁＋I₂，1/R总＝1/R₁＋1/R₂。看连接路径，不看灯泡画在一排还是两排。"],["电表","电流表串联，电压表并联在待测两端；正进负出、合适量程。电流表不能直接接电源两极。读数先看接入量程，再看分度值。1 A＝1000 mA。"],["电阻与变阻器","电阻与材料、长度、横截面积、温度有关。滑动变阻器改变接入电阻丝长度，常接一上一下，接入前调最大阻值。R＝U/I是求值方法，不说明电流变大电阻就必然变小。"],["欧姆定律","I＝U/R，U＝IR，R＝U/I。同一次计算的U、I、R对应同一元件或同一等效电路。在电阻等条件不变时I与U成正比；U不变时I与R成反比。灯丝电阻随温度变化。"],["实验与故障","探究I与U保持R不变；探究I与R更换电阻后用变阻器保持被研究电阻两端U不变。伏安法同时测U、I求R。故障先看通路和电表位置，不能仅凭电压表有示数就判断原因。局部短路不等于电源短路。"]],"example":["串联从共同电流入手","10 Ω与20 Ω串联接6 V，求电流和各自电压。","① R总＝30 Ω。② I＝6÷30＝0.2 A。③ U₁＝0.2×10＝2 V；U₂＝0.2×20＝4 V。④ 两电压相加为6 V，符合电源。"],"quiz":[["10 Ω接3 V，电流多少？",["30 A","0.3 A","3.3 A"],1,"I＝U/R＝3÷10＝0.3 A。"],["探究I与R，更换电阻后要保持什么不变？",["电阻电压","电流","总电阻"],0,"保持被研究电阻两端电压不变，比较不同电阻对应的电流。"]],"recap":["串联先找同电流，并联先找同电压。","欧姆定律三量对应同一对象。","实验先看谁改变、谁保持不变。"],"mission":{"name":"基地供电","question":"10 Ω和20 Ω，6 V电源。由串联改并联，干路电流？","options":["变大","变小","不变"],"correct":0,"reason":"串联I＝6/30＝0.2 A；并联I＝6/10＋6/20＝0.9 A。","anchor":"先看路径，再找共同的量。"},"focus":["通路与短路，先追踪连接","串联同电流，并联同电压","电流表串，电压表并","变阻器看实际接入长度","U、I、R必须对应同一对象","实验先找改变和保持不变的量"],"teacher":{"contrast":[["总电压","电源或整个串联电路两端电压。"],["元件电压","某个元件两端电压；不能与其他元件电阻随意组合。"]],"reason":"先简化电流路径，再判串并联；串联从共同电流开始，并联从共同电压开始。三量必须对应同一对象。","experiment":"I与R关系需保持被研究电阻两端电压不变，不能把电源电压不变当作所有实验条件都满足。"},"variant":["10 Ω和20 Ω串联接6 V，10 Ω两端电压？",["6 V","2 V","4 V"],1,"先求共同电流6/(10＋20)＝0.2 A，再求U₁＝0.2×10＝2 V。不能把6 V直接分配给每个串联电阻。"]},{"id":11,"title":"电功、电功率与安全用电","lead":"耗电多少，取决于功率和时间。","lab":"power","goal":"电能功率 → 电热 → 测功率与安全用电","concepts":[["电功与电功率","电功表示电能转化多少：W＝UIt＝Pt。电功率表示快慢：P＝UI。用W和s得到J，用kW和h得到kWh。1 kWh＝3.6×10⁶ J，日常叫一度电。"],["额定与实际","额定功率对应额定电压；实际条件改变，实际功率可能改变。纯电阻条件P＝I²R＝U²/R；小灯泡温度变化会改变电阻，不能无条件视作定值。"],["焦耳定律","Q＝I²Rt表示电流产生热量。串联电流相同、相同时间时，电阻大产生热量多；并联同电压、相同时间时纯电阻热量可用U²t/R比较。电动机耗电不全变电热，不能用U²t/R当全部电能。"],["测灯泡功率","电流表串联、电压表并联，变阻器调电压到额定值，读电流，P额＝U额I。还可测不同实际电压的功率，不能把多个实际功率平均当额定功率。"],["家庭电路","用电器通常并联，开关接火线与用电器之间，有关金属外壳电器按规范接地。家庭电压通常220 V。电流过大可能因短路或总功率过大。"],["安全只在图上学","不湿手操作，不拆接市电。断路、短路按图分析；测电笔、接地和保护装置按学校规范及器材说明学习，不因会做题而尝试带电操作。"]],"example":["算耗电，单位成套","100 W灯工作2 h，耗电几度？","① 功率100 W＝0.1 kW。② W＝Pt＝0.1×2＝0.2 kWh。③ 也就是0.2度。④ 若用J，需把2 h化成7200 s。"],"quiz":[["0.5 kW电器工作4 h，耗电？",["2 kWh","0.125 kWh","2000 kWh"],0,"W＝Pt＝0.5×4＝2 kWh。"],["2 A流经5 Ω电阻10 s，热量？",["100 J","200 J","50 J"],1,"Q＝I²Rt＝2²×5×10＝200 J。注意电流要平方。"]],"recap":["功率快慢，电能多少。","kW配h，W配s。","电热不一定等于全部输入电能。"],"mission":{"name":"电量预算","question":"使用时间相同，把电器功率加倍，耗电量？","options":["减半","加倍","不变"],"correct":1,"reason":"W＝Pt，时间不变，功率加倍，电能加倍。","anchor":"一度电＝1 kWh。"},"focus":["电功看多少，功率看快慢","额定功率对应额定电压","电流产生热量：Q＝I²Rt","测额定功率先调额定电压","家用电器通常并联","安全用电只在图上学习"],"teacher":{"contrast":[["额定功率","额定电压下的功率。"],["实际功率","当前工作条件下的功率，未必等于额定功率。"]],"reason":"耗电量先选Pt，功率选UI；电热选I²Rt。纯电阻与电动机分清，再决定能否用U²/R。","experiment":"测额定功率先把灯泡电压调到额定值，再读电流；多个实际功率不能平均成额定功率。"},"variant":["定值电阻两端电压减半，电阻不变，功率变为原来的？",["一半","四分之一","两倍"],1,"纯电阻P＝U²/R；电压减半，其平方为原来的1/4，功率也为1/4。这里明确电阻不变，不能无条件套给变温灯丝。"]},{"id":12,"title":"电与磁、能源与信息","lead":"电生磁、磁生电，先认过程。","lab":"magnet","goal":"磁场电磁铁 → 电动机发电机 → 能源信息","concepts":[["磁体与磁场","同名磁极相斥、异名相吸。磁场真实存在，磁感线是描述工具，不是真实细线。磁体外部磁感线N到S。小磁针N极所指方向定义该点磁场方向。"],["电流产生磁场","通电导线周围有磁场。电磁铁磁性与电流、线圈匝数等有关；其他条件相同，电流增大或匝数增加通常增强磁性。通电螺线管可用右手安培定则判断极性，需看具体绕线和电流方向。"],["电动机","通电导体在磁场中可受力，电动机主要电能转机械能。受力方向与电流方向和磁场方向有关，改变其中一个可改变方向。"],["发电机","闭合电路一部分导体切割磁感线可产生感应电流，发电机利用电磁感应，机械能转电能。注意闭合电路和切割条件；改变运动或磁场方向可改变感应电流方向。"],["能源与守恒","能量能转移、转化，总量守恒，但利用有方向性，仍需节能。太阳能、风能等可再生；煤、石油、天然气及核燃料等不可再生。核电站利用核能，常涉及核裂变。"],["电磁波与材料","电磁波可在真空传播，真空速度约3×10⁸ m/s，光也是电磁波。手机靠电磁波传信息，光纤靠光传播。材料应用要看属性：导体、绝缘体、半导体、超导等不能仅凭外形判断，石墨也可导电。"]],"example":["装置原理怎么选","一个装置转动线圈，向外输出电能。它更接近电动机还是发电机？","① 起始输入是机械运动。② 输出电能。③ 属发电机，主要利用电磁感应。④ 电动机是通电后产生机械运动，能量方向相反。"],"quiz":[["通电吸起铁料、断电放下，主要用什么？",["电磁铁","平面镜","发电机"],0,"电磁铁磁性受电流控制，断电后磁性大幅减弱，便于释放铁料。"],["声音和电磁波，谁能在真空传播？",["声音","电磁波","都能"],1,"声音需介质，电磁波可以在真空传播。"]],"recap":["电磁铁：电流产生磁场。","电动机：通电受力；发电机：电磁感应。","能量守恒仍需节能；光属于电磁波。"],"mission":{"name":"磁力回收站","question":"线圈被机械装置转动，向外输出电能，它更接近？","options":["电动机","发电机","电热器"],"correct":1,"reason":"输入机械运动、输出电能，是发电机，利用电磁感应。","anchor":"先认输入和输出，再选原理。"},"focus":["磁场真实存在，磁感线是工具","电流可以产生磁场","电动机：通电受力而运动","发电机：运动产生感应电流","能量守恒，仍然需要节能","电磁波可以在真空传播"],"teacher":{"contrast":[["电动机","电能输入，机械运动输出；通电导体受磁场力。"],["发电机","机械能输入，电能输出；电磁感应。"]],"reason":"先认装置输入和输出，再选电生磁、通电受力或电磁感应。能源题先辨来源，再辨转化。","experiment":"电磁感应需闭合电路及切割磁感线；判断方向改变时，说明哪些条件改变、哪些保持不变。"},"variant":["闭合电路导体切割磁感线，运动方向和磁场方向同时反向，感应电流方向？",["改变","不变","一定没有电流"],1,"只改变其中一个方向会反向；两个同时反向，方向保持原来。其他相关条件相同。"]}];

};
function labValues(kind,a,b,mode,on){switch(kind){
case'density':{const r=Number(mode)||2.7;return {value:r*a,bar:a/40,text:`体积${a} cm³ × 每cm³质量${r} g＝${(r*a).toFixed(1)} g。改变大小，密度仍是${r} g/cm³。`}}
case'motion':return {value:120/a,bar:120/a/12,text:`v＝120 ÷ ${a}＝${(120/a).toFixed(2)} m/s。用时减少，同路程的平均速度增大。`};
case'sound':return {value:a,bar:b/5,text:`频率${a} Hz：每秒振动${a}次。相对振幅${b}级。频率变高对应音调升高；振幅变大通常对应响度增大。`};
case'light':return {value:a,bar:a/80,text:`入射角${a}° → 反射角${a}°；入射光与镜面夹角${90-a}°。`};
case'phase':{let state,temp;if(a<30){state='冰升温';temp=-10+a/3}else if(a<=65){state='冰与水共存，正在熔化';temp=0}else{state='全部熔化后的水继续升温';temp=(a-65)*2}return {value:temp,bar:Math.max(0,(temp+10)/80),text:`${state}，示意温度${temp.toFixed(1)}℃。熔化阶段仍吸热，温度不变。`}}
case'force':return {value:a*10,bar:a/10,text:`重力G＝${a}×10＝${a*10} N，方向竖直向下；支持力${a*10} N，方向竖直向上。`};
case'pressure':return {value:200/(a*1e-4),bar:10/a,text:`S＝${a} cm²＝${(a*1e-4).toFixed(4)} m²；p＝200/S＝${Math.round(200/(a*1e-4))} Pa。面积变小，压强变大。`};
case'lever':return {value:8/a,bar:(8/a)/80,text:`F＝40×0.2÷${a.toFixed(1)}＝${(8/a).toFixed(1)} N。动力臂越长，同样阻力所需动力越小。`};
case'heat':return {value:42000*a,bar:a/5,text:`Q＝4200×${a}×10＝${42000*a} J。温升相同，水越多，需要热量越多。`};
case'circuit':{const i1=6/a,i2=.3,total=mode==='parallel'?i1+i2:6/(a+20);return {value:total,bar:total/1.5,text:mode==='parallel'?`并联：各支路均6 V。I₁＝${i1.toFixed(2)} A，I₂＝0.30 A；干路I＝${total.toFixed(2)} A。`:`串联：R总＝${a+20} Ω；共同I＝${total.toFixed(2)} A；U₁＝${(total*a).toFixed(2)} V，U₂＝${(total*20).toFixed(2)} V。`}}
case'power':return {value:a/1000*b,bar:a/2000*b/8,text:`W＝${(a/1000).toFixed(1)} kW×${b} h＝${(a/1000*b).toFixed(1)} kWh，也就是${(a/1000*b).toFixed(1)}度。`};
case'magnet':return {value:on?1:0,bar:on?1:0,text:mode==='motor'?(on?'输入电能 → 通电导体受磁场力 → 输出机械能。':'电源未开启，模型中电动机不转。'):mode==='generator'?(on?'输入机械运动 → 切割磁感线，闭合电路产生感应电流 → 输出电能。':'停止机械输入，模型不产生感应电流。'):(on?'输入电流 → 线圈周围产生磁场，可吸引铁料。':'停止电流 → 电磁铁磁性大幅减弱。')};
}}
function visual(kind,a,b,mode){if(kind==='wave'){let path='';for(let x=0;x<=340;x+=2){const y=70-Math.sin(x/340*Math.PI*2*a/100)*b*9;path+=(x?'L':'M')+(x+10)+' '+y}return `<svg viewBox="0 0 360 140" role="img" aria-label="频率与振幅波形示意"><path d="M10 70H350" stroke="#b4c3af"/><path d="${path}" fill="none" stroke="#286b54" stroke-width="3"/></svg>`}if(kind==='ray'){const r=a*Math.PI/180,x=Math.sin(r)*110,y=Math.cos(r)*110;return `<svg viewBox="0 0 360 170" role="img" aria-label="光的反射角度示意"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#b86631"/></marker></defs><path d="M20 140H340" stroke="#345e50" stroke-width="3"/><path d="M180 12V150" stroke="#7c9988" stroke-dasharray="5 5"/><path d="M${180-x} ${140-y}L180 140M180 140L${180+x} ${140-y}" fill="none" stroke="#b86631" stroke-width="3" marker-end="url(#arrow)"/><text x="191" y="25" font-size="12">法线</text><text x="30" y="162" font-size="12">两角从法线量起</text></svg>`}if(kind==='circuit'){return `<div class="formula" style="font-size:18px">${mode==='parallel'?'电源6 V → 分支 R₁ / R₂ → 汇合':'电源6 V → R₁ → R₂ → 回电源'}</div>`}return ''}

function scene(kind,a,b,mode,on){let shapes='',caption='示意图，只表示本模型的关系';const txt=(x,y,t)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="13" fill="#355b47">${e(t)}</text>`;
if(kind==='density'){const side=25+Math.cbrt(a)*22;shapes=`<rect x="${180-side/2}" y="${130-side}" width="${side}" height="${side}" rx="8" fill="#86a98d"/>${txt(180,155,'体积改变，材料密度不变')}`}
if(kind==='motion'){shapes=`<path d="M30 100H330" stroke="#9aaf8d" stroke-width="5" stroke-dasharray="9 6"/><path d="M50 65L82 85L50 105L59 85Z" fill="#be873f"/><rect x="290" y="50" width="28" height="40" rx="5" fill="#4f7858"/>${txt(180,52,'120 m')} ${txt(180,137,'用时 '+a+' s → 平均速度 '+(120/a).toFixed(1)+' m/s')}`}
if(kind==='force'){const len=30+a*4;shapes=`<rect x="145" y="68" width="70" height="50" rx="5" fill="#97af82"/><path d="M70 122H290" stroke="#779066" stroke-width="4"/><path d="M180 94V${94-len}m-8 8l8-8l8 8M180 94V${94+len}m-8-8l8 8l8-8" fill="none" stroke="#416650" stroke-width="3"/>${txt(73,60,'支持力 '+a*10+' N')}${txt(282,150,'重力 '+a*10+' N')}`}
if(kind==='pressure'){const w=35+a*1.5;shapes=`<rect x="${180-w/2}" y="62" width="${w}" height="42" rx="5" fill="#83a285"/><path d="M180 20V52m-7-7l7 7l7-7" fill="none" stroke="#bb8240" stroke-width="3"/><path d="M40 110H320" stroke="#769565" stroke-width="4"/>${txt(250,35,'固定压力200 N')}${txt(180,145,'接触面积 '+a+' cm²')}`}
if(kind==='lever'){const arm=a*150;shapes=`<path d="M${180-arm} 80H230" stroke="#577e59" stroke-width="7"/><path d="M180 84L164 120H196Z" fill="#bea078"/><path d="M${180-arm} 30V72m-7-7l7 7l7-7M230 30V72m-7-7l7 7l7-7" fill="none" stroke="#b87534" stroke-width="3"/>${txt(180-arm,22,'动力')}${txt(230,22,'40 N')}${txt(120,145,'动力臂 '+a.toFixed(1)+' m')}${txt(265,145,'阻力臂0.2 m')}`}
if(kind==='heat'){const w=35+a*20;shapes=`<path d="M${180-w/2} 40V125H${180+w/2}V40" stroke="#5d8975" stroke-width="3" fill="none"/><rect x="${182-w/2}" y="70" width="${w-4}" height="53" fill="#aad4d1"/>${txt(180,30,'水 '+a+' kg')}${txt(180,150,'升温10℃需要 '+42000*a+' J')}`}
if(kind==='power'){shapes=`<circle cx="180" cy="65" r="30" fill="#f2dca5" stroke="#bb995f" stroke-width="2"/><path d="M163 91H197V115H163Z" fill="#6b8e74"/>${txt(180,145,a+' W × '+b+' h → '+(a/1000*b).toFixed(1)+'度')}`}
if(kind==='phase'){const state=a<30?'冰':a<=65?'冰与水':'水';shapes=`<path d="M110 30V125H250V30" stroke="#6d9478" fill="none" stroke-width="3"/>${a>=30?'<rect x="112" y="78" width="136" height="45" fill="#acd6d5"/>':''}${a<=65?'<rect x="150" y="65" width="52" height="48" rx="6" fill="#dbebeb" stroke="#8eb4b4"/>':''}${txt(180,150,state+' · 示意加热进度'+a+'%')}`}
if(kind==='magnet'){shapes=`<rect x="120" y="40" width="120" height="48" rx="10" fill="${on?'#be965a':'#a5b19b'}"/><path d="M136 32V97M156 32V97M176 32V97M196 32V97M216 32V97" stroke="#627d5c" stroke-width="4"/>${txt(180,130,(mode==='motor'?'电动机':mode==='generator'?'发电机':'电磁铁')+' / '+(on?'输入开启':'输入关闭'))}`}
return shapes?`<svg viewBox="0 0 360 175" role="img" aria-label="${caption}">${shapes}</svg>`:''}

function supplement(u){if(u.id===10)return `<div class="card"><div class="label">电路与电表 / 看通路，读示数</div><h2>开关改变了，灯和电表怎样变？</h2><p class="small">先合上总开关，再切换连接方式或支路开关。灯泡只表示亮灭，不比较真实亮度。</p><label for="lampMode" class="small">两灯怎样连接</label><select id="lampMode"><option value="series">串联</option><option value="parallel">并联</option></select><div id="lampDrawing"></div><div class="row"><button id="mainSwitch">总开关：断开</button><button id="switch1" class="quiet">S₁：闭合</button><button id="switch2" class="quiet">S₂：闭合</button></div><p id="lampExplain" aria-live="polite"></p><div class="metergrid"><div><div id="ammeter"></div><p class="small">A：串在干路，测总电流</p></div><div><div id="voltmeter"></div><p class="small">V：并在灯1两端，测灯1电压</p></div></div><p class="note">数值模型：理想6 V电源，灯1等效为固定10 Ω、灯2等效为固定20 Ω；理想电表和导线。真实灯丝电阻会随温度变化，不能照搬此模型。电压表不接在开关两端。</p><details><summary>为什么A串联，V并联？</summary><p>电流表要让被测电流流过它，所以串进电流路径；电压表比较元件两端，所以分别连接这两端。电流表不能直接接电源两极。</p><p>图中的V支路是理想高电阻测量支路，忽略其电流，不等同于用导线短接灯泡。</p></details><details><summary>怎样读指针表？</summary><p>先看接入量程和单位，再看每小格代表多少。这里A的量程0—1 A，每标记间隔0.2 A；V量程0—6 V，每标记间隔1 V。实际仪器还要看细分小格。正接、反接和量程选择都按器材说明。</p></details></div>`;
if(u.id===1)return `<div class="card"><div class="label">刻度尺 / 两端读数之差</div><h2>零刻度没对齐，还能测吗？</h2><p class="small">物体左端在1.2 cm处，拖动右端。尺的分度值为1 mm。</p><div id="rulerDrawing"></div><label for="rulerEnd">右端位置 <span id="rulerEndVal"></span> cm</label><input type="range" id="rulerEnd" min="1.3" max="7" step="0.1" value="5.6"><p id="rulerExplain" aria-live="polite"></p><p class="note">用两端差值，不把右端读数直接当长度。这里拖动步长1 mm；实际测量可按器材要求估读。</p></div>`;
if(u.id===3)return `<div class="card"><div class="label">凸透镜 / 物距与成像</div><h2>物体靠近透镜，像怎样变化？</h2><p class="small">焦距固定10 cm，拖动物体。图按薄透镜近似画，虚像用虚线标出。</p><div id="lensDrawing"></div><label for="lensU">物距 <span id="lensUVal"></span> cm</label><input type="range" id="lensU" min="5" max="40" step="1" value="30"><p id="lensExplain" aria-live="polite"></p><p class="note">F是焦点，2F是两倍焦距。箭头代表物体和像，不是光线；本图用于判断成像，不替代完整光路作图。</p></div>`;
if(u.id===5)return `<div class="card"><div class="label">排水法 / 看水位增加量</div><h2>物体的体积藏在哪两个读数里？</h2><p class="small">石块质量52 g，原水30 mL。拖动到完全浸没，再求整个石块体积。</p><div id="displacementDrawing"></div><label for="immersion">浸入程度</label><input type="range" id="immersion" min="0" max="100" value="0"><p id="displacementExplain" aria-live="polite"></p><p class="note">理想化演示：不溶、不吸水，忽略气泡洒水。浸入程度表示排开总体积的比例，不等于真实形状的浸入高度比例。</p></div>`;return ''}
function electricalState(mode,main,s1,s2){const i1=main&&(mode==='series'?s1&&s2:s1)?(mode==='series'?6/30:6/10):0;const i2=main&&(mode==='series'?s1&&s2:s2)?(mode==='series'?6/30:6/20):0;return {i1,i2,total:mode==='series'?i1:i1+i2,v1:i1*10,v2:i2*20,on1:i1>0,on2:i2>0}}
function lampCircuit(mode,main,s1,s2,state){const line=(d)=>`<path d="${d}" stroke="#688576" stroke-width="2.5" fill="none"/>`;const sw=(x,y,on,label)=>`${line(`M${x} ${y}L${x+27} ${on?y:y-16}`)}<circle cx="${x}" cy="${y}" r="2.7" fill="#688576"/><circle cx="${x+30}" cy="${y}" r="2.7" fill="#688576"/><text x="${x+15}" y="${y+22}" text-anchor="middle" font-size="11" fill="#62766b">${label}</text>`;const lamp=(x,y,on,label)=>`<circle cx="${x}" cy="${y}" r="17" fill="${on?'#ffe7a0':'#eef2ef'}" stroke="#789083" stroke-width="2"/>${line(`M${x-10} ${y-10}L${x+10} ${y+10}M${x+10} ${y-10}L${x-10} ${y+10}`)}<text x="${x}" y="${y+33}" text-anchor="middle" font-size="11" fill="#62766b">${label} ${on?'亮':'灭'}</text>`;let d='';

return `<svg viewBox="0 0 350 235" role="img" aria-label="${mode==='series'?'串联':'并联'}电路，灯1${state.on1?'亮':'灭'}，灯2${state.on2?'亮':'灭'}">${d}</svg>`}
function meter(value,max,unit){const x=85,y=93,r=55,a=(150-120*value/max)*Math.PI/180;let ticks='';const steps=unit==='A'?5:6;for(let i=0;i<=steps;i++){const angle=(150-120*i/steps)*Math.PI/180;const px=x+Math.cos(angle)*r,py=y-Math.sin(angle)*r;const v=max*i/steps;ticks+=`<path d="M${px} ${py}L${x+Math.cos(angle)*(r-7)} ${y-Math.sin(angle)*(r-7)}" stroke="#819a8b"/><text x="${x+Math.cos(angle)*(r+14)}" y="${y-Math.sin(angle)*(r+14)+4}" text-anchor="middle" font-size="10" fill="#577164">${unit==='A'?v.toFixed(1):v}</text>`}return `<svg viewBox="0 0 170 155" role="img" aria-label="电表读数${value.toFixed(2)}${unit}"><rect x="5" y="5" width="160" height="145" rx="8" fill="#f5f8f6" stroke="#dce5de"/>${ticks}<path d="M85 93L${x+Math.cos(a)*45} ${y-Math.sin(a)*45}" stroke="#597966" stroke-width="2.5"/><circle cx="85" cy="93" r="3" fill="#597966"/><text x="85" y="119" text-anchor="middle" font-size="14" fill="#375947">${value.toFixed(2)} ${unit}</text><text x="85" y="139" text-anchor="middle" font-size="10" fill="#6a7d70">量程 0—${max} ${unit}</text></svg>`}
function setupSupplement(u){if(u.id===10){let main=false,s1=true,s2=true;function update(){const mode=document.getElementById('lampMode').value,state=electricalState(mode,main,s1,s2);document.getElementById('lampDrawing').innerHTML=lampCircuit(mode,main,s1,s2,state);document.getElementById('ammeter').innerHTML=meter(state.total,1,'A');document.getElementById('voltmeter').innerHTML=meter(state.v1,6,'V');document.getElementById('mainSwitch').textContent='总开关：'+(main?'闭合':'断开');document.getElementById('switch1').textContent='S₁：'+(s1?'闭合':'断开');document.getElementById('switch2').textContent='S₂：'+(s2?'闭合':'断开');document.getElementById('lampExplain').textContent=!main?'总开关断开，没有完整供电通路，两灯都灭。':mode==='series'?(s1&&s2?'串联通路完整，两灯都亮；各处电流相同。':'串联只有一条路径，断开任一开关，两灯都灭。'):'并联有独立支路：灯1'+(s1?'亮':'灭')+'，灯2'+(s2?'亮':'灭')+'。干路电流是支路电流之和。'}document.getElementById('lampMode').onchange=update;document.getElementById('mainSwitch').onclick=()=>{main=!main;update()};document.getElementById('switch1').onclick=()=>{s1=!s1;update()};document.getElementById('switch2').onclick=()=>{s2=!s2;update()};update()}
if(u.id===1){function update(){const end=Number(document.getElementById('rulerEnd').value);let ticks='';for(let i=0;i<=70;i++){const x=25+i*4;ticks+=`<path d="M${x} 100V${i%10===0?120:i%5===0?114:109}" stroke="#8b9c90"/>`;if(i%10===0)ticks+=`<text x="${x}" y="140" text-anchor="middle" font-size="11">${i/10}</text>`}document.getElementById('rulerDrawing').innerHTML=`<svg viewBox="0 0 340 165" role="img" aria-label="右端${end.toFixed(2)}厘米，左端1.20厘米"><rect x="20" y="98" width="295" height="51" rx="4" fill="#edf3ee" stroke="#ced9d1"/>${ticks}<rect x="73" y="62" width="${(end-1.2)*40}" height="28" fill="#bacdbd"/><path d="M73 90V100M${25+end*40} 90V100" stroke="#5e7c66" stroke-dasharray="3 3"/><text x="315" y="140" font-size="11">cm</text></svg>`;document.getElementById('rulerEndVal').textContent=end.toFixed(2);document.getElementById('rulerExplain').textContent='长度＝'+end.toFixed(2)+'−1.20＝'+(end-1.2).toFixed(2)+' cm。'}document.getElementById('rulerEnd').oninput=update;update()}
if(u.id===3){function update(){const u=Number(document.getElementById('lensU').value),v=u===10?null:1/(.1-1/u);const xo=175-u*3,h=24;let s='<path d="M15 100H335" stroke="#a6b5aa"/><path d="M175 20V175m-6-145l6-10l6 10m-12 135l6 10l6-10" stroke="#749882" fill="none" stroke-width="2"/>';for(const x of [115,145,205,235])s+=`<path d="M${x} 97V103" stroke="#749882"/><text x="${x}" y="118" text-anchor="middle" font-size="11">${x===115||x===235?'2F':'F'}</text>`;s+=`<path d="M${xo} 100V${100-h}m-5 7l5-7l5 7" fill="none" stroke="#608772" stroke-width="3"/><text x="${xo}" y="${100-h-10}" text-anchor="middle" font-size="12">物体</text>`;let label;if(v===null)label='物体在焦点：有限距离不成清晰像';else{const xi=175+v*3,yi=100+h*v/u;if(xi>=10&&xi<=340&&yi>=15&&yi<=175){s+=`<path d="M${xi} 100V${yi}m-5 ${v>0?-7:7}l5 ${v>0?7:-7}l5 ${v>0?-7:7}" stroke="#af8c58" stroke-width="3" ${v<0?'stroke-dasharray="4 3"':''}/><text x="${xi}" y="${yi+(v>0?16:-8)}" text-anchor="middle" font-size="12">${v<0?'虚像':'实像'}</text>`}else s+=`<text x="175" y="160" text-anchor="middle" font-size="11">像在图的范围之外</text>`;label=(u<10?'正立放大虚像':u===20?'倒立等大实像':u>20?'倒立缩小实像':'倒立放大实像')+'；像距大小约'+Math.abs(v).toFixed(1)+' cm'}document.getElementById('lensDrawing').innerHTML=`<svg viewBox="0 0 350 190" role="img" aria-label="凸透镜成像示意，物距${u}厘米">${s}</svg>`;document.getElementById('lensUVal').textContent=u;document.getElementById('lensExplain').textContent=label+'。'}document.getElementById('lensU').oninput=update;update()}
if(u.id===5){function update(){const t=Number(document.getElementById('immersion').value)/100,ml=30+20*t,y=160-ml*2;document.getElementById('displacementDrawing').innerHTML=`<svg viewBox="0 0 350 195" role="img" aria-label="水面读数${ml.toFixed(1)}毫升"><path d="M125 35V160H225V35" fill="none" stroke="#759883" stroke-width="3"/><rect x="127" y="${y}" width="96" height="${ml*2-2}" fill="#b9d9d8"/><rect x="150" y="${y-30+30*t}" width="45" height="30" fill="#a5b6a8"/><text x="175" y="185" text-anchor="middle" font-size="13">${ml.toFixed(1)} mL</text></svg>`;document.getElementById('displacementExplain').textContent=t===1?'完全浸没：V＝50−30＝20 cm³；ρ＝52/20＝2.6 g/cm³。':'当前排开体积'+(20*t).toFixed(1)+' cm³，尚未完全浸没，不能把它当整个石块体积。'}document.getElementById('immersion').oninput=update;update()}}

const openers={
1:{title:'测长度，就是看物体两端相隔多远',concept:'长度描述两点之间的距离。尺上的数字是位置；两端读数的差，才是物体长度。',example:'橡皮左端对着1 cm，右端对着4 cm。它占了3个“1 cm”，所以长3 cm。',question:'把橡皮向右挪1 cm，它会变长吗？',options:['会，右端数字更大了','不会，两端一起移动'],correct:1,answer:'左端变成2 cm，右端变成5 cm，5−2仍是3 cm。位置变了，长度没有变。',states:['左端1 cm → 右端4 cm','左端2 cm → 右端5 cm'],labels:['原来的位置','往右挪1 cm']},
2:{title:'声音，从振动开始',concept:'物体来回运动，叫振动。发声的物体正在振动，声音还需要通过空气等介质传到耳朵。',example:'拨一下绷紧的橡皮筋，它来回抖动，同时发出声音。',question:'用手按住橡皮筋，让它不再振动，会怎样？',options:['继续一直发声','这次发声停止'],correct:1,answer:'橡皮筋的振动停止，这次发声随之停止。已经传出去的声音仍会继续传播。',states:['拨动：橡皮筋来回振动','按住：振动停止'],labels:['拨一下','按住它']},
3:{title:'先分清光从哪里来',concept:'自身能够发光的物体叫光源。能被看见的物体，不一定自己发光。',example:'开着的台灯发光，是光源。书本把照到它的光反射进眼睛，才让你看见它。',question:'月亮看起来很亮，它是光源吗？',options:['是，亮的都是光源','不是，它反射太阳光'],correct:1,answer:'月亮反射太阳光，本身不发出可见光。判断光源要看是否自身发光。',states:['台灯 → 光照到书本 → 眼睛','太阳 → 光照到月亮 → 眼睛'],labels:['看台灯与书本','看太阳与月亮']},
4:{title:'温度，描述物体有多冷或多热',concept:'温度表示物体的冷热程度，常用摄氏度（℃）表示。温度计帮助我们比较，手的感觉可能不可靠。',example:'一小杯水和一大壶水都显示40℃，它们温度相同；水多，并不表示温度更高。',question:'一大壶40℃水，温度比一小杯40℃水高吗？',options:['高，因为水更多','不高，两者都是40℃'],correct:1,answer:'温度都为40℃。水的多少与温度是不同的条件，后面计算热量时才一起考虑。',states:['小杯：40℃','大壶：40℃'],labels:['看一小杯','看一大壶']},
5:{title:'质量，就是物体含有多少物质',concept:'质量表示物体所含物质的多少，用m表示，常用单位是g和kg。1 kg＝1000 g。',example:'一块20 g橡皮，从桌上放进书包，或者捏成另一种形状，只要没有增减物质，质量仍是20 g。',question:'把它切成两块，两块都留下，总质量会怎样？',options:['仍是20 g','变成40 g','只剩10 g'],correct:0,answer:'两块加起来仍是20 g。若恰好均分，每块是10 g；不要把“一块的质量”和“两块的总质量”混在一起。',states:['完整橡皮：20 g','捏变形：仍为20 g','均分并都留下：10 g＋10 g'],labels:['完整橡皮','捏变形','切成两块']},
6:{title:'推门时，你就在对门施加力',concept:'力是物体对物体的作用。说一个力，要找出谁施力、谁受力；力可以改变运动状态，也可以使物体变形。',example:'你用手推门：手施力，门受力。挤压海绵：海绵变形，也说明它受到力。',question:'手推门时，只有门受到力，手不受力吗？',options:['是，只有门受力','不是，门也对手施力'],correct:1,answer:'物体间力的作用是相互的。手推门，门也推手；这两个力分别作用在门和手上。',states:['手推门：门可能转动','手挤海绵：海绵变形'],labels:['推一下门','挤一下海绵']},
7:{title:'压力，是垂直压向接触面的力',concept:'物体垂直压在接触面上的力叫压力。它是一个力；压强则用来描述压力的作用效果。',example:'用同样的力按海绵，笔尖压下的凹陷通常更明显，笔杆平端的接触面积更大。',question:'力一样大，接触面积更小，压力作用效果通常怎样？',options:['更明显','一定更弱'],correct:0,answer:'同样的压力集中在更小的面积上，压强更大。这里比较的是同样海绵、相同压力。',states:['同压力：笔尖接触面积小','同压力：平端接触面积大'],labels:['用笔尖按','用平端按']},
8:{title:'物理里的“做功”，要看力和移动',concept:'有力作用，物体还要在这个力的方向上移动距离，这个力才对物体做功。',example:'向上托着书静止不动，很累，但托力没有对书做功；把书举高，托力就对书做了功。',question:'托着书一直站着，托力对书做功了吗？',options:['做了，因为手很累','没有，书没有移动'],correct:1,answer:'书没有移动，托力对书不做功。人体感到累与判断“这个力对这个物体是否做功”是两件事。',states:['托着不动：书没有位移','向上举高：书向托力方向移动'],labels:['托着不动','举高书本']},
9:{title:'“温度高”和“吸了多少热量”先分开',concept:'物体因温度不同而传递能量，叫热传递。热量是这个过程中传递的能量，用J表示。',example:'热水和冷勺接触，能量通常从温度高的热水传到温度低的勺子，勺子逐渐变热。',question:'能说“这杯水里面有很多热量”吗？',options:['能，热量就装在水里','不准确，热量描述传递过程'],correct:1,answer:'可以说水具有内能；发生热传递时，可以说水放出多少热量。热量不是物体“装着”的一个量。',states:['刚放入：水温高，勺温低','过一会儿：勺子温度上升'],labels:['刚放入勺子','观察过一会儿']},
10:{title:'手电筒为什么能亮？先找完整的路',concept:'电路把电源、用电器、开关和导线连接起来。简单电路中，电源正常、开关闭合、通路完整，灯才能亮。',example:'电池提供电能，灯把电能转成光和热；开关控制通路是否接通。',question:'电池在里面，但开关断开，灯会亮吗？',options:['会，有电池就行','不会，通路不完整'],correct:1,answer:'开关断开，电路没有完整通路，灯灭。闭合开关还要检查电池和其他连接是否正常。'},
11:{title:'功率，描述用电有多快',concept:'电功率表示用电器每秒消耗多少电能，单位W。100 W表示每秒消耗100 J电能。',example:'100 W灯与1000 W电器都使用1秒，后者消耗的电能是前者10倍；使用多久也会影响总耗电。',question:'只看瓦数，能判断一整天谁耗电更多吗？',options:['能，瓦数大就总耗电多','不能，还要看使用时间'],correct:1,answer:'总耗电量还要看时间：电能＝功率×时间。功率是快慢，电能是总量。',states:['100 W：1秒消耗100 J','1000 W：1秒消耗1000 J'],labels:['看100 W电器','看1000 W电器']},
12:{title:'磁铁周围，有看不见的磁场',concept:'磁体周围存在磁场，能对放在其中的小磁针等产生作用。磁场看不见，可以通过它的作用认识它。',example:'把小磁针放在条形磁铁旁边，它会改变方向；磁针的指向帮助我们判断当地磁场方向。',question:'图上的磁感线，是空间里真实画着的线吗？',options:['是，磁场就是很多细线','不是，是描述磁场的画法'],correct:1,answer:'磁感线是帮助描述磁场方向和分布的画法，不是真实存在的细线。小磁针受到的作用可以观察到。',states:['观察磁针：用指向判断磁场方向','画磁感线：用图表示磁场'],labels:['看小磁针','看示意线']}
};
function openingLesson(u){const t=openers[u.id];return `<div class="card"><div class="label">先懂一个概念</div><h2>${e(t.title)}</h2><p class="key">${rich(t.concept)}</p><p>${rich(t.example)}</p>${u.id===10?`<div id="torchDrawing"></div><div class="row"><button id="torchSwitch">闭合开关</button><button class="quiet" id="torchBattery">取出电池</button></div><p id="torchExplain" aria-live="polite"></p>`:`<div class="opening-visual" id="openingVisual"></div><div class="figure-tabs">${t.labels.map((s,i)=>`<button class="quiet" data-opening="${i}" aria-pressed="${i===0}">${e(s)}</button>`).join('')}</div><p id="openingExplain" class="small" aria-live="polite">${e(t.states[0])}</p>`}<h3>先判断一下</h3><p>${e(t.question)}</p><div class="choices">${t.options.map((s,i)=>`<button data-opening-answer="${i}">${e(s)}</button>`).join('')}</div><div id="openingAnswer" class="feedback" aria-live="polite"></div></div>`}

if(id===4)d=rect(step?105:140,30,step?140:70,90)+text(175,85,'40℃')+text(175,150,'容器大小不同，温度相同');
if(id===5)d=(step===2?rect(95,40,65,48)+rect(190,40,65,48)+text(127,118,'10 g')+text(222,118,'10 g'):step===1?'<ellipse cx="175" cy="70" rx="80" ry="27" fill="#c5d8cc" stroke="#728d7b" stroke-width="2"/>'+text(175,118,'20 g'):rect(105,40,140,48)+text(175,118,'20 g'))+text(175,153,'没有增减物质：总质量不变');
if(id===6)d=step?rect(155,65,70,28)+text(175,145,'挤压后：海绵变形'):rect(165,30,75,85)+'<path d="M65 70H150m-10-6l10 6l-10 6" fill="none" stroke="#728d7b" stroke-width="3"/>'+text(175,145,'手对门施力');
if(id===7)d=rect(55,95,240,28)+`<path d="M${step?145:170} 35V${step?85:108}H${step?205:180}V35" fill="#d6e1db" stroke="#728d7b"/>`+text(175,150,step?'接触面积大：压强小':'接触面积小：压强大');
if(id===8)d=rect(125,step?28:85,100,18)+text(175,145,step?'向上举高：托力做功':'静止托住：托力不做功')+(step?'<path d="M250 100V35m-6 10l6-10l6 10" fill="none" stroke="#728d7b" stroke-width="2"/>':'');
if(id===9)d=rect(75,45,90,70)+text(120,85,'热水')+text(250,85,step?'勺变热':'冷勺')+'<path d="M180 72H210m-7-5l7 5l-7 5" fill="none" stroke="#728d7b" stroke-width="2"/>'+text(175,150,'能量从高温处传向低温处');
if(id===11){for(let i=0;i<(step?10:1);i++)d+=rect(60+i*23,58,17,35);d+=text(175,140,step?'同样1秒：1000 J':'同样1秒：100 J')}
if(id===12)d=rect(135,65,80,35)+text(152,88,'N')+text(198,88,'S')+(step?'<path d="M135 65Q175 5 215 65M135 100Q175 155 215 100" fill="none" stroke="#728d7b" stroke-dasharray="5 4"/>': '<path d="M50 85L75 76V94Z" fill="#728d7b"/>')+text(175,153,step?'线条用于描述磁场':'小磁针指向示意');
return `<svg viewBox="0 0 350 175" role="img" aria-label="${e(openers[id].states[step])}">${d}</svg>`}
function setupOpening(u){const t=openers[u.id];app.querySelectorAll('[data-opening-answer]').forEach(b=>b.onclick=()=>{const ok=Number(b.dataset.openingAnswer)===t.correct;document.getElementById('openingAnswer').innerHTML='<b>'+(ok?'对，抓住了关键。':'先看清研究的是哪个量。')+'</b><p>'+e(t.answer)+'</p>';document.getElementById('openingAnswer').classList.add('show')});if(u.id!==10){document.getElementById('openingVisual').innerHTML=openingDrawing(u.id,0);app.querySelectorAll('[data-opening]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.opening);document.getElementById('openingVisual').innerHTML=openingDrawing(u.id,i);document.getElementById('openingExplain').textContent=t.states[i];app.querySelectorAll('[data-opening]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))})}else{let battery=true,closed=false;const update=()=>{const on=battery&&closed;document.getElementById('torchDrawing').innerHTML=`<svg viewBox="0 0 350 190" role="img" aria-label="手电筒${on?'亮':'灭'}，电池${battery?'已装入':'已取出'}，开关${closed?'闭合':'断开'}">${on?'<path d="M265 45L345 15V150L265 125Z" fill="#fff0bf"/>':''}<path d="M245 45L265 35V135L245 125Z" fill="${on?'#ffe6a3':'#dce6df'}" stroke="#819a8b"/><rect x="45" y="45" width="200" height="80" rx="12" fill="#dce6df" stroke="#819a8b"/><rect x="120" y="32" width="35" height="13" rx="4" fill="${closed?'#688b75':'#b5bfb7'}"/>${battery?'<rect x="85" y="65" width="105" height="40" rx="4" fill="#f8faf8" stroke="#819a8b"/><text x="100" y="91" fill="#486151">＋</text><text x="165" y="91" fill="#486151">−</text>':'<text x="145" y="90" text-anchor="middle" font-size="13" fill="#486151">电池已取出</text>'}<text x="175" y="168" text-anchor="middle" font-size="14" fill="#486151">${on?'灯亮：电源正常，通路完整':'灯灭：'+(!battery?'缺少电源':'开关断开')}</text></svg>`;document.getElementById('torchSwitch').textContent=closed?'断开开关':'闭合开关';document.getElementById('torchBattery').textContent=battery?'取出电池':'装回电池';document.getElementById('torchExplain').textContent=on?'正常电池供能，开关闭合，通路完整，所以灯亮。':!battery?'电池取出，即使开关闭合也不能持续供电。':'有电池，但开关断开，通路不完整，灯灭。'};document.getElementById('torchSwitch').onclick=()=>{closed=!closed;update()};document.getElementById('torchBattery').onclick=()=>{battery=!battery;update()};update()}}

const app=document.getElementById('app');
const e=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const terms=['匀速直线运动','单位体积','控制变量','平均速度','参照物','质量','体积','密度','频率','振幅','音调','响度','法线','反射角','入射角','吸热','放热','平衡','力臂','压强','浮力','温差','串联','并联','电流','电压','电阻'];
function rich(s){let n=0;return e(s).replace(new RegExp(terms.join('|'),'g'),x=>n++<2?'<mark>'+x+'</mark>':x)}
const foundations={1:'先备基础：四则运算、时间与长度单位。',2:'先备基础：振动、速度与时间。',3:'先备基础：直线、垂线、角度。',4:'先备基础：固液气三种状态、温度读数。',5:'先备基础：质量与体积单位、除法。',6:'先备基础：质量、运动状态、方向。',7:'先备基础：密度、重力、面积与体积单位；建议先读第5、6单元。',8:'先备基础：受力、距离、时间；建议先读第1、6单元。',9:'先备基础：质量、温度与物态变化；建议先读第4单元。',10:'先备基础：路径、比例关系、简单方程。',11:'先备基础：电流、电压、电阻；建议先读第10单元。',12:'先备基础：电流、能量转化；建议先读第10、11单元。'};
const challengeTargets={"1":["让120 m路程的平均速度恰好为3 m/s。","需要用时40 s，因为t＝120/3＝40 s。"],"2":["把波形调为每秒振动500次，相对振幅为3级。","频率500 Hz决定振动快慢；相对振幅3级决定图形上下幅度，两个量分开调。"],"3":["调出反射角60°，再判断入射光与镜面夹角。","入射角也应为60°；入射光与镜面夹角30°。"],"4":["把加热进度调到冰与水共存、正在熔化的阶段。","本示意进度30%—65%表示正在熔化，温度保持0℃，仍吸热。"],"5":["选择铝，调出质量27 g的材料块。","铝密度2.7 g/cm³，所以体积应为10 cm³。"],"6":["让静止物体的重力和支持力都为30 N。","g＝10 N/kg，需要质量3 kg；静止且无其他竖直外力，两力平衡。"],"7":["压力固定200 N，把压强调到100000 Pa。","S＝F/p＝0.002 m²＝20 cm²。缩小面积能增大压强。"],"8":["阻力40 N、阻力臂0.2 m，让平衡所需动力为10 N。","动力臂应为0.8 m：10×0.8＝40×0.2。"],"9":["水升温10℃，让所需热量恰好为84000 J。","水质量应为2 kg，因为m＝Q/(cΔt)＝84000/(4200×10)＝2。"],"10":["让干路电流恰好为0.90 A。可以改变R₁或连接方式。","一种解法：并联、R₁＝10 Ω。I＝6/10＋6/20＝0.90 A。按当前可调范围，串联达不到此值。"],"11":["调整功率和时间，让耗电量恰好为1度。试着找两种安排。","例如500 W用2 h，或1000 W用1 h，均为1 kWh。不同功率和时间也可能耗电相同。"],"12":["选择“机械能输入、电能输出”的装置，再开启输入。","选择发电机并开启机械输入，对应电磁感应。电动机的能量转化方向相反。"]};

function tabs(){return `<nav class="tabs" aria-label="学习步骤">${[['overview','导读'],['learn','知识'],['observe','观察'],['example','例题'],['check','自查']].map(([id,t])=>`<button data-tab="${id}" aria-current="${currentTab===id}">${t}</button>`).join('')}</nav>`}

if(tab==='overview'){const t=intros[u.id];content=`${openingLesson(u)}<details class="card"><summary>再想一步：这一单元还会学什么？</summary><div class="label">从生活里看懂</div><h2>${e(t.story)}</h2>${picture(u,true)}<details><summary>这张图告诉我们什么？</summary><p>${rich(t.answer)}</p></details></details><div class="card"><h3>这一单元，分三步学</h3><ol>${t.path.map(x=>'<li>'+e(x)+'</li>').join('')}</ol><button data-tab="learn">先看第一个知识点 →</button><details><summary>如果计算卡住，可以先补什么？</summary><p class="small">${e(foundations[u.id].replace('先备基础：',''))}</p></details></div>`;}
if(tab==='learn'){content=`<div class="card"><div class="label">知识 ${clue+1} / ${u.concepts.length}</div><label class="small" for="topic">选择小节</label><select id="topic" class="topic-select">${u.concepts.map((c,i)=>`<option value="${i}" ${i===clue?'selected':''}>${i+1}. ${e(c[0])}</option>`).join('')}</select><div id="knowledgeBody"></div><div class="section-end"><button class="quiet" id="prev" ${clue===0?'disabled':''}>上一节</button><button id="next" ${clue===u.concepts.length-1?'disabled':''}>下一节</button></div></div><div class="card"><details style="border:0;margin:0;padding:0"><summary>这两个概念，别混在一起</summary>${u.teacher.contrast.map(x=>`<h3>${e(x[0])}</h3><p class="small">${rich(x[1])}</p>`).join('')}</details><details><summary>做题先判断什么？</summary><p class="small">${rich(u.teacher.reason)}</p></details></div>${ending('observe','观察这些关系')}`}
if(tab==='observe'){const lab=labs[u.lab];content=`${supplement(u)}<div class="card"><div class="label">改变条件，观察关系</div><h2>先想一想，再动手</h2><p>${e(lab.intro)}</p><div class="lab">${lab.controls}<div id="visual"></div><div id="bar" class="bar"></div><p id="labReadout" aria-live="polite"></p></div><p class="note">${e(lab.note)}</p><details><summary>小挑战：用这些条件完成一个目标</summary><p>${e(challengeTargets[u.id][0])}</p><button id="challengeCheck">检查当前设置</button><div class="feedback" id="challengeFeedback" aria-live="polite"></div><details><summary>查看一种解法</summary><p class="small">${rich(challengeTargets[u.id][1])}</p></details></details></div><div class="card"><h3>实验题如何分析</h3><p class="small">${rich(u.teacher.experiment)}</p><h3>用一句话解释</h3><p class="small">保持了什么？改变了什么？结果为什么这样变？</p><details><summary>查看本单元的关键关系</summary><ul>${u.recap.map(t=>'<li>'+rich(t)+'</li>').join('')}</ul></details></div>${ending('example','看一道例题')}`}
if(tab==='example'){content=`<div class="card"><div class="label">对象 → 条件 → 规律 → 检查</div><h2>${e(u.example[0])}</h2><p>${rich(u.example[1])}</p><div id="steps"></div><button id="reveal">查看第一步</button><p class="small">先自己判断，再逐步查看。重点看为什么选这条规律。</p></div>${ending('check','做基础自查')}`}
if(tab==='check'){const qs=[...u.quiz,u.variant];content=`<div class="card"><div class="label">基础自查</div><h2>试着独立判断</h2><p class="small">先选答案，再看解释。答错后可以回到对应知识，不计分。</p>${qs.map((q,i)=>`<h3 style="margin-top:25px">${i+1}. ${e(q[0])}</h3><div class="choices">${q[1].map((t,j)=>`<button data-q="${i}" data-choice="${j}">${e(t)}</button>`).join('')}</div><div class="feedback" id="answer${i}" aria-live="polite"></div>`).join('')}</div><div class="card"><h2>单元总结</h2><ul>${u.recap.map(t=>'<li>'+rich(t)+'</li>').join('')}</ul><p class="small">前两题检查基础，第3题只改变一个条件，检查是否理解规律。隔一两天不看讲解再做一次，并说出原因。基础自查不代表全部考点已掌握。</p><button data-tab="learn" class="quiet">回知识部分</button></div>`}
app.innerHTML=`<a class="back" href="#">← 全部单元</a>${tabs()}${content}<p class="foot">仅保存本页内容，不上传作答 · 2026年10月14日<br>题目为自编，公式数值按题设取值。</p><details class="foot"><summary>编写参考</summary><p>复习组织参考<a href="https://aic-fe.bnu.edu.cn/xwdt/zxxw/130211.html">北师大报道的广东特级教师姚杨海中考指导</a>：一轮回归课本，后续分类找规律、分析错因。该活动在汕尾，教师来自东莞，非汕头课堂。解题顺序参考<a href="https://groups.spa.umn.edu/physed/Research/MNModel/psintro.html">明尼苏达物理教育研究团队</a>。本站未获教师审阅或背书。</p></details>`;
app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{renderUnit(u,b.dataset.tab);window.scrollTo(0,0)});
if(tab==='overview'){setupOpening(u);app.querySelectorAll('[data-figure]').forEach(b=>b.onclick=()=>{document.getElementById('figureExplain').textContent=intros[u.id].facts[Number(b.dataset.figure)];app.querySelectorAll('[data-figure]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))})}
if(tab==='learn'){const c=u.concepts[clue],sentences=c[1].split('。').filter(Boolean);document.getElementById('knowledgeBody').innerHTML=`<h2>${e(c[0])}</h2><p class="key">${rich(u.focus[clue])}</p>${knowledgePicture(u,clue)}<p class="plain">${rich(sentences[0]+'。')}</p>${sentences.length>1?`<details><summary>展开完整说明与使用条件</summary><div class="detail-lines">${sentences.slice(1).map(s=>'<p>'+rich(s+'。')+'</p>').join('')}</div></details>`:''}`;document.getElementById('topic').onchange=event=>{clue=Number(event.target.value);renderUnit(u,'learn')};document.getElementById('prev').onclick=()=>{clue--;renderUnit(u,'learn')};document.getElementById('next').onclick=()=>{clue++;renderUnit(u,'learn')}}
if(tab==='observe'){setupLab(u);setupSupplement(u);}
if(tab==='example'){let step=0;const steps=u.example[2].split(/[①②③④⑤]/).map(t=>t.trim()).filter(Boolean);document.getElementById('reveal').onclick=()=>{const el=document.createElement('div');el.className='step-row';el.innerHTML='<span>'+String(step+1).padStart(2,'0')+'</span><p>'+rich(steps[step])+'</p>';document.getElementById('steps').append(el);step++;document.getElementById('reveal').textContent=step===steps.length?'步骤已展开':'查看下一步';document.getElementById('reveal').disabled=step===steps.length}}
if(tab==='check'){const qs=[...u.quiz,u.variant];app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.q),q=qs[i],ok=Number(b.dataset.choice)===q[2];app.querySelectorAll('[data-q="'+i+'"]').forEach(x=>x.removeAttribute('data-selected'));b.setAttribute('data-selected',ok?'correct':'retry');const f=document.getElementById('answer'+i);f.innerHTML='<b>'+(ok?'判断正确。':'再检查一下条件。')+'</b><p>'+rich(q[3])+'</p>';f.classList.add('show')})}}
function setupLab(u){let on=false;const lab=labs[u.lab];function update(){const a=Number(document.getElementById('a')?.value||0),b=Number(document.getElementById('b')?.value||0),mode=document.getElementById('mode')?.value||'';['a','b'].forEach(id=>{const el=document.getElementById(id);if(el)document.getElementById(id+'Val').textContent=el.value});const v=labValues(u.lab,a,b,mode,on);document.getElementById('labReadout').textContent=v.text;document.getElementById('bar').style.display='none';document.getElementById('visual').innerHTML=visual(lab.kind,a,b,mode)||scene(u.lab,a,b,mode,on)}['a','b','mode'].forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=update});const toggle=document.getElementById('toggle');if(toggle)toggle.onclick=()=>{on=!on;toggle.textContent=on?'停止输入':'开启输入';update()};update();document.getElementById('challengeCheck').onclick=()=>{const a=Number(document.getElementById('a')?.value||0),b=Number(document.getElementById('b')?.value||0),mode=document.getElementById('mode')?.value||'';const value=labValues(u.lab,a,b,mode,on).value;let ok=false;switch(u.id){case 1:ok=Math.abs(value-3)<.01;break;case 2:ok=a===500&&b===3;break;case 3:ok=a===60;break;case 4:ok=a>=30&&a<=65;break;case 5:ok=mode==='2.7'&&Math.abs(value-27)<.01;break;case 6:ok=value===30;break;case 7:ok=Math.abs(value-100000)<1;break;case 8:ok=Math.abs(value-10)<.01;break;case 9:ok=value===84000;break;case 10:ok=Math.abs(value-.9)<.001;break;case 11:ok=Math.abs(value-1)<.001;break;case 12:ok=mode==='generator'&&on;break;}const f=document.getElementById('challengeFeedback');f.textContent=ok?'目标达到了。试着说出你改变了什么，以及为什么有效。':'当前设置还没达到目标。看读数，再调整一次；也可以展开一种解法。';f.classList.add('show')}}
function route(){const m=location.hash.match(/^#unit-(\d+)$/),u=m&&units.find(x=>x.id===Number(m[1]));clue=0;u?renderUnit(u):home();window.scrollTo(0,0)}window.addEventListener('hashchange',route);route();
</script></body></html>
