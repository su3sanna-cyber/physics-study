</style></head><body><header><div><div class="top"><span>初中物理 / 一轮复习</span><span class="badge" id="badge"></span></div><h1 id="title"></h1><p id="subtitle"></p></div></header><main id="app"></main><script>const units=[{"id":1,"title":"测量与机械运动","lead":"怎样公平地比较快慢？","lab":"motion","goal":"读数和单位 → 参照物 → 速度与图像","concepts":[["测量先看分度值","刻度尺先看单位、量程和分度值。视线正对刻度，能估读时估读到分度值下一位。零刻度损坏时可从其他刻度开始，长度用两端读数相减。多次测同一长度取平均值能减小随机误差；误差与读错、操作错误不同。"],["换单位，量本身没有变","1 m＝100 cm＝1000 mm；1 min＝60 s；1 h＝3600 s。1 m/s＝3.6 km/h。把72 km/h变为m/s，用72÷3.6＝20。别把分钟直接代入要求秒的公式。"],["参照物：你在和谁比较","判断运动、静止前，先选参照物。同向同速的两辆车相对静止，相对路边树木则运动。位置相对参照物发生变化，就说它在运动。"],["速度：每单位时间走多远","v＝s/t，s＝vt，t＝s/v。v是速度、s是路程、t是时间。平均速度用总路程÷总时间，包括该过程中的停留时间；通常不能直接平均两段速度。"],["图像与实验","路程—时间图像：横轴时间、纵轴路程，匀速运动对应直线，斜率越大速度越大。测平均速度需测对应过程的路程与时间，重复实验应明确测的是哪个过程。"]],"example":["全程平均速度","先走120 m用60 s，再走60 m用60 s，求全程平均速度。","① 研究整个过程，不单取一段。② 总路程180 m，总时间120 s。③ v＝180÷120＝1.5 m/s。④ 检查单位：m÷s＝m/s。"],"quiz":[["两段用时各60 s，速度分别2 m/s和1 m/s。全程平均速度？",["1.5 m/s","3 m/s","不能求"],0,"两段时间相等，总路程180 m、总时间120 s，得1.5 m/s。这里可以恰好等于算术平均，换成不等时间就不能直接这样算。"],["匀速车速72 km/h，10 s走多远？",["720 m","200 m","20 m"],1,"先换单位：72 km/h＝20 m/s。s＝vt＝20×10＝200 m。"]],"recap":["读数先看分度值。","判断运动要说明参照物。","全程平均速度先加路程、加时间，再相除。"],"mission":{"name":"撤离路线","question":"120米的走廊，两次走完全程：这次用时减半，平均速度会怎样？","options":["变成一半","变成两倍","不变"],"correct":1,"reason":"同路程，v＝s/t；用时减半，速度加倍。","anchor":"速度是“每秒走多远”。"},"focus":["先看一小格代表多少","同一个量，可以换单位表达","运动还是静止，要先选参照物","平均速度＝总路程÷总时间","图线越陡，速度通常越大"],"teacher":{"contrast":[["平均速度","整个过程：总路程÷总时间。"],["算术平均","只有相应特殊条件成立，才与平均速度相等。"]],"reason":"先画两段过程，分别列路程和用时。圈出题目问“哪一段”；先换单位，再计算。","experiment":"测平均速度：路程与时间必须对应同一过程；坡度过大、过程过快可能增大计时困难。"},"variant":["相同的两段路程分别以2 m/s、1 m/s走完，全程平均速度？",["1.5 m/s","约1.33 m/s","3 m/s"],1,"取每段2 m：总路程4 m，用时1＋2＝3 s，所以4/3≈1.33 m/s。等路程不等时间，不能直接平均速度。"]},{"id":2,"title":"声现象","lead":"声音的高、响和特色，区别在哪？","lab":"sound","goal":"振动与传播 → 三个特性 → 声音应用与降噪","concepts":[["声音从振动来","声音由物体振动产生。敲鼓时鼓面振动，音叉发声时也振动。振动停止，相应声源的发声停止；已经传播出去的声音还可能继续传播。"],["传播需要介质","固体、液体、气体都可以传声，真空不能传声。空气中声速在15℃时约340 m/s，随温度、介质等条件变化，不是所有题都用340。"],["音调、响度、音色","音调看频率：振动越快，通常音调越高。响度与振幅、距离等有关：振幅越大通常越响。音色由发声体特点等决定，帮助辨认声音来自谁。不能用“更响”代替“音调更高”。"],["超声、次声与应用","通常人耳听觉频率约20—20000 Hz。高于上限为超声，低于下限为次声，按频率区分，不是按响度。声音能传信息，也能传能量，如超声检测和清洗。"],["控制噪声","声源处：减少或停止振动；传播过程：隔音屏、关窗；人耳处：耳塞。研究音调时要主要改变频率，研究响度时要主要改变振幅。"]],"example":["回声测距","声音发出后0.4 s听到回声，声速340 m/s，障碍物距声源多远？","① 0.4 s对应去、回两段。② 声音总路程＝340×0.4＝136 m。③ 单程距离＝136÷2＝68 m。④ 不把往返路程当距离。"],"quiz":[["敲同一面鼓更用力，主要改变什么？",["音色","响度","一定改变音调"],1,"更用力通常使振幅更大、响度更大。不能由用力大小直接推断频率。"],["月面近乎真空，两人能靠空气直接交谈吗？",["能","不能","大声就能"],1,"声音需要介质，近乎真空不能靠空气直接传声，可以用无线电传信息。"]],"recap":["音调看频率，响度看振幅等，辨人靠音色。","真空不能传声。","回声测距离要考虑往返。"],"mission":{"name":"辨认声源","question":"同一琴弦振动得更快，先变化的是？","options":["音调","响度","一定改变音色"],"correct":0,"reason":"频率变高，音调升高；不能由频率直接判断响度。","anchor":"音调看快慢，响度看幅度。"},"focus":["声音来自振动","声音传播要有介质","高、响、特色：分开判断","超声按频率分，不按响度分","降噪可从三个位置入手"],"teacher":{"contrast":[["音调","由频率高低判断，回答“高或低”。"],["响度","与振幅、距离等有关，回答“响或轻”。"]],"reason":"遇到声音题，先判断考产生、传播、特性还是应用。分别找振动、介质、频率、振幅等证据。","experiment":"研究频率与音调：改变振动快慢。用小球弹起等现象显示振动，属于转换思路。"},"variant":["同一声源频率不变、振幅变大，通常怎样？",["音调更高","响度更大","音色一定改变"],1,"频率不变不意味着音调升高；相同距离等条件下，振幅更大通常响度更大。"]},{"id":3,"title":"光现象与透镜","lead":"先追踪光怎么走，再判断像在哪里。","lab":"light","goal":"直线传播 → 反射与折射 → 成像与作图","concepts":[["光的直线传播与小孔成像","自身能发光的物体叫光源；月亮、书本反射其他光，不是光源。看见物体，是它发出或反射的光进入眼睛。在同种均匀介质中，光沿直线传播，影子、日食和小孔成像都可用这个规律解释。小孔成像是倒立实像：物体顶端光经孔到像的下端，底端光到上端，光线在孔处交叉。像大小与物、孔、光屏的相对距离有关；不是由孔形状决定。"],["反射先画法线","法线过入射点且垂直镜面。入射角、反射角都从法线量起，反射角＝入射角。漫反射也遵守反射定律，光路可逆。作图先画法线，再画光线箭头。"],["平面镜成虚像","像与物等大，像距与物距相等，连线垂直镜面，关于镜面对称。虚像不能用光屏承接；人靠近镜子，像的实际大小不变。实验用玻璃板及相同蜡烛定位与比较大小，玻璃板需竖直。"],["折射与色光","空气斜入水或玻璃，折射光通常靠近法线；反向进入空气时远离法线。垂直入射方向不变。水底看起来变浅与折射有关。白光可色散，光的三原色红、绿、蓝；不透明物体颜色取决于主要反射的色光。"],["凸透镜成像要看物距","凸透镜会聚，凹透镜发散。物距u＞2f：倒立缩小实像；u＝2f：倒立等大实像；f＜u＜2f：倒立放大实像；u＜f：正立放大虚像；u＝f时不在有限距离成清晰像。相机、投影仪、放大镜分别对应相应区间。"],["作图、实验与眼镜","平行主轴的光经凸透镜后过焦点，过光心光方向近似不变。实验使烛焰、透镜、光屏中心大致同高。近视通常用凹透镜矫正，远视通常用凸透镜矫正。红外线常涉及热效应，紫外线可引起荧光等。"]],"example":["镜面角不等于入射角","光线与镜面夹角30°，求反射角。","① 法线与镜面垂直。② 入射角＝90°−30°＝60°。③ 反射角＝入射角＝60°。④ 两个角都以法线为基准。"],"quiz":[["人离平面镜2 m，像离人多远？",["2 m","4 m","1 m"],1,"像在镜后2 m，人在镜前2 m，人像距离为4 m。"],["凸透镜f＝10 cm，u＝15 cm，成什么像？",["倒立放大实像","正立缩小实像","正立放大虚像"],0,"10＜15＜20，即f＜u＜2f，成倒立放大实像；像距大于2f。"]],"recap":["先画法线，角从法线量。","平面镜物像对称。","凸透镜先比较u、f、2f，再说大小、正倒、虚实。"],"mission":{"name":"镜面探路","question":"光线与镜面夹角20°，反射角是多少？","options":["20°","70°","90°"],"correct":1,"reason":"角要从法线量：入射角90°−20°＝70°，反射角相同。","anchor":"先画法线，再量角。"},"focus":["沿直线追光：小孔形成倒立实像。","反射角＝入射角","像与物关于镜面对称","跨介质时，光路可能转弯","凸透镜先比较u、f和2f","实像可以用光屏承接"],"teacher":{"contrast":[["实像","实际光线会聚形成，可用光屏承接。"],["虚像","光线反向延长线等形成，不能用光屏承接。"]],"reason":"反射先画法线；成像先识别平面镜还是透镜；透镜先比较u、f、2f，再判断正倒、大小、虚实。","experiment":"平面镜实验用相同物体比较大小、定位像；凸透镜实验中心同高。换位置多测为检验普遍规律。"},"variant":["入射角40°，入射光线与反射光线间夹角是多少？",["40°","80°","140°"],1,"两条光线位于法线两侧，夹角＝入射角＋反射角＝80°。"]},{"id":4,"title":"温度与物态变化","lead":"先认状态变化，再判断吸热放热。","lab":"phase","goal":"温度读数 → 六种变化 → 温度图像与实验","concepts":[["温度与测量","温度表示冷热程度。液体温度计通常利用热胀冷缩。先看量程、分度值，感温部分充分浸入且不碰底壁，示数稳定后视线与液面相平读数，通常仍留在被测液体中。体温计等器材按其说明操作。"],["六种变化","固→液熔化，液→固凝固；液→气汽化，气→液液化；固→气升华，气→固凝华。熔化、汽化、升华吸热，逆过程放热。"],["蒸发与沸腾","蒸发在液体表面发生，任何温度下可发生；沸腾在液体内部和表面同时剧烈发生，需达到相应沸点并持续吸热。蒸发快慢与温度、表面积、表面空气流动等有关。"],["温度不变也可能吸热","晶体熔化时持续吸热，温度保持熔点；一定气压下液体沸腾时继续吸热，温度保持沸点。非晶体熔化没有固定熔点。沸点会随液面上方气压变化。"],["辨认生活现象","露、雾和常见“白气”主要是水蒸气液化形成的小液滴，不是看得见的气态水。霜是凝华形成冰晶。干冰直接变成气体是升华。实验图像先看坐标和条件，再找平台及前后状态。"]],"example":["温度平台怎么读","给冰持续加热，一段时间温度保持0℃，冰逐渐减少。这一段吸热吗？","① 研究冰的熔化过程。② 冰是晶体，熔化期间温度可不变。③ 仍持续吸热，用于物态改变。④ 温度不变不等于没有吸热。"],"quiz":[["湿衣服晾干是什么变化？",["液化放热","汽化吸热","升华吸热"],1,"液态水变成气态水，是汽化中的蒸发，吸热。"],["冬天窗玻璃出现霜，是什么变化？",["凝华","凝固","液化"],0,"水蒸气直接变成冰晶，是气态到固态的凝华，放热。"]],"recap":["先写变化前后状态，再选名称。","晶体熔化、液体沸腾平台仍吸热。","“白气”通常是小液滴，不是水蒸气。"],"mission":{"name":"冰块解冻","question":"冰正在0℃熔化。继续加热，温度会怎样？","options":["马上升高","保持不变直到熔化完成","立即降低"],"correct":1,"reason":"冰是晶体，熔化期间仍吸热，但温度保持熔点。","anchor":"温度不变，也能吸热。"},"focus":["读数前，等温度计稳定","先认变化前后的状态","蒸发和沸腾不是同一种过程","熔化平台，吸热不停","白气通常是小液滴"],"teacher":{"contrast":[["温度变化","看图像纵坐标是否改变。"],["吸热放热","看能量传递；不能只看温度是否变化。"]],"reason":"先确定物态前后，再说变化名称；温度图先看晶体或非晶体、气压等条件，再分析平台。","experiment":"沸腾时继续加热，温度在相应沸点保持不变；撤去热源后沸腾通常不能持续，注意器材余热。"},"variant":["“任何固体熔化时温度都不变”是否正确？",["正确","不正确","只要加热就正确"],1,"晶体在相应熔化过程温度不变，非晶体没有固定熔点，不能把晶体规律推广给所有固体。"]},{"id":5,"title":"质量与密度","lead":"先懂质量，再理解每一份物质的质量。","lab":"density","goal":"质量 → 单位体积的质量 → 计算与测量","concepts":[["质量：所含物质的多少","一块20 g橡皮放进书包或捏变形，只要没有增减物质，质量仍是20 g。质量表示物体所含物质的多少，用m表示，单位kg或g，1 kg＝1000 g。切成两块，两块都留下时总质量不变；每一块的质量则比原来小。重力是地球吸引产生的力，单位N，不能把质量和重力混为一谈。"],["密度是每一份的质量","大木块可能比小铁钉质量大，所以不能只凭质量判断密度。统一体积后比较：10 cm³铝质量27 g，每1 cm³就是2.7 g。密度ρ＝m/V，表示单位体积某种物质的质量。"],["切一半，密度不变","同种均匀材料、相同温度状态等条件下，切一半时质量与体积都减半，比值不变。密度也会受温度、状态等影响，不能认为任何情况下不变。"],["三个公式是一件事","求密度ρ＝m/V，求质量m＝ρV，求体积V＝m/ρ。三量要对应同一对象。g与cm³配套得g/cm³；kg与m³配套得kg/m³；1 g/cm³＝1000 kg/m³。"],["比较先找相同条件","同体积，密度大的质量大；同质量，密度大的体积小。空心物体可先用m/ρ材料求材料体积，再与外部总体积比较，不把空腔当成材料。"],["测量看增加了多少","通常先测干燥物体质量，再用排水法测体积：完全浸没后的读数减原水读数。适用于不溶、不明显吸水等合适物体，避免气泡洒水。测液体可用杯与液体倒出前后质量差，配量筒中倒出体积。天平调平在测量前进行，测量中不调平衡螺母。"]],"example":["石块体积从哪里来？","石块质量52 g，量筒原水30 mL，完全浸没后50 mL，求密度。","① 质量与体积对应同一石块。② V＝50−30＝20 mL＝20 cm³。③ ρ＝52÷20＝2.6 g/cm³。④ 50 mL是总读数，不能直接当石块体积。"],"quiz":[["均匀铝块切成相等两半，相同条件下密度？",["减半","不变","加倍"],1,"质量、体积同比例减半，m/V不变。"],["体积30 cm³，铝密度2.7 g/cm³，质量？",["81 g","11.1 g","0.09 g"],0,"m＝ρV＝2.7×30＝81 g，每份质量乘份数。"]],"recap":["密度比较单位体积质量，不只看整块谁重。","公式三量对应同一物体，单位配套。","排水法用增加的体积。"],"mission":{"name":"辨认物资","question":"铝块体积加倍，其他条件相同，质量与密度怎么变？","options":["质量加倍，密度不变","质量不变，密度加倍","都加倍"],"correct":0,"reason":"同种均匀材料相同条件下，m＝ρV；体积加倍，质量加倍，ρ不变。","anchor":"密度是“每一份”的质量。"},"focus":["不增减物质，改变位置或形状，不改变质量。","先把体积统一，再比质量","取多取少，比值通常不变","每份质量×份数＝总质量","先找哪个条件相同","排水法看水位增加量"],"teacher":{"contrast":[["质量","物体所含物质多少，取大块通常更多。"],["密度","单位体积质量；同种均匀材料相同条件下，取多取少通常不变。"]],"reason":"先确认质量、体积是哪一个物体的，再判断求ρ、m还是V。实验题先求差值，计算题先配单位。","experiment":"测固体通常先称干质量再排水；测液体用倒出前后质量差，对应量筒中的倒出体积。"},"variant":["铁比铝密度大，实心铁和铝质量相同，谁体积大？",["铁","铝","一样"],1,"质量固定，用V＝m/ρ。密度小的铝需要更大体积才能达到相同质量。"]},{"id":6,"title":"力与运动","lead":"匀速前进，也可能一直受力。","lab":"force","goal":"力与受力图 → 惯性 → 平衡与摩擦","concepts":[["力是物体间的作用","力能改变形状或运动状态，大小、方向、作用点影响作用效果，单位N。物体间作用相互。画受力图先确定研究物体，只画它受到的力，不把它对别人的力画进去。"],["重力与测力","G＝mg，质量m用kg，g按题取值，重力方向竖直向下，不等于垂直所有斜面。弹簧测力计看量程分度值、调零，拉力沿弹簧轴线。"],["惯性不是一种力","惯性是保持原运动状态的性质，大小与质量有关。刹车时人向前倾，是身体原有运动状态保持的趋势，不说“受到惯性力”。力是改变运动状态的原因，不是维持运动的原因。"],["二力平衡","静止或匀速直线运动属于平衡状态。二力平衡：同一物体、大小相等、方向相反、同一直线。相互作用力作用在两个物体上；平衡力作用在同一个物体上。"],["摩擦力","滑动摩擦大小与压力及粗糙程度有关。静摩擦按实际需求变化，不直接套滑动摩擦规律。摩擦阻碍接触面相对滑动或趋势，不一定与物体运动方向相反。鞋底花纹增摩擦，润滑、滚动代替滑动可减摩擦。"],["实验与控制变量","匀速水平拉木块时，拉力与摩擦平衡，测力计示数等于摩擦力。研究压力影响，要保持粗糙程度相同；研究粗糙程度影响，要保持压力相同。匀速转弯方向仍变化，不是匀速直线平衡。"]],"example":["匀速拉箱子","水平地面上拉箱子匀速直线运动，水平拉力30 N，摩擦力多少？","① 研究箱子。② 匀速直线，水平方向受力平衡。③ 拉力与摩擦等大反向，摩擦30 N。④ 不能说“匀速所以不受力”。"],"quiz":[["2 kg物体重力多少（g＝10 N/kg）？",["2 N","20 N","200 N"],1,"G＝mg＝2×10＝20 N。"],["书静止桌上，书的重力与桌面对书的支持力是什么关系？",["平衡力","相互作用力","没有关系"],0,"都作用在书上，等大反向共线，是平衡力。书对桌面压力与桌面对书支持力才是一对相互作用力。"]],"recap":["先定受力对象。","静止或匀速直线用平衡。","惯性是性质，不是力；摩擦需看相对运动。"],"mission":{"name":"运输箱受力","question":"箱子正被水平拉着匀速直线运动，拉力30 N。摩擦力？","options":["0 N","30 N","大于30 N"],"correct":1,"reason":"匀速直线运动时水平方向平衡，摩擦与拉力等大反向。","anchor":"匀速不是没受力，是力平衡。"},"focus":["先问谁对谁施力","重力方向竖直向下","惯性是性质，不是一种力","平衡力必须作用在同一物体上","摩擦阻碍相对滑动或趋势","比较一个因素，其余条件保持相同"],"teacher":{"contrast":[["平衡力","作用在同一物体上；平衡时等大、反向、共线。"],["相互作用力","分别作用在两个物体上，例如手推墙与墙推手。"]],"reason":"先圈研究物体，再列受力，最后看静止、匀速直线或运动状态改变。不要凭“正在运动”猜合力。","experiment":"测滑动摩擦须匀速水平拉动，才可由二力平衡把测力计拉力当摩擦力。"},"variant":["箱子在水平地面前进，撤去拉力后仍有摩擦，它通常怎样？",["立刻停止","继续前进并减速","一直匀速"],1,"惯性使物体不能立刻停下；摩擦导致运动状态改变，通常逐渐减速。"]},{"id":7,"title":"压强与浮力","lead":"同样用力，效果为什么不一样？","lab":"pressure","goal":"压力与压强 → 液体与大气 → 浮力和浮沉","concepts":[["压力与压强","压力垂直作用于表面；压强是单位面积受到的压力。p＝F/S，F单位N、S单位m²，p单位Pa。面积是实际受力面积。水平放置且无其他竖直作用力时压力常等于重力，不能在所有情境套用。"],["液体压强","静止同种液体越深压强越大，同深度各方向压强相等。p＝ρgh，h是从自由液面竖直向下的深度，不是沿容器壁距离。液体压强还与密度有关。该式水压不自动包含大气压。"],["大气、连通器与流体","吸管饮水是内外压强差：管内压强降低，外界大气压把饮料压上。上端开口、底部连通、同种静止液体液面相平。常见适用流动情境中流速大处压强小，须按题设条件判断。"],["阿基米德原理","F浮＝ρ液gV排。浮力等于排开流体的重力。完全浸没时V排等于物体总体积，部分浸入时只算浸入部分。称重法F浮＝G−F示。完全浸没、体积不变时，在密度均匀水中继续下沉浮力通常不变。"],["浮沉条件","无其他竖直外力时，静止漂浮或悬浮有F浮＝G。漂浮部分浸入，悬浮完全浸没。比较浮力和重力可判断释放后的运动趋势。均匀实心物体密度与液体密度比较可判断浮沉；空心物体需考虑平均密度。"],["实验与应用","海绵凹陷反映压力效果，控制压力或面积。研究液体压强深度影响需保持液体密度不变。浮力实验可比较G−F示与排液重力。船重不变驶入更密的液体，排开体积变小。"]],"example":["先认压力和面积","箱子对水平面压力200 N，受力面积0.04 m²，压强多少？","① 求单位面积压力。② p＝F/S＝200÷0.04＝5000 Pa。③ 若面积减半、压力不变，压强加倍。④ 别把面积单位cm²直接当m²。"],"quiz":[["排开水200 cm³，浮力多少（g＝10）？",["2 N","20 N","200 N"],0,"V排＝2×10⁻⁴ m³；F浮＝1000×10×2×10⁻⁴＝2 N。"],["重8 N物体静止漂浮，浮力多少？",["大于8 N","等于8 N","小于8 N"],1,"漂浮静止且无其他竖直外力，受力平衡，浮力＝重力＝8 N。"]],"recap":["压强先找压力和真实面积。","浮力用液体密度、排开体积。","漂浮先用平衡，不猜浸入多少。"],"mission":{"name":"安全过泥地","question":"同样压力下，把接触面积加倍，压强？","options":["加倍","减半","不变"],"correct":1,"reason":"p＝F/S，压力固定，面积加倍则压强减半。","anchor":"同样力，分散到更大面积。"},"focus":["压强＝压力÷受力面积","深度从液面竖直往下量","吸管靠内外压强差","浮力等于排开液体的重力","漂浮静止：浮力＝重力","实验先控制压力、面积或深度"],"teacher":{"contrast":[["压力","垂直作用在表面的力，单位N。"],["压强","压力作用效果，p＝F/S，单位Pa。"]],"reason":"压强先找F、S；液体先找ρ、h；浮力先找ρ液、V排；漂浮静止可先由平衡求F浮。","experiment":"海绵凹陷反映压力效果；同种液体改深度研究压强；浮力可用称重法与排液重力比较。"},"variant":["物体重10 N、向上绳拉力2 N，在水中静止，浮力多少？",["10 N","8 N","12 N"],1,"物体受重力向下、浮力与绳拉力向上。平衡：F浮＋2＝10，所以F浮＝8 N。不能有绳拉力还直接套F浮＝G。"]},{"id":8,"title":"简单机械、功与机械能","lead":"省力、做功快、效率高，是三件事。","lab":"lever","goal":"杠杆滑轮 → 功与功率 → 效率与能量","concepts":[["杠杆与力臂","力臂是支点到力作用线的垂直距离，不一定是杆长。平衡F₁l₁＝F₂l₂。动力臂长通常可省力，但费距离。作图延长力作用线，从支点作垂线。实验先调水平便于测力臂。"],["滑轮","定滑轮主要改变力方向；理想动滑轮省一半力。滑轮组看承担动滑轮及重物的绳段数n，理想F＝G/n，s＝nh；考虑动滑轮自重、忽略摩擦时F＝(G物＋G动)/n。"],["功与功率","力做功需有力及沿力方向的位移。同向时W＝Fs，P＝W/t；匀速同向P＝Fv。W单位J，P单位W。推墙没推动，推力对墙不做功；竖直提物水平走，竖直提力不做功。"],["机械效率","η＝W有/W总×100%。提升重物W有＝Gh，绳端输入W总＝Fs。实际有额外功，效率通常小于100%。功率比较快慢，效率比较有用功占比，二者不等同。"],["动能与势能","动能与质量、速度有关；重力势能与质量、高度有关；弹性势能与弹性形变等有关。机械能是动能与势能总和。无耗散理想条件机械能可守恒，有摩擦时部分机械能转成内能。"],["实验图像","研究动能影响，可用物体推动木块距离反映动能，比较速度时保持质量相同。杠杆多组数据用来寻找普遍关系。效率测量需区分重物上升高度h和绳端距离s。"]],"example":["功与功率一起求","沿运动方向用50 N拉物体4 m，用时10 s，求功与功率。","① 力与位移同向，W＝Fs＝50×4＝200 J。② P＝W/t＝200÷10＝20 W。③ 同样功用时更短，功率更大。"],"quiz":[["动力臂0.4 m、阻力臂0.2 m、阻力40 N，平衡动力多少？",["20 N","40 N","80 N"],0,"F＝40×0.2÷0.4＝20 N。力臂越长，产生同样力矩所需力可更小。"],["有用功80 J，总功100 J，效率？",["80%","125%","20%"],0,"η＝80/100×100%＝80%。"]],"recap":["力臂是垂直距离。","功看能量多少，功率看快慢，效率看占比。","滑轮先数承担动滑轮的绳段。"],"mission":{"name":"省力起重机","question":"阻力与阻力臂固定，把动力臂加倍，平衡动力？","options":["加倍","减半","不变"],"correct":1,"reason":"F₁l₁＝F₂l₂，动力臂加倍，所需动力减半。","anchor":"推门离门轴远，通常更省力。"},"focus":["力臂是垂直距离，不一定是杆长","滑轮先数承担重物的绳段","功是做多少，功率是做多快","效率看有用功占总功多少","有摩擦时，机械能可转为内能","实验用可观察量反映能量"],"teacher":{"contrast":[["功率","做功快慢，P＝W/t。"],["机械效率","有用功占总功比例，η＝W有/W总。"]],"reason":"杠杆先找支点和垂直力臂；滑轮先数绳段；功效率先区分重物高度h和绳端距离s。","experiment":"杠杆多组数据找普遍关系；效率实验分别测重物重力、上升高度、拉力与绳端距离。"},"variant":["理想滑轮组由2段绳承担重物，重物上升0.5 m，绳端移动多远？",["0.25 m","0.5 m","1 m"],2,"s＝nh＝2×0.5＝1 m。省力通常费距离，不能把h直接当s。"]},{"id":9,"title":"内能与热量","lead":"温度、内能、热量，怎样区分？","lab":"heat","goal":"分子运动 → 内能变化 → 热量与热机","concepts":[["分子在运动","扩散说明分子不停做无规则运动；温度越高通常越剧烈。分子间存在引力和斥力。灰尘的运动不直接等于分子运动，不能把看得见的小颗粒当分子。"],["三个概念","温度表示冷热程度；内能是分子动能与分子势能总和；热量是热传递过程转移的能量。物体有内能，不说“含有热量”。同温不等于同内能，还要考虑质量、种类、状态等。"],["做功与热传递","搓手、压缩气体可通过做功改变内能；热水使冷物变暖是热传递，需要温差。晶体熔化时温度不变，也能吸热、内能改变。"],["比热容","c表示单位质量物质温度升高单位温度所需热量。无物态变化的相应过程Q＝cmΔt，Δt是温差。相同质量、相同吸热，c大的升温较小；相同质量升温相同，c大的吸热更多。"],["燃料与热机","完全燃烧Q放＝mq，q是热值。实际利用热量常小于放热，η＝Q有用/Q放。四冲程热机中压缩冲程机械能转内能，做功冲程内能转机械能；其余冲程按结构与过程辨认。"],["实验与能量","比较比热容可取等质量不同物质，用相同加热条件比较温升或达到相同温升的加热时间；需明确加热时间作为吸热多少的近似依据。能量守恒不等于所有能量可方便重新利用。"]],"example":["先求温差","1 kg水由20℃升到30℃，c＝4200 J/(kg·℃)，求吸热。","① 无物态变化，Δt＝30−20＝10℃。② Q＝cmΔt＝4200×1×10＝42000 J。③ 不能直接拿终温30℃代温差。"],"quiz":[["搓手变热主要是哪种方式？",["做功","热传递","无法改变内能"],0,"克服摩擦做功，将机械能等转为内能。"],["同质量、吸相同热量，比热容大的物质温升怎样？",["更大","更小","必然相等"],1,"Δt＝Q/(cm)，Q与m相同，c越大，温升越小。"]],"recap":["物体有内能，热量描述传递过程。","先求温差，再用Q＝cmΔt。","完全燃烧用mq，实际利用还看效率。"],"mission":{"name":"保温补给站","question":"同种水、升温都10℃，水的质量加倍，所需热量？","options":["不变","减半","加倍"],"correct":2,"reason":"Q＝cmΔt，c和温升不变，质量加倍，所需热量加倍。","anchor":"水多一倍，同样升温要更多热。"},"focus":["分子一直在无规则运动","温度、内能、热量要分开","做功和热传递都可改变内能","先求温差，再算热量","燃料完全燃烧用Q＝mq","比较比热容要控制质量等条件"],"teacher":{"contrast":[["内能","物体分子动能与分子势能的总和。"],["热量","热传递过程中转移的能量，不说物体“含有热量”。"]],"reason":"先区分升降温、燃料燃烧还是能量转化；升温先求温差，再用cmΔt；燃烧用mq并检查效率。","experiment":"比较比热容：质量相同、加热条件相同，以温升或相同温升的加热时间比较。"},"variant":["水从20℃升到30℃与30℃升到40℃，同质量、无物态变化时吸热？",["前者更多","后者更多","相同"],2,"两次温差都10℃，c和m相同，Q＝cmΔt相同；不是终温越高这次吸热就更多。"]},{"id":10,"title":"电路与欧姆定律","lead":"先看电流路径，再决定用哪条规律。","lab":"circuit","goal":"电路与电表 → 电阻 → 欧姆定律与实验","concepts":[["电荷与电路","同种电荷相斥、异种相吸；摩擦起电是电荷转移。电源外部规定电流方向正极到负极，与金属中电子定向移动相反。完整闭合通路才可能有持续电流。电源两极被导线直接连接是危险的电源短路。"],["串联与并联","串联一条路径：I相同，U总＝U₁＋U₂，R总＝R₁＋R₂。并联有分支：U相同，I总＝I₁＋I₂，1/R总＝1/R₁＋1/R₂。看连接路径，不看灯泡画在一排还是两排。"],["电表","电流表串联，电压表并联在待测两端；正进负出、合适量程。电流表不能直接接电源两极。读数先看接入量程，再看分度值。1 A＝1000 mA。"],["电阻与变阻器","电阻与材料、长度、横截面积、温度有关。滑动变阻器改变接入电阻丝长度，常接一上一下，接入前调最大阻值。R＝U/I是求值方法，不说明电流变大电阻就必然变小。"],["欧姆定律","I＝U/R，U＝IR，R＝U/I。同一次计算的U、I、R对应同一元件或同一等效电路。在电阻等条件不变时I与U成正比；U不变时I与R成反比。灯丝电阻随温度变化。"],["实验与故障","探究I与U保持R不变；探究I与R更换电阻后用变阻器保持被研究电阻两端U不变。伏安法同时测U、I求R。故障先看通路和电表位置，不能仅凭电压表有示数就判断原因。局部短路不等于电源短路。"]],"example":["串联从共同电流入手","10 Ω与20 Ω串联接6 V，求电流和各自电压。","① R总＝30 Ω。② I＝6÷30＝0.2 A。③ U₁＝0.2×10＝2 V；U₂＝0.2×20＝4 V。④ 两电压相加为6 V，符合电源。"],"quiz":[["10 Ω接3 V，电流多少？",["30 A","0.3 A","3.3 A"],1,"I＝U/R＝3÷10＝0.3 A。"],["探究I与R，更换电阻后要保持什么不变？",["电阻电压","电流","总电阻"],0,"保持被研究电阻两端电压不变，比较不同电阻对应的电流。"]],"recap":["串联先找同电流，并联先找同电压。","欧姆定律三量对应同一对象。","实验先看谁改变、谁保持不变。"],"mission":{"name":"基地供电","question":"10 Ω和20 Ω，6 V电源。由串联改并联，干路电流？","options":["变大","变小","不变"],"correct":0,"reason":"串联I＝6/30＝0.2 A；并联I＝6/10＋6/20＝0.9 A。","anchor":"先看路径，再找共同的量。"},"focus":["通路与短路，先追踪连接","串联同电流，并联同电压","电流表串，电压表并","变阻器看实际接入长度","U、I、R必须对应同一对象","实验先找改变和保持不变的量"],"teacher":{"contrast":[["总电压","电源或整个串联电路两端电压。"],["元件电压","某个元件两端电压；不能与其他元件电阻随意组合。"]],"reason":"先简化电流路径，再判串并联；串联从共同电流开始，并联从共同电压开始。三量必须对应同一对象。","experiment":"I与R关系需保持被研究电阻两端电压不变，不能把电源电压不变当作所有实验条件都满足。"},"variant":["10 Ω和20 Ω串联接6 V，10 Ω两端电压？",["6 V","2 V","4 V"],1,"先求共同电流6/(10＋20)＝0.2 A，再求U₁＝0.2×10＝2 V。不能把6 V直接分配给每个串联电阻。"]},{"id":11,"title":"电功、电功率与安全用电","lead":"耗电多少，取决于功率和时间。","lab":"power","goal":"电能功率 → 电热 → 测功率与安全用电","concepts":[["电功与电功率","电功表示电能转化多少：W＝UIt＝Pt。电功率表示快慢：P＝UI。用W和s得到J，用kW和h得到kWh。1 kWh＝3.6×10⁶ J，日常叫一度电。"],["额定与实际","额定功率对应额定电压；实际条件改变，实际功率可能改变。纯电阻条件P＝I²R＝U²/R；小灯泡温度变化会改变电阻，不能无条件视作定值。"],["焦耳定律","Q＝I²Rt表示电流产生热量。串联电流相同、相同时间时，电阻大产生热量多；并联同电压、相同时间时纯电阻热量可用U²t/R比较。电动机耗电不全变电热，不能用U²t/R当全部电能。"],["测灯泡功率","电流表串联、电压表并联，变阻器调电压到额定值，读电流，P额＝U额I。还可测不同实际电压的功率，不能把多个实际功率平均当额定功率。"],["家庭电路","用电器通常并联，开关接火线与用电器之间，有关金属外壳电器按规范接地。家庭电压通常220 V。电流过大可能因短路或总功率过大。"],["安全只在图上学","不湿手操作，不拆接市电。断路、短路按图分析；测电笔、接地和保护装置按学校规范及器材说明学习，不因会做题而尝试带电操作。"]],"example":["算耗电，单位成套","100 W灯工作2 h，耗电几度？","① 功率100 W＝0.1 kW。② W＝Pt＝0.1×2＝0.2 kWh。③ 也就是0.2度。④ 若用J，需把2 h化成7200 s。"],"quiz":[["0.5 kW电器工作4 h，耗电？",["2 kWh","0.125 kWh","2000 kWh"],0,"W＝Pt＝0.5×4＝2 kWh。"],["2 A流经5 Ω电阻10 s，热量？",["100 J","200 J","50 J"],1,"Q＝I²Rt＝2²×5×10＝200 J。注意电流要平方。"]],"recap":["功率快慢，电能多少。","kW配h，W配s。","电热不一定等于全部输入电能。"],"mission":{"name":"电量预算","question":"使用时间相同，把电器功率加倍，耗电量？","options":["减半","加倍","不变"],"correct":1,"reason":"W＝Pt，时间不变，功率加倍，电能加倍。","anchor":"一度电＝1 kWh。"},"focus":["电功看多少，功率看快慢","额定功率对应额定电压","电流产生热量：Q＝I²Rt","测额定功率先调额定电压","家用电器通常并联","安全用电只在图上学习"],"teacher":{"contrast":[["额定功率","额定电压下的功率。"],["实际功率","当前工作条件下的功率，未必等于额定功率。"]],"reason":"耗电量先选Pt，功率选UI；电热选I²Rt。纯电阻与电动机分清，再决定能否用U²/R。","experiment":"测额定功率先把灯泡电压调到额定值，再读电流；多个实际功率不能平均成额定功率。"},"variant":["定值电阻两端电压减半，电阻不变，功率变为原来的？",["一半","四分之一","两倍"],1,"纯电阻P＝U²/R；电压减半，其平方为原来的1/4，功率也为1/4。这里明确电阻不变，不能无条件套给变温灯丝。"]},{"id":12,"title":"电与磁、能源与信息","lead":"电生磁、磁生电，先认过程。","lab":"magnet","goal":"磁场电磁铁 → 电动机发电机 → 能源信息","concepts":[["磁体与磁场","同名磁极相斥、异名相吸。磁场真实存在，磁感线是描述工具，不是真实细线。磁体外部磁感线N到S。小磁针N极所指方向定义该点磁场方向。"],["电流产生磁场","通电导线周围有磁场。电磁铁磁性与电流、线圈匝数等有关；其他条件相同，电流增大或匝数增加通常增强磁性。通电螺线管可用右手安培定则判断极性，需看具体绕线和电流方向。"],["电动机","通电导体在磁场中可受力，电动机主要电能转机械能。受力方向与电流方向和磁场方向有关，改变其中一个可改变方向。"],["发电机","闭合电路一部分导体切割磁感线可产生感应电流，发电机利用电磁感应，机械能转电能。注意闭合电路和切割条件；改变运动或磁场方向可改变感应电流方向。"],["能源与守恒","能量能转移、转化，总量守恒，但利用有方向性，仍需节能。太阳能、风能等可再生；煤、石油、天然气及核燃料等不可再生。核电站利用核能，常涉及核裂变。"],["电磁波与材料","电磁波可在真空传播，真空速度约3×10⁸ m/s，光也是电磁波。手机靠电磁波传信息，光纤靠光传播。材料应用要看属性：导体、绝缘体、半导体、超导等不能仅凭外形判断，石墨也可导电。"]],"example":["装置原理怎么选","一个装置转动线圈，向外输出电能。它更接近电动机还是发电机？","① 起始输入是机械运动。② 输出电能。③ 属发电机，主要利用电磁感应。④ 电动机是通电后产生机械运动，能量方向相反。"],"quiz":[["通电吸起铁料、断电放下，主要用什么？",["电磁铁","平面镜","发电机"],0,"电磁铁磁性受电流控制，断电后磁性大幅减弱，便于释放铁料。"],["声音和电磁波，谁能在真空传播？",["声音","电磁波","都能"],1,"声音需介质，电磁波可以在真空传播。"]],"recap":["电磁铁：电流产生磁场。","电动机：通电受力；发电机：电磁感应。","能量守恒仍需节能；光属于电磁波。"],"mission":{"name":"磁力回收站","question":"线圈被机械装置转动，向外输出电能，它更接近？","options":["电动机","发电机","电热器"],"correct":1,"reason":"输入机械运动、输出电能，是发电机，利用电磁感应。","anchor":"先认输入和输出，再选原理。"},"focus":["磁场真实存在，磁感线是工具","电流可以产生磁场","电动机：通电受力而运动","发电机：运动产生感应电流","能量守恒，仍然需要节能","电磁波可以在真空传播"],"teacher":{"contrast":[["电动机","电能输入，机械运动输出；通电导体受磁场力。"],["发电机","机械能输入，电能输出；电磁感应。"]],"reason":"先认装置输入和输出，再选电生磁、通电受力或电磁感应。能源题先辨来源，再辨转化。","experiment":"电磁感应需闭合电路及切割磁感线；判断方向改变时，说明哪些条件改变、哪些保持不变。"},"variant":["闭合电路导体切割磁感线，运动方向和磁场方向同时反向，感应电流方向？",["改变","不变","一定没有电流"],1,"只改变其中一个方向会反向；两个同时反向，方向保持原来。其他相关条件相同。"]}];

};
function labValues(kind,a,b,mode,on){switch(kind){
case'density':{const r=Number(mode)||2.7;return {value:r*a,bar:a/40,text:`体积${a} cm³ × 每cm³质量${r} g＝${(r*a).toFixed(1)} g。改变大小，密度仍是${r} g/cm³。`}}
case'motion':return {value:120/a,bar:120/a/12,text:`v＝120 ÷ ${a}＝${(120/a).toFixed(2)} m/s。用时减少，同路程的平均速度增大。`};
case'sound':return {value:a,bar:b/5,text:`频率${a} Hz：每秒振动${a}次。相对振幅${b}级。频率变高对应音调升高；振幅变大通常对应响度增大。`};
case'light':return {value:a,bar:a/80,text:`入射角${a}° → 反射角${a}°；入射光与镜面夹角${90-a}°。`};
case'phase':{let state,temp;if(a<30){state='冰升温';temp=-10+a/3}else if(a<=65){state='冰与水共存，正在熔化';temp=0}else{state='全部熔化后的水继续升温';temp=(a-65)*2}return {value:temp,bar:Math.max(0,(temp+10)/80),text:`${state}，示意温度${temp.toFixed(1)}℃。熔化阶段仍吸热，温度不变。`}}
case'force':return {value:a*10,bar:a/10,text:`重力G＝${a}×10＝${a*10} N，方向竖直向下；支持力${a*10} N，方向竖直向上。`};
case'pressure':return {value:200/(a*1e-4),bar:10/a,text:`S＝${a} cm²＝${(a*1e-4).toFixed(4)} m²；p＝200/S＝${Math.round(200/(a*1e-4))} Pa。面积变小，压强变大。`};
case'lever':return {value:8/a,bar:(8/a)/80,text:`F＝40×0.2÷${a.toFixed(1)}＝${(8/a).toFixed(1)} N。动力臂越长，同样阻力所需动力越小。`};
case'heat':return {value:42000*a,bar:a/5,text:`Q＝4200×${a}×10＝${42000*a} J。温升相同，水越多，需要热量越多。`};
case'circuit':{const i1=6/a,i2=.3,total=mode==='parallel'?i1+i2:6/(a+20);return {value:total,bar:total/1.5,text:mode==='parallel'?`并联：各支路均6 V。I₁＝${i1.toFixed(2)} A，I₂＝0.30 A；干路I＝${total.toFixed(2)} A。`:`串联：R总＝${a+20} Ω；共同I＝${total.toFixed(2)} A；U₁＝${(total*a).toFixed(2)} V，U₂＝${(total*20).toFixed(2)} V。`}}
case'power':return {value:a/1000*b,bar:a/2000*b/8,text:`W＝${(a/1000).toFixed(1)} kW×${b} h＝${(a/1000*b).toFixed(1)} kWh，也就是${(a/1000*b).toFixed(1)}度。`};
case'magnet':return {value:on?1:0,bar:on?1:0,text:mode==='motor'?(on?'输入电能 → 通电导体受磁场力 → 输出机械能。':'电源未开启，模型中电动机不转。'):mode==='generator'?(on?'输入机械运动 → 切割磁感线，闭合电路产生感应电流 → 输出电能。':'停止机械输入，模型不产生感应电流。'):(on?'输入电流 → 线圈周围产生磁场，可吸引铁料。':'停止电流 → 电磁铁磁性大幅减弱。')};
}}
function visual(kind,a,b,mode){if(kind==='wave'){let path='';for(let x=0;x<=340;x+=2){const y=70-Math.sin(x/340*Math.PI*2*a/100)*b*9;path+=(x?'L':'M')+(x+10)+' '+y}return `<svg viewBox="0 0 360 140" role="img" aria-label="频率与振幅波形示意"><path d="M10 70H350" stroke="#b4c3af"/><path d="${path}" fill="none" stroke="#286b54" stroke-width="3"/></svg>`}if(kind==='ray'){const r=a*Math.PI/180,x=Math.sin(r)*110,y=Math.cos(r)*110;return `<svg viewBox="0 0 360 170" role="img" aria-label="光的反射角度示意"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#b86631"/></marker></defs><path d="M20 140H340" stroke="#345e50" stroke-width="3"/><path d="M180 12V150" stroke="#7c9988" stroke-dasharray="5 5"/><path d="M${180-x} ${140-y}L180 140M180 140L${180+x} ${140-y}" fill="none" stroke="#b86631" stroke-width="3" marker-end="url(#arrow)"/><text x="191" y="25" font-size="12">法线</text><text x="30" y="162" font-size="12">两角从法线量起</text></svg>`}if(kind==='circuit'){return `<div class="formula" style="font-size:18px">${mode==='parallel'?'电源6 V → 分支 R₁ / R₂ → 汇合':'电源6 V → R₁ → R₂ → 回电源'}</div>`}return ''}

function scene(kind,a,b,mode,on){let shapes='',caption='示意图，只表示本模型的关系';const txt=(x,y,t)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="13" fill="#355b47">${e(t)}</text>`;
if(kind==='density'){const side=25+Math.cbrt(a)*22;shapes=`<rect x="${180-side/2}" y="${130-side}" width="${side}" height="${side}" rx="8" fill="#86a98d"/>${txt(180,155,'体积改变，材料密度不变')}`}
if(kind==='motion'){shapes=`<path d="M30 100H330" stroke="#9aaf8d" stroke-width="5" stroke-dasharray="9 6"/><path d="M50 65L82 85L50 105L59 85Z" fill="#be873f"/><rect x="290" y="50" width="28" height="40" rx="5" fill="#4f7858"/>${txt(180,52,'120 m')} ${txt(180,137,'用时 '+a+' s → 平均速度 '+(120/a).toFixed(1)+' m/s')}`}
if(kind==='force'){const len=30+a*4;shapes=`<rect x="145" y="68" width="70" height="50" rx="5" fill="#97af82"/><path d="M70 122H290" stroke="#779066" stroke-width="4"/><path d="M180 94V${94-len}m-8 8l8-8l8 8M180 94V${94+len}m-8-8l8 8l8-8" fill="none" stroke="#416650" stroke-width="3"/>${txt(73,60,'支持力 '+a*10+' N')}${txt(282,150,'重力 '+a*10+' N')}`}
if(kind==='pressure'){const w=35+a*1.5;shapes=`<rect x="${180-w/2}" y="62" width="${w}" height="42" rx="5" fill="#83a285"/><path d="M180 20V52m-7-7l7 7l7-7" fill="none" stroke="#bb8240" stroke-width="3"/><path d="M40 110H320" stroke="#769565" stroke-width="4"/>${txt(250,35,'固定压力200 N')}${txt(180,145,'接触面积 '+a+' cm²')}`}
if(kind==='lever'){const arm=a*150;shapes=`<path d="M${180-arm} 80H230" stroke="#577e59" stroke-width="7"/><path d="M180 84L164 120H196Z" fill="#bea078"/><path d="M${180-arm} 30V72m-7-7l7 7l7-7M230 30V72m-7-7l7 7l7-7" fill="none" stroke="#b87534" stroke-width="3"/>${txt(180-arm,22,'动力')}${txt(230,22,'40 N')}${txt(120,145,'动力臂 '+a.toFixed(1)+' m')}${txt(265,145,'阻力臂0.2 m')}`}
if(kind==='heat'){const w=35+a*20;shapes=`<path d="M${180-w/2} 40V125H${180+w/2}V40" stroke="#5d8975" stroke-width="3" fill="none"/><rect x="${182-w/2}" y="70" width="${w-4}" height="53" fill="#aad4d1"/>${txt(180,30,'水 '+a+' kg')}${txt(180,150,'升温10℃需要 '+42000*a+' J')}`}
if(kind==='power'){shapes=`<circle cx="180" cy="65" r="30" fill="#f2dca5" stroke="#bb995f" stroke-width="2"/><path d="M163 91H197V115H163Z" fill="#6b8e74"/>${txt(180,145,a+' W × '+b+' h → '+(a/1000*b).toFixed(1)+'度')}`}
if(kind==='phase'){const state=a<30?'冰':a<=65?'冰与水':'水';shapes=`<path d="M110 30V125H250V30" stroke="#6d9478" fill="none" stroke-width="3"/>${a>=30?'<rect x="112" y="78" width="136" height="45" fill="#acd6d5"/>':''}${a<=65?'<rect x="150" y="65" width="52" height="48" rx="6" fill="#dbebeb" stroke="#8eb4b4"/>':''}${txt(180,150,state+' · 示意加热进度'+a+'%')}`}
if(kind==='magnet'){shapes=`<rect x="120" y="40" width="120" height="48" rx="10" fill="${on?'#be965a':'#a5b19b'}"/><path d="M136 32V97M156 32V97M176 32V97M196 32V97M216 32V97" stroke="#627d5c" stroke-width="4"/>${txt(180,130,(mode==='motor'?'电动机':mode==='generator'?'发电机':'电磁铁')+' / '+(on?'输入开启':'输入关闭'))}`}
return shapes?`<svg viewBox="0 0 360 175" role="img" aria-label="${caption}">${shapes}</svg>`:''}

function dynamicLab(u){if(![2,3,4].includes(u.id))return '';const notes={2:'圆点表示一个振动点，不是声波在空气中传播的完整图。频率放慢100倍显示；振幅像素仅作比较。',3:'亮点只是标记光经过的路径，不代表真实光速，也不是光的粒子模型。',4:'小火苗表示持续加热，温度计显示示意温度。暂停只是冻结画面，不模拟熄火后冷却。试着停在熔化阶段，看看温度是否变化。'};return `<div class="dynamic-lab"><div id="dynamicDrawing"></div><div class="row"><button id="dynamicPlay">播放演示</button><button class="quiet" id="dynamicReset">重置演示</button></div><p class="note">${notes[u.id]}</p></div>`}
function dynamicDrawing(id,a,b,t,burning=false){let d='';if(id===2){const y=70-Math.sin(t*Math.PI*2*a/100)*b*8;d=`<path d="M25 70H325" stroke="#b9c8bd" stroke-dasharray="4 4"/><path d="M175 22V118" stroke="#d1dbd4"/><circle cx="175" cy="${y}" r="8" fill="#6a8b75"/><text x="175" y="146" text-anchor="middle" font-size="13" fill="#486151">一个点在平衡位置两侧来回振动</text>`}else if(id===3){const angle=a*Math.PI/180,dx=Math.sin(angle)*105,dy=Math.cos(angle)*105,p=(t/2)%1;const x=p<.5?175-dx+dx*p*2:175+dx*(p-.5)*2,y=p<.5?130-dy+dy*p*2:130-dy*(p-.5)*2;d=`<path d="M25 130H325" stroke="#698774" stroke-width="3"/><path d="M175 15V145" stroke="#9bad9e" stroke-dasharray="4 4"/><path d="M${175-dx} ${130-dy}L175 130L${175+dx} ${130-dy}" stroke="#b9955e" fill="none" stroke-width="2"/><circle cx="${x}" cy="${y}" r="5" fill="#c39a52"/><text x="175" y="163" text-anchor="middle" font-size="12" fill="#486151">朝向镜面 → 离开镜面；角度从法线量起</text>`}else{const temp=a<30?-10+a/3:a<=65?0:(a-65)*2;const level=124-(temp+10)/80*100;const fraction=a<30?1:a<=65?1-(a-30)/35:0;d=`<path d="M85 25V125H265V25" fill="none" stroke="#698774" stroke-width="2"/><rect x="87" y="${125-58*(1-fraction)}" width="176" height="${58*(1-fraction)}" fill="#c0dcda"/><rect x="${175-50*fraction}" y="${95-28*fraction}" width="${100*fraction}" height="${56*fraction}" rx="3" fill="#e6f1f3" stroke="${fraction>0?'#98b4b5':'none'}"/>${burning?'<path d="M175 145C162 160 156 169 165 178C168 181 181 181 186 177C195 167 184 160 182 150C179 159 176 160 175 145Z" fill="#dca357"/><path d="M175 159Q163 177 175 178Q188 177 175 159Z" fill="#f2d591"/>':''}<rect x="150" y="187" width="50" height="10" rx="4" fill="#829988"/><text x="175" y="213" text-anchor="middle" font-size="11" fill="#486151">${burning?'正在加热':'演示已暂停'}</text><rect x="295" y="18" width="14" height="111" rx="7" fill="#f2f6f3" stroke="#819b88"/><rect x="300" y="${level}" width="4" height="${130-level}" fill="#bd8162"/><circle cx="302" cy="134" r="9" fill="#bd8162"/><text x="318" y="${Math.max(22,level)}" font-size="11" fill="#486151">${temp.toFixed(0)}℃</text><text x="302" y="160" text-anchor="middle" font-size="11" fill="#486151">温度</text><text x="175" y="235" text-anchor="middle" font-size="13" fill="#486151">${a<30?'冰正在升温':a<=65?'冰逐渐熔化：温度0℃':'冰已熔化：水继续升温'}</text>`}return `<svg viewBox="0 0 350 ${id===4?250:180}" role="img" aria-label="${id===2?'振动点的动态示意':id===3?'光反射的路径示意':'冰熔化的阶段示意'}">${d}</svg>`}
function setupDynamicLab(u){if(![2,3,4].includes(u.id))return;const drawing=document.getElementById('dynamicDrawing'),play=document.getElementById('dynamicPlay'),reset=document.getElementById('dynamicReset'),input=document.getElementById('a');let running=false,t=0,last=null,frame=null,internal=false,progress=Number(input.value);function draw(){drawing.innerHTML=dynamicDrawing(u.id,Number(input.value),Number(document.getElementById('b')?.value||0),t,running);play.textContent=running?'暂停演示':'播放演示'}function tick(now){if(!drawing.isConnected||!running)return;const dt=last===null?0:Math.min(.1,(now-last)/1000);last=now;t+=dt;if(u.id===4){progress=Math.min(100,progress+dt*8);input.value=String(Math.round(progress));internal=true;input.dispatchEvent(new Event('input'));internal=false;if(progress>=100)running=false}draw();if(running)frame=requestAnimationFrame(tick)}play.onclick=()=>{if(u.id===4&&Number(input.value)>=100){progress=0;input.value='0';input.dispatchEvent(new Event('input'))}running=!running;last=null;progress=Number(input.value);if(running)frame=requestAnimationFrame(tick);else cancelAnimationFrame(frame);draw()};reset.onclick=()=>{running=false;cancelAnimationFrame(frame);t=0;last=null;if(u.id===4){input.value='0';progress=0;input.dispatchEvent(new Event('input'))}draw()};input.addEventListener('input',()=>{if(!internal)progress=Number(input.value);draw()});document.getElementById('b')?.addEventListener('input',draw);draw()}

function motionLesson(){return `<div class="card"><div class="label">速度 / 把快慢看出来</div><h2>同样120米，谁先到？</h2><p class="small">两人同时出发，都做匀速直线运动。甲每秒走3 m，乙每秒走2 m。先猜谁到得早，再播放。</p><div class="motion-track" id="motionTrack"></div><div class="row"><button id="motionPlay">开始</button><button class="quiet" id="motionReset">重新来</button></div><p id="motionReadout" aria-live="off"></p><div class="worked-example" id="motionFormula"></div><p class="note">为便于观察，播放时间缩短到原来的1/6；显示的时间、路程和速度均为题设值。图上圆点是运动示意。</p></div>`}
function motionDrawing(t){const x1=45+Math.min(120,t*3)*2.1,x2=45+Math.min(120,t*2)*2.1;return `<svg viewBox="0 0 350 160" role="img" aria-label="经过${t.toFixed(1)}秒，甲走${Math.min(120,t*3).toFixed(1)}米，乙走${Math.min(120,t*2).toFixed(1)}米"><path d="M45 55H297M45 115H297" stroke="#c1cec4" stroke-width="3"/><path d="M297 28V135" stroke="#839b89" stroke-dasharray="4 4"/><text x="297" y="20" text-anchor="middle" font-size="12" fill="#486151">120 m终点</text><text x="18" y="59" font-size="13" fill="#486151">甲</text><text x="18" y="119" font-size="13" fill="#486151">乙</text><circle cx="${x1}" cy="55" r="10" fill="#648773"/><circle cx="${x2}" cy="115" r="10" fill="#ba9c64"/><text x="175" y="83" text-anchor="middle" font-size="12" fill="#486151">3 m/s${t>=40?' · 已到终点':''}</text><text x="175" y="145" text-anchor="middle" font-size="12" fill="#486151">2 m/s${t>=60?' · 已到终点':''}</text></svg>`}
function setupMotionLesson(){const track=document.getElementById('motionTrack'),play=document.getElementById('motionPlay'),reset=document.getElementById('motionReset'),readout=document.getElementById('motionReadout');let t=0,running=false,last=null,frame=null;function draw(){track.innerHTML=motionDrawing(t);readout.textContent='题设时间 '+t.toFixed(1)+' s：甲走'+Math.min(120,3*t).toFixed(1)+' m，乙走'+Math.min(120,2*t).toFixed(1)+' m。'+(t>=60?'甲40 s到达，乙60 s到达。':'');const shown=Math.round(t*10)/10,ta=Math.min(40,shown),tb=Math.min(60,shown);document.getElementById('motionFormula').innerHTML=shown===0?'先播放，路程与时间会一起增加。'+formulaButton('speed'):'甲：'+formulaButton('speed')+'＝'+(ta*3).toFixed(1)+' m ÷ '+ta.toFixed(1)+' s＝3 m/s'+(t>=40?'（已到终点，甲用时停在40 s）':'')+'<br>乙：v＝s/t＝'+(tb*2).toFixed(1)+' m ÷ '+tb.toFixed(1)+' s＝2 m/s。';play.textContent=running?'暂停':t>=60?'再播放一次':t>0?'继续':'开始'}function tick(now){if(!track.isConnected||!running)return;if(last!==null)t=Math.min(60,t+(now-last)/1000*6);last=now;if(t>=60)running=false;draw();if(running)frame=requestAnimationFrame(tick)}play.onclick=()=>{if(t>=60)t=0;running=!running;last=null;if(running)frame=requestAnimationFrame(tick);else cancelAnimationFrame(frame);draw()};reset.onclick=()=>{running=false;cancelAnimationFrame(frame);t=0;last=null;draw()};draw()}

function supplement(u){if(u.id===10)return `<div class="card"><div class="label">电路与电表 / 看通路，读示数</div><h2>开关改变了，灯和电表怎样变？</h2><p class="small">先合上总开关，再切换连接方式或支路开关。灯泡只表示亮灭，不比较真实亮度。</p><label for="lampMode" class="small">两灯怎样连接</label><select id="lampMode"><option value="series">串联</option><option value="parallel">并联</option></select><div id="lampDrawing"></div><div class="row"><button id="mainSwitch">总开关：断开</button><button id="switch1" class="quiet">S₁：闭合</button><button id="switch2" class="quiet">S₂：闭合</button></div><p id="lampExplain" aria-live="polite"></p><div class="metergrid"><div><div id="ammeter"></div><p class="small">A：串在干路，测总电流</p></div><div><div id="voltmeter"></div><p class="small">V：并在灯1两端，测灯1电压</p></div></div><p class="note">数值模型：理想6 V电源，灯1等效为固定10 Ω、灯2等效为固定20 Ω；理想电表和导线。真实灯丝电阻会随温度变化，不能照搬此模型。电压表不接在开关两端。</p><details><summary>为什么A串联，V并联？</summary><p>电流表要让被测电流流过它，所以串进电流路径；电压表比较元件两端，所以分别连接这两端。电流表不能直接接电源两极。</p><p>图中的V支路是理想高电阻测量支路，忽略其电流，不等同于用导线短接灯泡。</p></details><details><summary>怎样读指针表？</summary><p>先看接入量程和单位，再看每小格代表多少。这里A的量程0—1 A，每标记间隔0.2 A；V量程0—6 V，每标记间隔1 V。实际仪器还要看细分小格。正接、反接和量程选择都按器材说明。</p></details></div>`;
if(u.id===1)return `${motionLesson()}<div class="card"><div class="label">刻度尺 / 两端读数之差</div><h2>零刻度没对齐，还能测吗？</h2><p class="small">物体左端在1.2 cm处，拖动右端。尺的分度值为1 mm。</p><div id="rulerDrawing"></div><label for="rulerEnd">右端位置 <span id="rulerEndVal"></span> cm</label><input type="range" id="rulerEnd" min="1.3" max="7" step="0.1" value="5.6"><p id="rulerExplain" aria-live="polite"></p><p class="note">用两端差值，不把右端读数直接当长度。这里拖动步长1 mm；实际测量可按器材要求估读。</p></div>`;
if(u.id===3)return `<div class="card"><div class="label">凸透镜 / 物距与成像</div><h2>物体靠近透镜，像怎样变化？</h2><p class="small">焦距固定10 cm，拖动物体。图按薄透镜近似画，虚像用虚线标出。</p><div id="lensDrawing"></div><label for="lensU">物距 <span id="lensUVal"></span> cm</label><input type="range" id="lensU" min="5" max="40" step="1" value="30"><p id="lensExplain" aria-live="polite"></p><p class="note">F是焦点，2F是两倍焦距。箭头代表物体和像；细线是平行主轴与过光心的两条典型光线。虚线是反向延长线。本图为薄透镜近似。</p></div>`;
if(u.id===5)return `<div class="card"><div class="label">排水法 / 看水位增加量</div><h2>物体的体积藏在哪两个读数里？</h2><p class="small">石块质量52 g，原水30 mL。拖动到完全浸没，再求整个石块体积。</p><div id="displacementDrawing"></div><label for="immersion">浸入程度</label><input type="range" id="immersion" min="0" max="100" value="0"><p id="displacementExplain" aria-live="polite"></p><p class="note">理想化演示：不溶、不吸水，忽略气泡洒水。浸入程度表示排开总体积的比例，不等于真实形状的浸入高度比例。</p></div>`;return ''}
function electricalState(mode,main,s1,s2){const i1=main&&(mode==='series'?s1&&s2:s1)?(mode==='series'?6/30:6/10):0;const i2=main&&(mode==='series'?s1&&s2:s2)?(mode==='series'?6/30:6/20):0;return {i1,i2,total:mode==='series'?i1:i1+i2,v1:i1*10,v2:i2*20,on1:i1>0,on2:i2>0}}
function lampCircuit(mode,main,s1,s2,state){const line=(d)=>`<path d="${d}" stroke="#688576" stroke-width="2.5" fill="none"/>`;const sw=(x,y,on,label)=>`${line(`M${x} ${y}L${x+27} ${on?y:y-16}`)}<circle cx="${x}" cy="${y}" r="2.7" fill="#688576"/><circle cx="${x+30}" cy="${y}" r="2.7" fill="#688576"/><text x="${x+15}" y="${y+22}" text-anchor="middle" font-size="11" fill="#62766b">${label}</text>`;const lamp=(x,y,on,label)=>`<circle cx="${x}" cy="${y}" r="17" fill="${on?'#ffe7a0':'#eef2ef'}" stroke="#789083" stroke-width="2"/>${line(`M${x-10} ${y-10}L${x+10} ${y+10}M${x+10} ${y-10}L${x-10} ${y+10}`)}<text x="${x}" y="${y+33}" text-anchor="middle" font-size="11" fill="#62766b">${label} ${on?'亮':'灭'}</text>`;let d='';
if(mode==='series'){d=line('M30 60H65M95 60H133M167 60H190M220 60H248M282 60H320V190H282M258 190H190M165 190H100M70 190H30V60')+sw(65,60,s1,'S₁')+sw(190,60,s2,'S₂')+lamp(150,60,state.on1,'灯1')+lamp(265,60,state.on2,'灯2')+line('M133 60V20H140M160 20H167V60')+'<circle cx="150" cy="20" r="10" fill="white" stroke="#819788"/><text x="150" y="24" text-anchor="middle" font-size="11">V</text>'}
else{d=line('M30 60H65M95 60H192M228 60H320V190H282M258 190H190M165 190H100M70 190H30V60M30 120H65M95 120H192M228 120H320')+sw(65,60,s1,'S₁')+sw(65,120,s2,'S₂')+lamp(210,60,state.on1,'灯1')+lamp(210,120,state.on2,'灯2')+line('M192 60V20H200M220 20H228V60')+'<circle cx="210" cy="20" r="10" fill="white" stroke="#819788"/><text x="210" y="24" text-anchor="middle" font-size="11">V</text><circle cx="30" cy="120" r="3" fill="#688576"/><circle cx="320" cy="120" r="3" fill="#688576"/>'}
d+=sw(70,190,main,'总开关')+line('M165 174V206M190 181V199')+'<text x="160" y="219" font-size="11">＋ 6 V −</text><circle cx="270" cy="190" r="12" fill="white" stroke="#819788"/><text x="270" y="194" text-anchor="middle" font-size="11">A</text>';

function meter(value,max,unit){const x=85,y=93,r=55,a=(150-120*value/max)*Math.PI/180;let ticks='';const steps=unit==='A'?5:6;for(let i=0;i<=steps;i++){const angle=(150-120*i/steps)*Math.PI/180;const px=x+Math.cos(angle)*r,py=y-Math.sin(angle)*r;const v=max*i/steps;ticks+=`<path d="M${px} ${py}L${x+Math.cos(angle)*(r-7)} ${y-Math.sin(angle)*(r-7)}" stroke="#819a8b"/><text x="${x+Math.cos(angle)*(r+14)}" y="${y-Math.sin(angle)*(r+14)+4}" text-anchor="middle" font-size="10" fill="#577164">${unit==='A'?v.toFixed(1):v}</text>`}return `<svg viewBox="0 0 170 155" role="img" aria-label="电表读数${value.toFixed(2)}${unit}"><rect x="5" y="5" width="160" height="145" rx="8" fill="#f5f8f6" stroke="#dce5de"/>${ticks}<path d="M85 93L${x+Math.cos(a)*45} ${y-Math.sin(a)*45}" stroke="#597966" stroke-width="2.5"/><circle cx="85" cy="93" r="3" fill="#597966"/><text x="85" y="119" text-anchor="middle" font-size="14" fill="#375947">${value.toFixed(2)} ${unit}</text><text x="85" y="139" text-anchor="middle" font-size="10" fill="#6a7d70">量程 0—${max} ${unit}</text></svg>`}
function setupSupplement(u){if(u.id===10){let main=false,s1=true,s2=true;function update(){const mode=document.getElementById('lampMode').value,state=electricalState(mode,main,s1,s2);document.getElementById('lampDrawing').innerHTML=lampCircuit(mode,main,s1,s2,state);document.getElementById('ammeter').innerHTML=meter(state.total,1,'A');document.getElementById('voltmeter').innerHTML=meter(state.v1,6,'V');document.getElementById('mainSwitch').textContent='总开关：'+(main?'闭合':'断开');document.getElementById('switch1').textContent='S₁：'+(s1?'闭合':'断开');document.getElementById('switch2').textContent='S₂：'+(s2?'闭合':'断开');document.getElementById('lampExplain').textContent=!main?'总开关断开，没有完整供电通路，两灯都灭。':mode==='series'?(s1&&s2?'串联通路完整，两灯都亮；各处电流相同。':'串联只有一条路径，断开任一开关，两灯都灭。'):'并联有独立支路：灯1'+(s1?'亮':'灭')+'，灯2'+(s2?'亮':'灭')+'。干路电流是支路电流之和。'}document.getElementById('lampMode').onchange=update;document.getElementById('mainSwitch').onclick=()=>{main=!main;update()};document.getElementById('switch1').onclick=()=>{s1=!s1;update()};document.getElementById('switch2').onclick=()=>{s2=!s2;update()};update()}

if(u.id===3){function update(){const u=Number(document.getElementById('lensU').value),v=u===10?null:1/(.1-1/u);const xo=175-u*3,h=24;let s='<path d="M15 100H335" stroke="#a6b5aa"/><path d="M175 20V175m-6-145l6-10l6 10m-12 135l6 10l6-10" stroke="#749882" fill="none" stroke-width="2"/>';s+=`<path d="M${xo} 76H175L330 200M${xo} 76L175 100L330 ${100+24/(175-xo)*155}" fill="none" stroke="#bc9a68" stroke-width="1.4"/>`;if(v!==null&&v<0){const xi=175+v*3,yi=100+24*v/u;s+=`<path d="M175 76L${xi} ${yi}M175 100L${xi} ${yi}" fill="none" stroke="#a4b6a6" stroke-dasharray="4 4"/>`;}
for(const x of [115,145,205,235])s+=`<path d="M${x} 97V103" stroke="#749882"/><text x="${x}" y="118" text-anchor="middle" font-size="11">${x===115||x===235?'2F':'F'}</text>`;s+=`<path d="M${xo} 100V${100-h}m-5 7l5-7l5 7" fill="none" stroke="#608772" stroke-width="3"/><text x="${xo}" y="${100-h-10}" text-anchor="middle" font-size="12">物体</text>`;let label;if(v===null)label='物体在焦点：有限距离不成清晰像';else{const xi=175+v*3,yi=100+h*v/u;if(xi>=10&&xi<=340&&yi>=15&&yi<=175){s+=`<path d="M${xi} 100V${yi}m-5 ${v>0?-7:7}l5 ${v>0?7:-7}l5 ${v>0?-7:7}" stroke="#af8c58" stroke-width="3" ${v<0?'stroke-dasharray="4 3"':''}/><text x="${xi}" y="${yi+(v>0?16:-8)}" text-anchor="middle" font-size="12">${v<0?'虚像':'实像'}</text>`}else s+=`<text x="175" y="160" text-anchor="middle" font-size="11">像在图的范围之外</text>`;label=(u<10?'正立放大虚像':u===20?'倒立等大实像':u>20?'倒立缩小实像':'倒立放大实像')+'；像距大小约'+Math.abs(v).toFixed(1)+' cm'}document.getElementById('lensDrawing').innerHTML=`<svg viewBox="0 0 350 190" role="img" aria-label="凸透镜成像示意，物距${u}厘米">${s}</svg>`;document.getElementById('lensUVal').textContent=u;document.getElementById('lensExplain').textContent=label+'。'}document.getElementById('lensU').oninput=update;update()}
if(u.id===5){function update(){const t=Number(document.getElementById('immersion').value)/100,ml=30+20*t,y=160-ml*2;document.getElementById('displacementDrawing').innerHTML=`<svg viewBox="0 0 350 195" role="img" aria-label="水面读数${ml.toFixed(1)}毫升"><path d="M125 35V160H225V35" fill="none" stroke="#759883" stroke-width="3"/><rect x="127" y="${y}" width="96" height="${ml*2-2}" fill="#b9d9d8"/><rect x="150" y="${y-30+30*t}" width="45" height="30" fill="#a5b6a8"/><text x="175" y="185" text-anchor="middle" font-size="13">${ml.toFixed(1)} mL</text></svg>`;document.getElementById('displacementExplain').textContent=t===1?'完全浸没：V＝50−30＝20 cm³；ρ＝52/20＝2.6 g/cm³。':'当前排开体积'+(20*t).toFixed(1)+' cm³，尚未完全浸没，不能把它当整个石块体积。'}document.getElementById('immersion').oninput=update;update()}}

const openers={
1:{title:'测长度，就是看物体两端相隔多远',concept:'长度描述两点之间的距离。尺上的数字是位置；两端读数的差，才是物体长度。',example:'橡皮左端对着1 cm，右端对着4 cm。它占了3个“1 cm”，所以长3 cm。',question:'把橡皮向右挪1 cm，它会变长吗？',options:['会，右端数字更大了','不会，两端一起移动'],correct:1,answer:'左端变成2 cm，右端变成5 cm，5−2仍是3 cm。位置变了，长度没有变。',states:['左端1 cm → 右端4 cm','左端2 cm → 右端5 cm'],labels:['原来的位置','往右挪1 cm']},
2:{title:'声音，从振动开始',concept:'物体来回运动，叫振动。发声的物体正在振动，声音还需要通过空气等介质传到耳朵。',example:'拨一下绷紧的橡皮筋，它来回抖动，同时发出声音。',question:'用手按住橡皮筋，让它不再振动，会怎样？',options:['继续一直发声','这次发声停止'],correct:1,answer:'橡皮筋的振动停止，这次发声随之停止。已经传出去的声音仍会继续传播。',states:['拨动：橡皮筋来回振动','按住：振动停止'],labels:['拨一下','按住它']},
3:{title:'先分清光从哪里来',concept:'自身能够发光的物体叫光源。能被看见的物体，不一定自己发光。',example:'开着的台灯发光，是光源。书本把照到它的光反射进眼睛，才让你看见它。',question:'月亮看起来很亮，它是光源吗？',options:['是，亮的都是光源','不是，它反射太阳光'],correct:1,answer:'月亮反射太阳光，本身不发出可见光。判断光源要看是否自身发光。',states:['台灯 → 光照到书本 → 眼睛','太阳 → 光照到月亮 → 眼睛'],labels:['看台灯与书本','看太阳与月亮']},
4:{title:'温度，描述物体有多冷或多热',concept:'温度表示物体的冷热程度，常用摄氏度（℃）表示。温度计帮助我们比较，手的感觉可能不可靠。',example:'一小杯水和一大壶水都显示40℃，它们温度相同；水多，并不表示温度更高。',question:'一大壶40℃水，温度比一小杯40℃水高吗？',options:['高，因为水更多','不高，两者都是40℃'],correct:1,answer:'温度都为40℃。水的多少与温度是不同的条件，后面计算热量时才一起考虑。',states:['小杯：40℃','大壶：40℃'],labels:['看一小杯','看一大壶']},
5:{title:'质量，就是物体含有多少物质',concept:'质量表示物体所含物质的多少，用m表示，常用单位是g和kg。1 kg＝1000 g。',example:'一块20 g橡皮，从桌上放进书包，或者捏成另一种形状，只要没有增减物质，质量仍是20 g。',question:'把它切成两块，两块都留下，总质量会怎样？',options:['仍是20 g','变成40 g','只剩10 g'],correct:0,answer:'两块加起来仍是20 g。若恰好均分，每块是10 g；不要把“一块的质量”和“两块的总质量”混在一起。',states:['完整橡皮：20 g','捏变形：仍为20 g','均分并都留下：10 g＋10 g'],labels:['完整橡皮','捏变形','切成两块']},
6:{title:'推门时，你就在对门施加力',concept:'力是物体对物体的作用。说一个力，要找出谁施力、谁受力；力可以改变运动状态，也可以使物体变形。',example:'你用手推门：手施力，门受力。挤压海绵：海绵变形，也说明它受到力。',question:'手推门时，只有门受到力，手不受力吗？',options:['是，只有门受力','不是，门也对手施力'],correct:1,answer:'物体间力的作用是相互的。手推门，门也推手；这两个力分别作用在门和手上。',states:['手推门：门可能转动','手挤海绵：海绵变形'],labels:['推一下门','挤一下海绵']},
7:{title:'压力，是垂直压向接触面的力',concept:'物体垂直压在接触面上的力叫压力。它是一个力；压强则用来描述压力的作用效果。',example:'用同样的力按海绵，笔尖压下的凹陷通常更明显，笔杆平端的接触面积更大。',question:'力一样大，接触面积更小，压力作用效果通常怎样？',options:['更明显','一定更弱'],correct:0,answer:'同样的压力集中在更小的面积上，压强更大。这里比较的是同样海绵、相同压力。',states:['同压力：笔尖接触面积小','同压力：平端接触面积大'],labels:['用笔尖按','用平端按']},
8:{title:'物理里的“做功”，要看力和移动',concept:'有力作用，物体还要在这个力的方向上移动距离，这个力才对物体做功。',example:'向上托着书静止不动，很累，但托力没有对书做功；把书举高，托力就对书做了功。',question:'托着书一直站着，托力对书做功了吗？',options:['做了，因为手很累','没有，书没有移动'],correct:1,answer:'书没有移动，托力对书不做功。人体感到累与判断“这个力对这个物体是否做功”是两件事。',states:['托着不动：书没有位移','向上举高：书向托力方向移动'],labels:['托着不动','举高书本']},
9:{title:'“温度高”和“吸了多少热量”先分开',concept:'物体因温度不同而传递能量，叫热传递。热量是这个过程中传递的能量，用J表示。',example:'热水和冷勺接触，能量通常从温度高的热水传到温度低的勺子，勺子逐渐变热。',question:'能说“这杯水里面有很多热量”吗？',options:['能，热量就装在水里','不准确，热量描述传递过程'],correct:1,answer:'可以说水具有内能；发生热传递时，可以说水放出多少热量。热量不是物体“装着”的一个量。',states:['刚放入：水温高，勺温低','过一会儿：勺子温度上升'],labels:['刚放入勺子','观察过一会儿']},
10:{title:'手电筒为什么能亮？先找完整的路',concept:'电路把电源、用电器、开关和导线连接起来。简单电路中，电源正常、开关闭合、通路完整，灯才能亮。',example:'电池提供电能，灯把电能转成光和热；开关控制通路是否接通。',question:'电池在里面，但开关断开，灯会亮吗？',options:['会，有电池就行','不会，通路不完整'],correct:1,answer:'开关断开，电路没有完整通路，灯灭。闭合开关还要检查电池和其他连接是否正常。'},
11:{title:'功率，描述用电有多快',concept:'电功率表示用电器每秒消耗多少电能，单位W。100 W表示每秒消耗100 J电能。',example:'100 W灯与1000 W电器都使用1秒，后者消耗的电能是前者10倍；使用多久也会影响总耗电。',question:'只看瓦数，能判断一整天谁耗电更多吗？',options:['能，瓦数大就总耗电多','不能，还要看使用时间'],correct:1,answer:'总耗电量还要看时间：电能＝功率×时间。功率是快慢，电能是总量。',states:['100 W：1秒消耗100 J','1000 W：1秒消耗1000 J'],labels:['看100 W电器','看1000 W电器']},
12:{title:'磁铁周围，有看不见的磁场',concept:'磁体周围存在磁场，能对放在其中的小磁针等产生作用。磁场看不见，可以通过它的作用认识它。',example:'把小磁针放在条形磁铁旁边，它会改变方向；磁针的指向帮助我们判断当地磁场方向。',question:'图上的磁感线，是空间里真实画着的线吗？',options:['是，磁场就是很多细线','不是，是描述磁场的画法'],correct:1,answer:'磁感线是帮助描述磁场方向和分布的画法，不是真实存在的细线。小磁针受到的作用可以观察到。',states:['观察磁针：用指向判断磁场方向','画磁感线：用图表示磁场'],labels:['看小磁针','看示意线']}
};
function openingLesson(u){const t=openers[u.id];return `<div class="card"><div class="label">先懂一个概念</div><h2>${e(t.title)}</h2><p class="key">${rich(t.concept)}</p><p>${rich(t.example)}</p>${u.id===10?`<div id="torchDrawing"></div><div class="row"><button id="torchSwitch">闭合开关</button><button class="quiet" id="torchBattery">取出电池</button></div><p id="torchExplain" aria-live="polite"></p>`:`<div class="opening-visual" id="openingVisual"></div><div class="figure-tabs">${t.labels.map((s,i)=>`<button class="quiet" data-opening="${i}" aria-pressed="${i===0}">${e(s)}</button>`).join('')}</div><p id="openingExplain" class="small" aria-live="polite">${e(t.states[0])}</p>`}<h3>先判断一下</h3><p>${e(t.question)}</p><div class="choices">${t.options.map((s,i)=>`<button data-opening-answer="${i}">${e(s)}</button>`).join('')}</div><div id="openingAnswer" class="feedback" aria-live="polite"></div></div>`}

function setupOpening(u){const t=openers[u.id];app.querySelectorAll('[data-opening-answer]').forEach(b=>b.onclick=()=>{const ok=Number(b.dataset.openingAnswer)===t.correct;document.getElementById('openingAnswer').innerHTML='<b>'+(ok?'对，抓住了关键。':'这个地方容易混，看看下面的例子。')+'</b><p>'+e(t.answer)+'</p>';document.getElementById('openingAnswer').classList.add('show')});if(u.id!==10){document.getElementById('openingVisual').innerHTML=openingDrawing(u.id,0);app.querySelectorAll('[data-opening]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.opening);document.getElementById('openingVisual').innerHTML=openingDrawing(u.id,i);document.getElementById('openingExplain').textContent=t.states[i];app.querySelectorAll('[data-opening]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))})}else{let battery=true,closed=false;const update=()=>{const on=battery&&closed;document.getElementById('torchDrawing').innerHTML=`<svg viewBox="0 0 350 190" role="img" aria-label="手电筒${on?'亮':'灭'}，电池${battery?'已装入':'已取出'}，开关${closed?'闭合':'断开'}">${on?'<path d="M265 45L345 15V150L265 125Z" fill="#fff0bf"/>':''}<path d="M245 45L265 35V135L245 125Z" fill="${on?'#ffe6a3':'#dce6df'}" stroke="#819a8b"/><rect x="45" y="45" width="200" height="80" rx="12" fill="#dce6df" stroke="#819a8b"/><rect x="120" y="32" width="35" height="13" rx="4" fill="${closed?'#688b75':'#b5bfb7'}"/>${battery?'<rect x="85" y="65" width="105" height="40" rx="4" fill="#f8faf8" stroke="#819a8b"/><text x="100" y="91" fill="#486151">＋</text><text x="165" y="91" fill="#486151">−</text>':'<text x="145" y="90" text-anchor="middle" font-size="13" fill="#486151">电池已取出</text>'}<text x="175" y="168" text-anchor="middle" font-size="14" fill="#486151">${on?'灯亮：电源正常，通路完整':'灯灭：'+(!battery?'缺少电源':'开关断开')}</text></svg>`;document.getElementById('torchSwitch').textContent=closed?'断开开关':'闭合开关';document.getElementById('torchBattery').textContent=battery?'取出电池':'装回电池';document.getElementById('torchExplain').textContent=on?'正常电池供能，开关闭合，通路完整，所以灯亮。':!battery?'电池取出，即使开关闭合也不能持续供电。':'有电池，但开关断开，通路不完整，灯灭。'};document.getElementById('torchSwitch').onclick=()=>{closed=!closed;update()};document.getElementById('torchBattery').onclick=()=>{battery=!battery;update()};update()}}

const glossary={
'质量':['物体含有多少物质，常用g、kg表示。','20 g橡皮捏变形，不增减物质，质量仍是20 g。'],
'体积':['物体占据空间的大小。','把不吸水的石块完全放入水中，水位增加量可用来求它的体积。'],
'密度':['同种物质，每单位体积对应多少质量。','铝的密度2.7 g/cm³，表示每1 cm³铝的质量为2.7 g。'],
'单位体积':['把体积统一成一份，例如1 cm³，方便比较。','27 g铝块体积10 cm³，每1 cm³的质量是27÷10＝2.7 g。'],
'参照物':['判断一个物体动没动时，选来比较位置的物体。','坐在行驶公交车上，相对座椅你静止，相对路边树木你运动。'],
'平均速度':['整个过程的总路程除以总时间。','走120 m，共用60 s，平均速度2 m/s；中途停留也要计入该过程时间。'],
'匀速直线运动':['沿直线运动，速度大小保持不变。','每秒都沿同一直线前进2 m，就是一个示例。'],
'频率':['每秒振动多少次，单位Hz。','500 Hz表示每秒振动500次，频率主要决定音调高低。'],
'振幅':['振动时偏离平衡位置的最大距离。','其他条件相近时，鼓面振幅越大，声音通常越响。'],
'音调':['声音的高低，主要与频率有关。','女高音的“高”指音调；不等于声音一定更响。'],
'响度':['听起来声音有多响，与振幅、距离等有关。','同一个声源，离它远一些，听到的响度通常变小。'],
'法线':['在光到达的位置，垂直于界面画的辅助线。','反射图中，要从法线量角，不是从镜面量角。'],
'入射角':['入射光线与法线的夹角。','光线与镜面夹30°，入射角为90°−30°＝60°。'],
'反射角':['反射光线与法线的夹角。','光反射时，反射角等于入射角。'],
'吸热':['在热传递过程中获得能量。','冰熔化时吸热；晶体熔化过程中温度可以保持不变。'],
'放热':['在热传递过程中向外传出能量。','热水逐渐冷却时，向周围放热。'],
'温差':['两个温度的差；升温题中常指末温减初温。','从20℃升到30℃，温升10℃，不是30℃。'],
'平衡':['物体所受合力为零，可静止，也可匀速直线运动。','箱子匀速沿直线移动时，水平拉力和摩擦力可以平衡。'],
'力臂':['支点到力的作用线的垂直距离。','不是任何情况下都等于支点到施力点的距离，要看力的方向。'],
'压强':['压力与受力面积的比，描述压力作用效果。','相同压力下，肩带越宽、接触面积越大，压强越小。'],
'浮力':['液体或气体对其中物体的向上托力。','石块即使沉底，在水中仍可能受到浮力；受浮力不等于会浮起。'],
'串联':['元件依次相连，电流只有一条通路。','串联两灯，断开其中一处，完整通路断掉，两灯都灭。'],
'并联':['元件分别接在不同支路的同两端。','一个正常支路断开，其他正常支路通常仍能工作。'],
'电流':['表示电荷定向移动的快慢，单位A。','电流表串入被测路径；电流不是灯泡用完就消失的东西。'],
'电压':['电路分析中，电源两端电压是推动电荷定向移动的条件之一，单位V。','灯两端有电压也不保证发光，还要有完整通路；用电压表并联测两端。'],
'电阻':['表示导体对电流的阻碍作用，单位Ω。','同电压下，电阻更大，电流更小；导体电阻还与材料、尺寸、温度等有关。'],
'控制变量':['研究一种因素时，让其他影响结果的条件保持相同。','研究压力对压强的影响时，保持受力面积相同。']
};
function setupTermHelp(){const dialog=document.createElement('dialog');dialog.id='termHelp';dialog.innerHTML='<div id="termHelpBody"></div><div class="row"><button id="termClose" class="quiet">继续读</button><button id="termJump" hidden>去看这个知识点 →</button></div>';document.body.append(dialog);document.getElementById('termClose').onclick=()=>dialog.close();dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});app.addEventListener('click',event=>{const target=event.target.closest('[data-term]');if(!target)return;const term=target.dataset.term,item=glossary[term];if(!item)return;document.getElementById('termHelpBody').innerHTML=`<div class="label">重点词解释</div><h2>${e(term)}</h2><p class="key">${e(item[0])}</p><p>${e(item[1])}</p>`;const u=activeUnit;let index=u?u.concepts.findIndex(c=>c[0].includes(term)):-1;if(u&&index<0)index=u.concepts.findIndex(c=>c[1].includes(term));const jump=document.getElementById('termJump');jump.hidden=index<0;jump.onclick=()=>{dialog.close();clue=index;renderUnit(u,'learn');window.scrollTo(0,0)};dialog.showModal()})}

const formulaBook={
speed:{name:'速度',formula:'v＝s/t',why:'把走过的路程，平均分到所用的时间里，得到每单位时间走多远。',symbols:[['v','速度','m/s 或 km/h'],['s','路程','m 或 km'],['t','时间','s 或 h']],forms:[['求速度','v＝s/t','120 m平均分到40 s：120÷40＝3 m/s。'],['求路程','s＝vt','从v＝s/t两边同乘t，得到vt＝s。3 m/s×40 s＝120 m。'],['求时间','t＝s/v','从s＝vt两边同除以v（v≠0），得到t＝s/v。120 m÷3 m/s＝40 s。']],condition:'平均速度：用同一个完整过程的总路程和总时间。匀速运动可以用相应任意一段的路程和时间；不能把不同过程的量拼起来。',units:'m与s配成m/s；km与h配成km/h。1 m/s＝3.6 km/h。m/s读米每秒：m是米，s是秒。公式里的s代表路程，单位里的s代表秒，要根据位置区分。'},
density:{name:'密度',formula:'ρ＝m/V',why:'ρ读作“柔”。把质量平均分到体积里，比较每一份体积有多少质量。',symbols:[['ρ','密度','kg/m³ 或 g/cm³'],['m','质量','kg 或 g'],['V','体积','m³ 或 cm³']],forms:[['求密度','ρ＝m/V','27 g÷10 cm³＝2.7 g/cm³。'],['求质量','m＝ρV','两边同乘V：ρV＝m。2.7 g/cm³×10 cm³＝27 g。'],['求体积','V＝m/ρ','由m＝ρV，两边同除以ρ：V＝m/ρ。27 g÷2.7 g/cm³＝10 cm³。']],condition:'质量和体积必须对应同一对象。比较同种均匀材料的密度时，还要留意温度、状态等条件。',units:'g和cm³配g/cm³；kg和m³配kg/m³。1 g/cm³＝1000 kg/m³。'},
gravity:{name:'重力',formula:'G＝mg',why:'每1 kg物体在同一地点受到的重力约为g N，m kg就乘以m。',symbols:[['G','重力','N'],['m','质量','kg'],['g','重力与质量的比值','N/kg']],forms:[['求重力','G＝mg','2 kg×10 N/kg＝20 N。'],['求质量','m＝G/g','两边同除以g：20 N÷10 N/kg＝2 kg。']],condition:'近地面常用g≈9.8 N/kg；本网页题设无特别说明时取10 N/kg，考试按题目给值。',units:'质量先换成kg。重力是N，质量是kg，两者不是同一个量。'},
pressure:{name:'压强',formula:'p＝F/S',why:'把垂直压在表面上的压力分到受力面积里，比较每单位面积承担多少力。',symbols:[['p','压强','Pa'],['F','压力','N'],['S','受力面积','m²']],forms:[['求压强','p＝F/S','200 N÷0.002 m²＝100000 Pa。'],['求压力','F＝pS','两边同乘S，得到F＝pS。'],['求面积','S＝F/p','由F＝pS，两边同除以p，得到S＝F/p。']],condition:'F取垂直压向接触面的压力，不一定等于物体重力。S是实际受力面积。',units:'1 Pa＝1 N/m²；1 cm²＝0.0001 m²。不要把cm²直接当m²代入。'},
liquid:{name:'液体压强',formula:'p＝ρgh',why:'同种静止液体，位置越深，上方液体产生的压强通常越大。',symbols:[['p','液体产生的压强','Pa'],['ρ','液体密度','kg/m³'],['g','重力与质量的比值','N/kg'],['h','到液面的竖直深度','m']],forms:[['求压强','p＝ρgh','水中深0.2 m：1000×10×0.2＝2000 Pa。'],['求深度','h＝p/(ρg)','两边同除以ρg，得到h＝p/(ρg)。']],condition:'静止液体、密度视为均匀；这个p不含液面上方的大气压。h量竖直深度，不沿斜面量。',units:'ρ用kg/m³，h用m，结果为Pa。'},
buoyancy:{name:'阿基米德原理',formula:'F浮＝ρ液gV排',why:'浮力大小等于物体排开的液体所受的重力；关键是排开多少，而不是物体一共有多大。',symbols:[['F浮','浮力','N'],['ρ液','液体密度','kg/m³'],['V排','排开液体体积','m³'],['g','重力与质量的比值','N/kg']],forms:[['求浮力','F浮＝ρ液gV排','排开水0.0002 m³：1000×10×0.0002＝2 N。'],['求排开体积','V排＝F浮/(ρ液g)','两边同除以ρ液g。浮力2 N对应排水0.0002 m³。']],condition:'部分浸入时，V排只取浸入液体的部分；完全浸没时才等于物体体积。适用通常浸入流体的情形，特殊密封贴底需另分析。',units:'ρ液用kg/m³，V排用m³；1 cm³＝10⁻⁶ m³。'},
lever:{name:'杠杆平衡',formula:'F₁l₁＝F₂l₂',why:'平衡时，两侧使杠杆向相反方向转动的作用相等；要同时看力和力臂。',symbols:[['F₁/F₂','动力/阻力','N'],['l₁/l₂','动力臂/阻力臂','m']],forms:[['求动力','F₁＝F₂l₂/l₁','40×0.2÷0.4＝20 N。由等式两边同除以l₁得到。'],['求动力臂','l₁＝F₂l₂/F₁','两边同除以F₁。40×0.2÷10＝0.8 m。']],condition:'杠杆平衡，力臂是支点到力作用线的垂直距离；力臂不是随便量的一段杆长。',units:'两边力臂用相同长度单位；规范代入可用m。'},
work:{name:'功',formula:'W＝Fs',why:'在这里，力越大、沿这个力方向移动越远，这个力做的功越多。',symbols:[['W','功','J'],['F','力','N'],['s','沿力方向的移动距离','m']],forms:[['求功','W＝Fs','20 N沿力方向移动3 m：20×3＝60 J。'],['求力','F＝W/s','两边同除以s（s≠0）。'],['求距离','s＝W/F','两边同除以F（F≠0）。']],condition:'适用于恒力且位移沿力方向的基础情形。托着书水平移动时，竖直托力不能直接用水平路程代入。',units:'1 J＝1 N·m。'},
power:{name:'功率',formula:'P＝W/t',why:'把做的功平均分到时间里，得到每秒做多少功；功率比较快慢，功比较总量。',symbols:[['P','功率','W（瓦）'],['W','功或电能','J'],['t','时间','s']],forms:[['求功率','P＝W/t','60 J÷3 s＝20 W。'],['求功','W＝Pt','两边同乘t。20 W×3 s＝60 J。'],['求时间','t＝W/P','由W＝Pt两边同除以P。']],condition:'量必须对应同一过程。符号W表示功，而单位W表示瓦，要根据位置分清。',units:'1 W＝1 J/s；电能还可用kWh，此时功率用kW、时间用h。'},
efficiency:{name:'机械效率',formula:'η＝W有用/W总',why:'投入的总功里，有多少真正完成了目标任务。',symbols:[['η','机械效率','比例，常写百分数'],['W有用','有用功','J'],['W总','总功','J']],forms:[['求效率','η＝W有用/W总','有用功80 J、总功100 J：80/100＝0.8＝80%。'],['求有用功','W有用＝ηW总','80%写成0.8，再乘100 J。']],condition:'同一过程，分清任务所需的有用功与投入的总功。通常实际机械效率小于100%。',units:'分子分母用相同功单位，结果无量纲；80%不能当80代入。'},
heat:{name:'升温/降温的热量',formula:'Q＝cmΔt',why:'相同物质，每千克每升高1℃需要c J；再乘质量和温升。',symbols:[['Q','吸收或放出的热量大小','J'],['c','比热容','J/(kg·℃)'],['m','质量','kg'],['Δt','温度变化的大小','℃']],forms:[['求热量','Q＝cmΔt','1 kg水升温10℃：4200×1×10＝42000 J。'],['求质量','m＝Q/(cΔt)','两边同除以cΔt，注意分母要整体相乘。'],['求温升','Δt＝Q/(cm)','两边同除以cm。温升不是末温。']],condition:'没有物态变化，c视为不变。升温用末温−初温；求放热量大小时用初温−末温。',units:'水c常取4200 J/(kg·℃)。质量kg，温差℃；平台熔化不能用该式计算相变热。'},
fuel:{name:'燃料完全燃烧放热',formula:'Q放＝mq',why:'每千克燃料完全燃烧释放q J，m kg就释放mq J。',symbols:[['Q放','完全燃烧放热','J'],['m','燃料质量','kg'],['q','热值','J/kg']],forms:[['求放热','Q放＝mq','0.1 kg燃料，热值3×10⁷ J/kg，完全燃烧释放3×10⁶ J。'],['求燃料质量','m＝Q放/q','两边同除以q。']],condition:'完全燃烧；燃料释放的热量不等于水实际吸收的热量，中间可能散热。气体按体积给热值时用Q放＝Vq。',units:'kg配J/kg，或m³配J/m³。'},
ohm:{name:'欧姆定律',formula:'I＝U/R',why:'同一段电阻两端电压更大，电流更大；同电压下，电阻更大，电流更小。',symbols:[['I','电流','A'],['U','电压','V'],['R','电阻','Ω']],forms:[['求电流','I＝U/R','6 V÷20 Ω＝0.30 A。'],['求电压','U＝IR','两边同乘R：IR＝U。0.30 A×20 Ω＝6 V。'],['求电阻','R＝U/I','由U＝IR两边同除以I（I≠0）。']],condition:'U、I、R对应同一段电路、同一状态。R＝U/I是测量关系，不表示改变U就一定改变导体R。',units:'A、V、Ω成套。1 A＝1000 mA。'},
electricpower:{name:'电功率',formula:'P＝UI',why:'电压和流过用电器的电流一起决定它消耗电能的快慢。',symbols:[['P','电功率','W'],['U','用电器两端电压','V'],['I','通过用电器的电流','A']],forms:[['求功率','P＝UI','6 V×0.30 A＝1.8 W。'],['求电流','I＝P/U','两边同除以U。'],['求电压','U＝P/I','两边同除以I。']],condition:'三个量对应同一用电器、同一工作状态。纯电阻电路还能结合欧姆定律得到P＝I²R或P＝U²/R。',units:'V×A＝W；额定功率只对应额定工作条件。'},
energy:{name:'电能',formula:'W＝Pt',why:'消耗电能的快慢乘以使用时间，就是消耗的总电能。',symbols:[['W','消耗的电能','J 或 kWh'],['P','电功率','W 或 kW'],['t','使用时间','s 或 h']],forms:[['求电能','W＝Pt','0.1 kW×2 h＝0.2 kWh。'],['求功率','P＝W/t','两边同除以t。'],['求时间','t＝W/P','两边同除以P。']],condition:'功率恒定，或P取该过程平均功率。也可用W＝UIt，需电压和电流在该过程中取相应恒定值。',units:'W（瓦）×s得J；kW×h得kWh。1度＝1 kWh＝3.6×10⁶ J。'},
joule:{name:'焦耳定律',formula:'Q＝I²Rt',why:'电流通过电阻会产生热；其他条件相同时，电流变为2倍，产生的热变为4倍。',symbols:[['Q','电流产生的热量','J'],['I','电流','A'],['R','电阻','Ω'],['t','通电时间','s']],forms:[['求电热','Q＝I²Rt','2 A、5 Ω、10 s：2²×5×10＝200 J。'],['求时间','t＝Q/(I²R)','两边同除以I²R。']],condition:'I、R视为恒定。纯电阻电路消耗的电能全部转化为内能时，才能把电能W与电热Q相等使用。',units:'I先换A，时间先换s。I²表示I×I，不是I×2。'}
};

function averageSpeedLesson(){return `<div class="lesson-demo"><h3>为什么不能随便把两段速度“加起来除以2”？</h3><p>算术平均就是把数字相加，再除以数字个数。但平均速度先看整个过程：总路程÷总时间。看两个例子。</p><div class="figure-tabs"><button data-average-speed="equal">两段时间相同</button><button data-average-speed="unequal">两段路程相同</button></div><div id="averageSpeedDiagram"></div><p id="averageSpeedReason" class="worked-example"></p></div>`}
function setupAverageSpeed(){if(!document.getElementById('averageSpeedDiagram'))return;function show(mode){const equal=mode==='equal';document.getElementById('averageSpeedDiagram').innerHTML=`<table class="help-table"><thead><tr><th>过程</th><th>速度</th><th>路程</th><th>时间</th></tr></thead><tbody><tr><td>第一段</td><td>2 m/s</td><td>2 m</td><td>1 s</td></tr><tr><td>第二段</td><td>1 m/s</td><td>${equal?'1':'2'} m</td><td>${equal?'1':'2'} s</td></tr><tr><td>全程</td><td>用总量计算</td><td>${equal?'3':'4'} m</td><td>${equal?'2':'3'} s</td></tr></tbody></table>`;document.getElementById('averageSpeedReason').innerHTML=equal?rich('全程v＝s/t＝3÷2＝1.5 m/s。这里两段时间相等，恰好也等于(2＋1)÷2＝1.5 m/s。'):rich('全程v＝s/t＝4÷3≈1.33 m/s。慢的第二段走了2秒，占更长时间；直接(2＋1)÷2得1.5，会忽略这件事。先总路程÷总时间，始终更可靠。')};app.querySelectorAll('[data-average-speed]').forEach(b=>b.onclick=()=>show(b.dataset.averageSpeed));show('unequal')}
function timingExperiment(){return `<div class="lesson-demo"><h3>做一次虚拟测平均速度：尺测路程，表测时间</h3><p>起点A到终点B沿斜面相隔0.80 m。小车经过A时开始计时，经过B时停止。即使车越滑越快，也能求这段平均速度。</p><div id="timingDrawing"></div><div class="row"><button id="timingStart">释放小车并计时</button><button class="quiet" id="timingReset">重新摆好小车</button></div><p id="timingExplain" class="worked-example"></p><p class="small">这是演示操作的理想模型，用时设为4.00 s；不是一次真实实验数据。实际实验要在对应标记处同步计时，重复测量并留意计时误差。</p></div>`}
function setupTiming(){if(!document.getElementById('timingDrawing'))return;let t=0,running=false,last=null,frame=null;const drawing=document.getElementById('timingDrawing'),play=document.getElementById('timingStart');function draw(){const p=(t/4)**2,x=55+240*p,y=55+72*p;drawing.innerHTML=`<svg viewBox="0 0 350 200" role="img" aria-label="斜面小车测平均速度，计时${t.toFixed(2)}秒"><path d="M45 70L310 150H45Z" fill="#e5ece5" stroke="#8ba18f"/><rect x="${x-10}" y="${y-7}" width="25" height="12" rx="3" fill="#6d917b" transform="rotate(17 ${x} ${y})"/><circle cx="${x-4}" cy="${y+7}" r="3" fill="#486151"/><circle cx="${x+10}" cy="${y+10}" r="3" fill="#486151"/><text x="52" y="40" font-size="13">A起点</text><text x="285" y="120" font-size="13">B终点</text><text x="175" y="100" text-anchor="middle" font-size="13">沿斜面0.80 m</text><rect x="90" y="158" width="170" height="32" rx="6" fill="#f1f5f1" stroke="#96ac9d"/><text x="175" y="179" text-anchor="middle" font-size="15">计时 ${t.toFixed(2)} s</text></svg>`;document.getElementById('timingExplain').innerHTML=t===0?'小车已放在起点。先记下路程s＝0.80 m，再启动计时。':t>=4?rich('到达B，时间t＝4.00 s。选v＝s/t，平均速度＝0.80÷4.00＝0.20 m/s。这是整段平均值，不是最后一瞬间速度。'):'计时中：小车位置变化，时间也累积。到同一个终点才停止计时。';play.disabled=running;play.textContent=t>=4?'再做一次':'释放小车并计时'}function tick(now){if(!running||!drawing.isConnected)return;if(last!==null)t=Math.min(4,t+(now-last)/1000);last=now;if(t>=4)running=false;draw();if(running)frame=requestAnimationFrame(tick)}play.onclick=()=>{cancelAnimationFrame(frame);t=0;last=null;running=true;draw();frame=requestAnimationFrame(tick)};document.getElementById('timingReset').onclick=()=>{running=false;cancelAnimationFrame(frame);t=0;last=null;draw()};draw()}
function temperatureLesson(){return `<div class="lesson-demo"><h3>把温度计摆好，再谈读数</h3><div class="figure-tabs"><button data-temperature="correct">浸入、不碰底壁</button><button data-temperature="bottom">玻璃泡碰到杯底</button><button data-temperature="out">拿出后才读</button></div><div id="temperatureDrawing"></div><p id="temperatureExplain" class="worked-example"></p><p>读数还要等示数稳定，视线与液柱顶端相平。先看每小格多少℃；从0℃向上数是正温度，向下是负温度。</p></div>`}
function setupTemperature(){if(!document.getElementById('temperatureDrawing'))return;function draw(mode){const x=175,y=mode==='out'?-28:mode==='bottom'?42:10;document.getElementById('temperatureDrawing').innerHTML=`<svg viewBox="0 0 350 200" role="img" aria-label="液体温度计${mode==='correct'?'正确放置':mode==='bottom'?'碰底':'取出'}示意"><path d="M90 58V165H260V58" fill="none" stroke="#859e8c" stroke-width="2"/><rect x="92" y="95" width="166" height="68" fill="#c1dcd9"/><g transform="translate(${mode==='out'?105:x} ${y})"><rect x="-8" y="15" width="16" height="102" rx="8" fill="#f5f8f4" stroke="#8da493"/><path d="M0 55V117" stroke="#b47f64" stroke-width="5"/><circle cx="0" cy="122" r="9" fill="#b47f64"/></g><text x="175" y="192" text-anchor="middle" font-size="13">${mode==='correct'?'玻璃泡浸在被测水中，不碰底壁':mode==='bottom'?'接触底部，可能反映底部局部温度':'离开水后，示数可能发生变化'}</text></svg>`;document.getElementById('temperatureExplain').textContent=mode==='correct'?'让玻璃泡接触被测液体，等液柱稳定，在液体中正对读数。这里画的是普通液体温度计。':mode==='bottom'?'玻璃泡不要碰底或壁，尤其有加热时底部温度可能不同。先摆正，再等稳定；不能凭这张示意图计算错读多少℃。':'普通温度计离开液体后可能与环境交换热量，读数改变。体温计等特殊仪器要按各自使用方法，不能统一拿出来读。'};app.querySelectorAll('[data-temperature]').forEach(b=>b.onclick=()=>draw(b.dataset.temperature));draw('correct')}

function rulerLesson(){return `<div class="lesson-demo"><h3>看尺子时，眼睛应该放在哪里？</h3><p>这块橡皮左端1.20 cm，右端5.60 cm，长度4.40 cm。先改变观察方向，看“看起来对着的刻度”是否可靠。</p><div id="readRulerDrawing"></div><div class="figure-tabs"><button data-eye="front">正对刻度</button><button data-eye="left">从左侧斜看</button><button data-eye="right">从右侧斜看</button><button data-eye="zero">只抄右端数字</button></div><label for="readAngle">慢慢移动视线：左侧 — 正对 — 右侧</label><input id="readAngle" type="range" min="-1" max="1" step="0.05" value="0"><p id="readRulerExplain" class="worked-example" aria-live="polite"></p><h3>1 mm分度值，是什么意思？</h3><p>相邻两条最小刻线相隔1 mm＝0.1 cm。正确使用时可估读到下一位，例如5.60 cm；末尾的0也表达读数精度。</p><h3>操作错误与误差怎么分？</h3><div class="compare-grid"><div><strong>操作错误：先纠正</strong><p>斜看、尺未贴近、只抄右端读数。重复错误操作、取平均，不能把它们修正。</p></div><div><strong>正确操作仍有误差</strong><p>人眼估读和仪器精度有限。同一长度正确测得2.31、2.33、2.32 cm，可取平均。</p></div></div><button class="quiet" id="averageStep">把三个读数合起来</button><p id="averageExplain" class="worked-example" aria-live="polite">先把这3次测量看作同一长度的重复测量，不能拿不同物体的长度来平均。</p></div>`}
function rulerView(mode,offset){const p=offset??(mode==='left'?-1:mode==='right'?1:0),eye=249+47.6444444444*p,apparent=249-32*p;let ticks='';for(let i=0;i<=70;i++){const x=25+i*4;ticks+=`<path d="M${x} 135V${i%10?143:151}" stroke="#849b8d"/>`;if(i%10===0)ticks+=`<text x="${x}" y="168" text-anchor="middle" font-size="11">${i/10}</text>`}return `<svg viewBox="0 0 350 210" role="img" aria-label="刻度尺${mode==='front'?'正视':mode==='zero'?'读数操作错误':'斜视'}示意"><rect x="25" y="133" width="280" height="42" fill="#eef3ef"/>${ticks}<rect x="73" y="76" width="176" height="25" fill="#c2d7c8"/><path d="M73 102V135M249 102V135" stroke="#819b89" stroke-dasharray="4 3"/><ellipse cx="${eye}" cy="23" rx="12" ry="6" fill="#fff" stroke="#648773"/><circle cx="${eye}" cy="23" r="3" fill="#648773"/><path d="M${eye} 23L249 90L${apparent} 135" fill="none" stroke="#bd9b64" stroke-width="2"/><text x="175" y="195" text-anchor="middle" font-size="12" fill="#486151">橡皮没动，真实长度始终4.40 cm</text></svg>`}
function setupRulerLesson(){if(!document.getElementById('readRulerDrawing'))return;const explanations={front:'正对刻度：右端5.60−左端1.20＝4.40 cm。',left:'斜看产生视差：看起来对着约6.4 cm，但橡皮并没变长。这是示意位置，先把眼睛移到刻度正前方。',right:'另一侧斜看：看起来对着约4.8 cm，读数可能偏小。仪器和物体的位置不同，具体偏差也会不同。',zero:'右端5.60 cm只是位置！左端不是0，长度必须用5.60−1.20＝4.40 cm。'};const update=(mode,offset)=>{document.getElementById('readRulerDrawing').innerHTML=rulerView(mode,offset);document.getElementById('readRulerExplain').textContent=offset===undefined?explanations[mode]:Math.abs(offset)<.001?explanations.front:'斜看时，右端看起来对着约'+(5.6-.8*offset).toFixed(2)+' cm。橡皮没有改变，正确读数仍为5.60 cm；把眼睛移到正对位置再读。';app.querySelectorAll('[data-eye]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.eye===mode)))};app.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{document.getElementById('readAngle').value=b.dataset.eye==='left'?-1:b.dataset.eye==='right'?1:0;update(b.dataset.eye)});document.getElementById('readAngle').oninput=event=>{const p=Number(event.target.value);update(p<0?'left':p>0?'right':'front',p)};let step=0;document.getElementById('averageStep').onclick=()=>{step=(step+1)%3;document.getElementById('averageExplain').textContent=['平均长度＝(2.31＋2.33＋2.32)÷3＝2.32 cm。把总读数平均分给3次测量。','先相加：2.31＋2.33＋2.32＝6.96 cm。下一步还要除以测量次数3。','再除以3：6.96÷3＝2.32 cm。不是把最大值、最小值随便相加后除以2。'][step];document.getElementById('averageStep').textContent=step===1?'再除以测量次数':step===2?'把完整计算连起来':'再走一遍'};update('front')}

function graphLesson(){return `<div class="lesson-demo"><h3>看坐标轴，再看线的意思</h3><div class="figure-tabs"><button data-graph="distance">路程—时间：匀速</button><button data-graph="stop">路程—时间：中途停下</button><button data-graph="velocity">速度—时间：匀速</button></div><div id="graphDrawing"></div><label for="graphTime">沿时间轴查看 <span id="graphTimeVal">0</span> s</label><input id="graphTime" type="range" min="0" max="6" step="1" value="0"><p id="graphExplain" class="worked-example"></p><h3>测平均速度，实验要测哪两个量？</h3><div class="unit-flow"><div><strong>标起点和终点</strong><span>尺测路程s</span><strong>同步计时t</strong></div></div><p>以小车从起点到终点为同一个过程：读出路程，记录用时，再用${formulaButton('speed')}。不能拿全程路程除以半程时间。</p></div>`}
function graphModel(mode,t){const s=mode==='stop'?(t<=2?2*t:t<=4?4:4+2*(t-4)):2*t;return {value:mode==='velocity'?2:s,explain:mode==='velocity'?`t＝${t} s时，速度仍为2 m/s。水平线表示速度不变，不是静止。`:mode==='stop'?`t＝${t} s，累计路程${s} m。2—4 s这段路程没有增加，表示停留；全程8 m÷6 s≈1.33 m/s，停留时间也包括在内。`:`t＝${t} s，路程${s} m。每秒路程增加2 m，图线倾斜且为直线，速度2 m/s。`}}
function setupGraph(){if(!document.getElementById('graphDrawing'))return;let mode='distance';const input=document.getElementById('graphTime');function draw(){const t=Number(input.value),m=graphModel(mode,t),x=48+40*t,y=mode==='velocity'?135-m.value*30:135-m.value*8;const path=mode==='velocity'?'M48 75H288':mode==='stop'?'M48 135L128 103H208L288 71':'M48 135L288 39';let labels='';for(let i=0;i<=6;i++)labels+=`<text x="${48+40*i}" y="153" font-size="10" text-anchor="middle">${i}</text>`;document.getElementById('graphDrawing').innerHTML=`<svg viewBox="0 0 350 190" role="img" aria-label="${mode==='velocity'?'速度':'路程'}—时间图像"><path d="M48 20V135H315" fill="none" stroke="#7d9687" stroke-width="2"/><path d="${path}" fill="none" stroke="#5c826b" stroke-width="3"/>${labels}<text x="310" y="175" text-anchor="middle" font-size="12">t / s</text><text x="47" y="15" text-anchor="middle" font-size="12">${mode==='velocity'?'v / (m/s)':'s / m'}</text><text x="33" y="${mode==='velocity'?79:43}" font-size="11">${mode==='velocity'?'2':'12'}</text><circle cx="${x}" cy="${y}" r="5" fill="#be9b62"/><path d="M${x} ${y}V135M48 ${y}H${x}" stroke="#bd9b64" fill="none" stroke-dasharray="4 4"/></svg>`;document.getElementById('graphTimeVal').textContent=t;document.getElementById('graphExplain').textContent=m.explain};app.querySelectorAll('[data-graph]').forEach(b=>b.onclick=()=>{mode=b.dataset.graph;draw()});input.oninput=draw;draw()}

function phaseLesson(){return `<div class="lesson-demo"><h3>只记两个问题：从什么态，变成什么态？</h3><div class="phase-choices">${phaseChanges.map((x,i)=>`<button class="quiet" data-phase="${i}">${x[0]}<small>${x[1]} → ${x[2]}</small></button>`).join('')}</div><div id="phaseDrawing"></div><div class="row"><button id="phasePlay">播放这次变化</button><button class="quiet" id="phaseReset">回到变化前</button></div><p id="phaseExplain" class="worked-example"></p><div class="compare-grid"><div><strong>吸热的三种</strong><p>熔化、汽化、升华：从外界获得能量。</p></div><div><strong>放热的三种</strong><p>凝固、液化、凝华：向外传出能量。</p></div></div><p class="small">图中用点表示同一种物质的物态变化；不是肉眼看到的真实粒子轨迹。气态点表示看不见的气体，不是白雾。</p></div>`}
function statePoints(state,p,offset){let d='';for(let i=0;i<18;i++){let x,y;if(state==='固态'){x=110+(i%6)*24;y=68+Math.floor(i/6)*24}else if(state==='液态'){x=95+(i%6)*29+Math.sin(p*4+i)*4;y=115+Math.floor(i/6)*14+Math.cos(p*3+i)*3}else{x=40+((i*47+p*32)%270);y=30+((i*31+p*21)%115)}d+=`<circle cx="${x+offset}" cy="${y}" r="5" fill="#709587"/>`}return d}
function phaseDrawing(index,progress){const c=phaseChanges[index];return `<svg viewBox="0 0 350 210" role="img" aria-label="${c[0]}：${c[1]}变为${c[2]}，${c[3]}"><text x="70" y="20" text-anchor="middle" font-size="13">${c[1]}</text><text x="175" y="20" text-anchor="middle" font-size="13">— ${c[0]} →</text><text x="280" y="20" text-anchor="middle" font-size="13">${c[2]}</text><g opacity="${1-progress}">${statePoints(c[1],progress,0)}</g><g opacity="${progress}">${statePoints(c[2],progress,0)}</g><text x="175" y="193" text-anchor="middle" font-size="13" fill="#486151">${progress===0?'变化前':progress>=1?'变化后':'变化中'} · ${c[3]} · ${c[4]}</text></svg>`}
function setupPhase(){if(!document.getElementById('phaseDrawing'))return;let index=0,p=0,running=false,last=null,frame=null;const drawing=document.getElementById('phaseDrawing'),play=document.getElementById('phasePlay');function draw(){drawing.innerHTML=phaseDrawing(index,p);document.getElementById('phaseExplain').textContent=phaseChanges[index][5];play.textContent=running?'暂停变化':'播放这次变化';app.querySelectorAll('[data-phase]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.phase)===index)))}function tick(now){if(!running||!drawing.isConnected)return;if(last!==null)p=Math.min(1,p+(now-last)/3500);last=now;if(p===1)running=false;draw();if(running)frame=requestAnimationFrame(tick)}app.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{running=false;cancelAnimationFrame(frame);index=Number(b.dataset.phase);p=0;draw()});play.onclick=()=>{if(p>=1)p=0;running=!running;last=null;if(running)frame=requestAnimationFrame(tick);else cancelAnimationFrame(frame);draw()};document.getElementById('phaseReset').onclick=()=>{running=false;cancelAnimationFrame(frame);p=0;draw()};draw()}
function boilingLesson(){return `<div class="lesson-demo"><h3>衣服慢慢变干，水烧开，都是汽化，但过程不同</h3><div class="figure-tabs"><button data-boil="evap">看蒸发</button><button data-boil="warm">水加热但还未沸腾</button><button data-boil="boil">水沸腾</button></div><div id="boilingDrawing"></div><button id="boilingPlay">播放粒子/气泡示意</button><p id="boilingExplain" class="worked-example"></p><div class="compare-grid"><div><strong>蒸发</strong><p>只在液体表面。任何温度都能进行；通常温度越高、表面积越大、表面空气流动越快，蒸发越快。蒸发吸热，可以使剩余液体降温。</p></div><div><strong>沸腾</strong><p>表面和内部同时发生。达到相应气压下的沸点，还需持续吸热。气压一定时，纯水沸腾温度保持不变，不是火越大温度就一直升。</p></div></div><p class="small">气泡大小和粒子运动均为示意；标准大气压下纯水沸点约100℃，其他气压下不一定。</p></div>`}
function boilDrawing(mode,t){let dots='';for(let i=0;i<6;i++){const x=90+i*32,y=mode==='boil'?115-((t*35+i*15)%60):55-((t*20+i*13)%38);dots+=`<circle cx="${x}" cy="${y}" r="${mode==='boil'?4+(115-y)/15:3}" fill="${mode==='boil'?'#f2f8f5':'#739a8b'}" stroke="#7ca394"/>`}return `<svg viewBox="0 0 350 190" role="img" aria-label="${mode==='evap'?'蒸发只在表面':mode==='warm'?'尚未沸腾':'沸腾发生于内部和表面'}"><path d="M65 42V135H285V42" fill="none" stroke="#789684" stroke-width="2"/><rect x="67" y="70" width="216" height="63" fill="#c0dcda"/>${dots}${mode==='evap'?'':'<path d="M160 155Q175 125 190 155Z" fill="#d4a367"/>'}<text x="175" y="178" text-anchor="middle" font-size="13">${mode==='evap'?'示例：20℃也可蒸发':mode==='warm'?'示例：加热到60℃，还未沸腾':'标准大气压：约100℃，继续吸热'}</text></svg>`}
function setupBoiling(){if(!document.getElementById('boilingDrawing'))return;let mode='evap',t=0,running=false,last=null,frame=null;const drawing=document.getElementById('boilingDrawing'),play=document.getElementById('boilingPlay');const words={evap:'液面上的水分子可以离开液体，变成气态水。温度没达到100℃，仍可蒸发；图中点是示意，不是能看见的水蒸气。',warm:'继续加热，水温上升，但还没达到相应沸点。这时仍有表面蒸发；真实水中早期小气泡也可能包含溶解空气，不能只看有无气泡判断沸腾。',boil:'内部水蒸气气泡形成、上升，表面也发生汽化。相应沸点、持续吸热两个条件要同时考虑。'};function draw(){drawing.innerHTML=boilDrawing(mode,t);document.getElementById('boilingExplain').textContent=words[mode];play.textContent=running?'暂停示意':'播放粒子/气泡示意'}function tick(now){if(!running||!drawing.isConnected)return;if(last!==null)t+=(now-last)/1000;last=now;draw();frame=requestAnimationFrame(tick)}app.querySelectorAll('[data-boil]').forEach(b=>b.onclick=()=>{mode=b.dataset.boil;draw()});play.onclick=()=>{running=!running;last=null;if(running)frame=requestAnimationFrame(tick);else cancelAnimationFrame(frame);draw()};draw()}

function storyDiagram(nodes){return `<svg viewBox="0 0 360 140" role="img" aria-label="${e(nodes.join('，'))}">${nodes.map((n,i)=>`<rect x="${8+i*120}" y="24" width="104" height="74" rx="7" fill="${i===2?'#e5efe6':'#f2f6f3'}" stroke="#a6bcac"/><foreignObject x="${14+i*120}" y="33" width="92" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="font:13px/1.5 system-ui;color:#486151;text-align:center;display:flex;align-items:center;justify-content:center;height:56px">${e(n)}</div></foreignObject>${i<2?`<path d="M${113+i*120} 61H${126+i*120}m-5-4l5 4l-5 4" fill="none" stroke="#7b9a84"/>`:''}`).join('')}</svg>`}
function topicStory(u,i){const t=topicStories[u.id+':'+i];return `<div class="lesson-story"><h3>先拿一个例子想明白</h3><p>${rich(t[0])}</p><div class="figure-tabs">${t.slice(1).map((x,j)=>`<button class="quiet" data-story="${j}" aria-pressed="${j===0}">${e(x[0])}</button>`).join('')}</div><div id="storyDrawing">${storyDiagram(t[1][1])}</div><p id="storyExplain" class="worked-example" aria-live="polite">${rich(t[1][2])}</p></div>`}
function setupStory(u,i){const t=topicStories[u.id+':'+i];app.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>{const x=t[Number(b.dataset.story)+1];document.getElementById('storyDrawing').innerHTML=storyDiagram(x[1]);document.getElementById('storyExplain').innerHTML=rich(x[2]);app.querySelectorAll('[data-story]').forEach(z=>z.setAttribute('aria-pressed',String(z===b)))})}

function inlineTeachingLab(u,title){const lab=labs[u.lab];return `<div class="lesson-demo"><h3>${e(title)}</h3><p>${e(lab.intro)}</p><div class="lab">${lab.controls}<div id="visual"></div><div id="bar"></div><p id="labReadout" aria-live="polite"></p>${dynamicLab(u)}</div><p class="small">${e(lab.note)}</p></div>`}
function teachingExtra(u,i){if(u.id===1)return [rulerLesson,conversionLesson,referenceLesson,()=>motionLesson()+averageSpeedLesson(),()=>graphLesson()+timingExperiment()][i]();const live={2:[0,2],3:[1],5:[1,4],6:[1,3],7:[0],8:[0],9:[3],10:[4],11:[0],12:[1,2,3]};if(live[u.id]?.includes(i))return inlineTeachingLab(u,'改变一个条件，看图和读数怎样变');if(u.id===4){if(i===0)return temperatureLesson();if(i===1)return phaseLesson();if(i===2)return boilingLesson();if(i===3)return `<div class="lesson-demo"><h3>从−10℃的冰开始，观察三个阶段</h3><p>先播放，再暂停在“冰水共存”时：火苗表示仍在加热，温度计却停在0℃。晶体冰正在熔化，吸热用于改变物态，温度暂不升高。</p><div class="lab">${labs.phase.controls}<div id="visual"></div><div id="bar"></div><p id="labReadout"></p>${dynamicLab(u)}</div><p class="small">这个进度不是真实秒数；相同气压下的理想化冰熔化示意。非晶体没有固定熔点。</p></div>`;if(i===4)return phaseLesson()}
if(u.id===3&&i===4)return supplement(u);if(u.id===5&&i===5)return supplement(u);if(u.id===10&&(i===1||i===2))return supplement(u);const diagrams={3:[1],5:[4],6:[3],7:[0],8:[0],9:[3],11:[0],12:[2,3]};return diagrams[u.id]?.includes(i)?`<figure class="picture">${introDiagram(u.id)}<figcaption>${e(intros[u.id].question)}</figcaption></figure>`:''}
function knowledgeLesson(u,i){const c=u.concepts[i],sentences=c[1].split('。').filter(Boolean),formulas=topicFormulas[u.id]?.[i]||[];return `<h2>${e(c[0])}</h2><p class="key">${rich(u.focus[i])}</p>${topicStory(u,i)}${teachingExtra(u,i)}<section class="lesson-explanation"><h3>把刚才的道理说清楚</h3>${sentences.map(x=>'<p>'+rich(x+'。')+'</p>').join('')}</section>${formulas.map(formulaCard).join('')}<div class="reading-confirm"><p class="small">这一节先读到这里。你可以按自己的感觉留下记录，随时撤销。</p><button id="confirmRead" class="quiet">${readSections[u.id]?.has(i)?'✓ 已确认读完 · 撤销标记':'这一节我读完了'}</button><p id="readingMessage" class="small" aria-live="polite"></p></div>`}
function setupKnowledgeLesson(u,i){setupStory(u,i);setupRulerLesson();setupConversion();setupReference();setupGraph();setupPhase();setupBoiling();setupAverageSpeed();setupTiming();setupTemperature();if(document.getElementById('motionTrack'))setupMotionLesson();if(document.getElementById('labReadout')){setupLab(u);if(document.getElementById('dynamicDrawing'))setupDynamicLab(u);if(u.id===12){const mode=document.getElementById('mode');mode.value=i===2?'motor':i===3?'generator':'coil';mode.dispatchEvent(new Event('input'))}}if(document.getElementById('lampMode')||document.getElementById('lensU')||document.getElementById('immersion'))setupSupplement(u);document.getElementById('confirmRead').onclick=()=>{const set=readSections[u.id]??=savedSections(u.id),already=set.has(i);if(already)set.delete(i);else set.add(i);saveRead(u.id);document.getElementById('confirmRead').textContent=already?'这一节我读完了':'✓ 已确认读完 · 撤销标记';document.getElementById('readingMessage').textContent=already?'标记已经撤销，按自己的节奏再看就好。':'这一步留下了记录。可以继续下一节，也可以回看一个例子。';refreshSectionStatus(u)}}
function refreshSectionStatus(u){app.querySelectorAll('[data-section]').forEach(b=>{const i=Number(b.dataset.section),read=readSections[u.id]?.has(i);b.dataset.read=String(!!read);b.querySelector('small').textContent=i===clue?(read?'正在看 · 已确认':'正在看'):read?'✓ 已确认读完':'○ 待阅读'})}
